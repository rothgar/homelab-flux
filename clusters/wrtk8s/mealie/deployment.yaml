apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      initContainers:
        # NFS exports mount 777 with root_squash, so files Mealie writes can end
        # up owned by another uid and fail subsequent reads. Mealie runs as 911.
        - name: fix-data-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 911:911 /app/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.19.2
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: BASE_URL
              value: https://food.gerbil-dragon.ts.net
            - name: ALLOW_SIGNUP
              value: "false"
            - name: DB_ENGINE
              value: sqlite
          ports:
            - containerPort: 9000
              name: http
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
spec:
  type: ClusterIP
  selector:
    app: mealie
  ports:
    - port: 80
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-tailscale
  namespace: mealie
spec:
  ingressClassName: tailscale
  rules:
    - host: food
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 80
  tls:
    - hosts:
        - food
