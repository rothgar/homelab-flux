---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc
  namespace: mealie
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: mealie-oidc
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: mealie_mealie-oidc/client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: mealie_mealie-oidc/client-secret
