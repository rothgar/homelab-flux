apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: controld-api-key
  namespace: controld-exporter
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: controld-api-key
  data:
    - secretKey: api-key
      remoteRef:
        key: controld-exporter_controld-api-key/api-key
