---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring_grafana-admin/username
    - secretKey: admin-password
      remoteRef:
        key: monitoring_grafana-admin/password
---
# tsidp OIDC client (registered via DCR) + role mapping: the 1Password
# admin-email gets GrafanaAdmin, everyone else Viewer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-oauth
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .clientId }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "email == '{{ .adminEmail }}' && 'GrafanaAdmin' || 'Viewer'"
  data:
    - secretKey: clientId
      remoteRef:
        key: monitoring_grafana-oidc/client-id
    - secretKey: clientSecret
      remoteRef:
        key: monitoring_grafana-oidc/client-secret
    - secretKey: adminEmail
      remoteRef:
        key: monitoring_grafana-admin/admin-email
