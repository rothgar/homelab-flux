apiVersion: v1
kind: ConfigMap
metadata:
  name: synology-snmp-auths
  namespace: monitoring
data:
  # Overlay merged on top of snmp_exporter's built-in snmp.yml. Adds a v3
  # auth block used by scrapeconfig's `auth=synology_v3` param.
  auths.yml: |
    auths:
      synology_v3:
        version: 3
        security_level: authNoPriv
        username: ${SNMP_USERNAME}
        password: ${SNMP_PASSWORD}
        auth_protocol: SHA
  # HOST-RESOURCES-MIB module — the built-in snmp.yml doesn't include it, but
  # dashboard 14284 uses hrSystemProcesses and hrStorage* for the Processes and
  # Filesystem panels.
  hr_mib.yml: |
    modules:
      hr_mib:
        walk:
          - 1.3.6.1.2.1.25.1.6      # hrSystemProcesses
          - 1.3.6.1.2.1.25.2.3      # hrStorageTable
        metrics:
          - name: hrSystemProcesses
            oid: 1.3.6.1.2.1.25.1.6
            type: gauge
            help: Number of process contexts currently loaded or running
            indexes:
              - labelname: hrSystemProcessesIndex
                type: gauge
                fixed_size: 1
                implied: true
          - name: hrStorageAllocationUnits
            oid: 1.3.6.1.2.1.25.2.3.1.4
            type: gauge
            help: Size in bytes of each allocation unit for this storage entry
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageSize
            oid: 1.3.6.1.2.1.25.2.3.1.5
            type: gauge
            help: Size of the storage represented by this entry in allocation units
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageUsed
            oid: 1.3.6.1.2.1.25.2.3.1.6
            type: gauge
            help: Amount of storage in use in allocation units
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString
            help: A description of the type and instance of the storage
            indexes:
              - labelname: hrStorageIndex
                type: gauge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
    spec:
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.30.0
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml
            - --config.file=/etc/snmp_exporter/auths.yml
            - --config.file=/etc/snmp_exporter/hr_mib.yml
            - --config.expand-environment-variables
          env:
            - name: SNMP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: synology-snmp
                  key: username
            - name: SNMP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synology-snmp
                  key: password
          ports:
            - containerPort: 9116
              name: http
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9116
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: auths
              mountPath: /etc/snmp_exporter/auths.yml
              subPath: auths.yml
              readOnly: true
            - name: auths
              mountPath: /etc/snmp_exporter/hr_mib.yml
              subPath: hr_mib.yml
              readOnly: true
      volumes:
        - name: auths
          configMap:
            name: synology-snmp-auths
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
spec:
  selector:
    app: snmp-exporter
  ports:
    - port: 9116
      targetPort: 9116
      name: http
