apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: synology
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  metricsPath: /snmp
  scrapeInterval: 60s
  scrapeTimeout: 30s
  params:
    # Dashboard 14284 needs Synology-private MIBs + UCD-SNMP-MIB (ssCpuUser,
    # hrStorageDescr) + IF-MIB (ifName, ifInOctets) all in one scrape.
    module: [synology, if_mib, ucd_system_stats, ucd_memory, hr_mib]
    auth: [synology_v3]
  staticConfigs:
    - targets:
        - 10.1.1.4
      labels:
        instance: synology-nas
  relabelings:
    # Standard snmp_exporter pattern: source target becomes __param_target,
    # scrape address becomes the exporter service.
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter.monitoring.svc.cluster.local:9116
