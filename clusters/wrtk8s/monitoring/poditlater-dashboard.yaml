apiVersion: v1
kind: ConfigMap
metadata:
  name: poditlater-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  poditlater.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Users",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "poditlater_users_total",
              "legendFormat": "Users"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Articles by Status",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "targets": [
            {
              "expr": "poditlater_articles_total",
              "legendFormat": "{{ status }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "blue", "value": null }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Articles Submitted (rate/5m)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "targets": [
            {
              "expr": "rate(poditlater_articles_submitted_total[5m])",
              "legendFormat": "submitted/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "purple", "value": null }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Go Goroutines",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "go_goroutines{job=\"poditlater\"}",
              "legendFormat": "goroutines"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "orange", "value": null }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Heap Memory Usage",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "targets": [
            {
              "expr": "go_memstats_heap_alloc_bytes{job=\"poditlater\"}",
              "legendFormat": "heap"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "steps": [
                  { "color": "yellow", "value": null }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "HTTP Request Rate by Path",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "rate(poditlater_http_requests_total[5m])",
              "legendFormat": "{{ method }} {{ path }} ({{ code }})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        },
        {
          "title": "HTTP Request Duration p50 / p95 / p99",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(poditlater_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(poditlater_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(poditlater_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        },
        {
          "title": "HTTP Requests Total by Status Code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "sum by (code) (rate(poditlater_http_requests_total[5m]))",
              "legendFormat": "{{ code }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 50,
                "stacking": { "mode": "normal" }
              }
            },
            "overrides": []
          }
        },
        {
          "title": "ATProto Directory Cache Hit Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "rate(atproto_directory_handle_cache_hits[5m])",
              "legendFormat": "handle hits"
            },
            {
              "expr": "rate(atproto_directory_handle_cache_misses[5m])",
              "legendFormat": "handle misses"
            },
            {
              "expr": "rate(atproto_directory_identity_cache_hits[5m])",
              "legendFormat": "identity hits"
            },
            {
              "expr": "rate(atproto_directory_identity_cache_misses[5m])",
              "legendFormat": "identity misses"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["poditlater", "atproto"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "Poditlater",
      "uid": "poditlater"
    }
