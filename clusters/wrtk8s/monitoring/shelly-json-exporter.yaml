apiVersion: v1
kind: ConfigMap
metadata:
  name: shelly-json-exporter
  namespace: monitoring
data:
  config.yml: |
    modules:
      shelly:
        # Scrape /rpc/Shelly.GetStatus which returns metering + system info
        # in one JSON blob. Keys like `switch:0` need bracket notation.
        metrics:
          - name: shelly_power_watts
            path: '{ .["switch:0"].apower }'
            help: Active power in watts.
            type: gauge
          - name: shelly_voltage_volts
            path: '{ .["switch:0"].voltage }'
            help: Line voltage.
            type: gauge
          - name: shelly_current_amps
            path: '{ .["switch:0"].current }'
            help: Instantaneous current draw.
            type: gauge
          - name: shelly_frequency_hertz
            path: '{ .["switch:0"].freq }'
            help: AC frequency.
            type: gauge
          - name: shelly_energy_watthours_total
            path: '{ .["switch:0"].aenergy.total }'
            help: Cumulative delivered energy in watt-hours (counter).
            type: counter
          - name: shelly_returned_energy_watthours_total
            path: '{ .["switch:0"].ret_aenergy.total }'
            help: Cumulative returned energy in watt-hours (counter).
            type: counter
          - name: shelly_temperature_celsius
            path: '{ .["switch:0"].temperature.tC }'
            help: Internal device temperature.
            type: gauge
          - name: shelly_switch_output
            path: '{ .["switch:0"].output }'
            help: Relay state (1 = on, 0 = off).
            type: gauge
          - name: shelly_wifi_rssi
            path: '{ .wifi.rssi }'
            help: WiFi signal strength.
            type: gauge
          - name: shelly_uptime_seconds
            path: '{ .sys.uptime }'
            help: Seconds since last boot.
            type: counter
          - name: shelly_cloud_connected
            path: '{ .cloud.connected }'
            help: 1 = connected to Shelly cloud, 0 = not connected.
            type: gauge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelly-json-exporter
  namespace: monitoring
  labels:
    app: shelly-json-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shelly-json-exporter
  template:
    metadata:
      labels:
        app: shelly-json-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.7.0
          args:
            - --config.file=/config/config.yml
          ports:
            - containerPort: 7979
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: shelly-json-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: shelly-json-exporter
  namespace: monitoring
  labels:
    app: shelly-json-exporter
spec:
  selector:
    app: shelly-json-exporter
  ports:
    - port: 7979
      targetPort: http
      name: http
