apiVersion: v1
kind: ConfigMap
metadata:
  name: shelly-json-exporter
  namespace: monitoring
data:
  config.yml: |
    modules:
      shelly:
        # Scrape /rpc/Switch.GetStatus?id=0 which returns metering fields at
        # the top level (json_exporter's kubectl-style jsonpath doesn't handle
        # colon-in-key names like `switch:0` cleanly).
        metrics:
          - name: shelly_power_watts
            path: '{ .apower }'
            help: Active power in watts.
            type: value
            valuetype: gauge
          - name: shelly_voltage_volts
            path: '{ .voltage }'
            help: Line voltage.
            type: value
            valuetype: gauge
          - name: shelly_current_amps
            path: '{ .current }'
            help: Instantaneous current draw.
            type: value
            valuetype: gauge
          - name: shelly_frequency_hertz
            path: '{ .freq }'
            help: AC frequency.
            type: value
            valuetype: gauge
          - name: shelly_energy_watthours_total
            path: '{ .aenergy.total }'
            help: Cumulative delivered energy in watt-hours (counter).
            type: value
            valuetype: counter
          - name: shelly_returned_energy_watthours_total
            path: '{ .ret_aenergy.total }'
            help: Cumulative returned energy in watt-hours (counter).
            type: value
            valuetype: counter
          - name: shelly_temperature_celsius
            path: '{ .temperature.tC }'
            help: Internal device temperature.
            type: value
            valuetype: gauge
          - name: shelly_switch_output
            path: '{ .output }'
            help: Relay state (1 = on, 0 = off).
            type: value
            valuetype: gauge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelly-json-exporter
  namespace: monitoring
  labels:
    app: shelly-json-exporter
  annotations:
    # json_exporter reads its config once at startup, so pick up ConfigMap
    # edits via a controlled restart from stakater/reloader.
    configmap.reloader.stakater.com/reload: shelly-json-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shelly-json-exporter
  template:
    metadata:
      labels:
        app: shelly-json-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.7.0
          args:
            - --config.file=/config/config.yml
          ports:
            - containerPort: 7979
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: shelly-json-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: shelly-json-exporter
  namespace: monitoring
  labels:
    app: shelly-json-exporter
spec:
  selector:
    app: shelly-json-exporter
  ports:
    - port: 7979
      targetPort: http
      name: http
