apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=65.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    # Node Exporter - enable hwmon for CPU temperatures
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      extraArgs:
        - --collector.hwmon
      hostRootFsMount:
        enabled: true
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance
              action: replace
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: nodename
              action: replace

    # Prometheus configuration
    prometheus:
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    # Grafana configuration
    grafana:
      enabled: true
      # Local admin is break-glass only; normal login is Tailscale via tsidp.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Client creds + role mapping (keeps the admin email out of git).
      envFromSecrets:
        - name: grafana-oauth
      # Pods can't resolve *.ts.net; route tsidp via the pinned egress IP
      # (romm/tsidp-egress.yaml).
      hostAliases:
        - ip: 10.96.200.43
          hostnames: [tsidp.gerbil-dragon.ts.net]
      persistence:
        enabled: true
        size: 1Gi
        storageClass: nfs-synology
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: utc
      service:
        type: LoadBalancer
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Viewer
        server:
          root_url: https://grafana.jgarr.net
        auth.generic_oauth:
          enabled: true
          name: Tailscale
          allow_sign_up: true
          auto_login: false
          scopes: openid profile email
          auth_url: https://tsidp.gerbil-dragon.ts.net/authorize
          token_url: https://tsidp.gerbil-dragon.ts.net/token
          api_url: https://tsidp.gerbil-dragon.ts.net/userinfo
          use_pkce: true
          email_attribute_path: email
          login_attribute_path: username
          name_attribute_path: username
          allow_assign_grafana_admin: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          raspberry-pi:
            gnetId: 10578
            revision: 1
            datasource: Prometheus
          node-exporter-full:
            gnetId: 1860
            revision: 37
            datasource: Prometheus

    # AlertManager - disable if not needed
    alertmanager:
      enabled: true
      alertmanagerSpec:
        # Two gossiping replicas (chart default anti-affinity spreads them) so
        # alerts still fire when the node hosting one goes down.
        replicas: 2
