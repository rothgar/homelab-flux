---
# Backend Service that the Ingress targets. Plain ClusterIP, HTTP on 8081.
apiVersion: v1
kind: Service
metadata:
  name: mecatl-http
  namespace: mecatl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mecak8s
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
# Tailscale Ingress: operator provisions a proxy that terminates TLS with
# a tailnet-issued cert and forwards decrypted HTTP to mecatl-http:8081.
# Necessary because mecak8s speaks plain HTTP on 8081 (security.tls-
# TerminatedUpstream=true) and the previous tailscale.com/expose Service
# was only L4 DNAT — TLS clients like mecatui got "not a TLS handshake".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mecatl
  namespace: mecatl
spec:
  ingressClassName: tailscale
  tls:
    # `tailscale` IngressClass treats the first `tls.hosts[0]` value as
    # the MagicDNS hostname to register (matches operator docs). Cert is
    # provisioned automatically by the tailscale control plane.
    - hosts:
        - mecatl
  defaultBackend:
    service:
      name: mecatl-http
      port:
        number: 8081
