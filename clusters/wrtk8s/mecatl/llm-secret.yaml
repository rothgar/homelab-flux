---
# Placeholder LLM API key. `ai.gerbil-dragon.ts.net` on the tailnet is
# assumed to be an open OpenAI-compatible endpoint (Ollama / vLLM / LiteLLM)
# so the value here is a stub — cliconfig still requires the env var to be
# present for provider selection.
#
# To swap in a real key later, replace with an ExternalSecret pulling from
# 1Password (see clusters/wrtk8s/omni/external-secret.yaml for the ESO
# pattern).
apiVersion: v1
kind: Secret
metadata:
  name: mecatl-llm
  namespace: mecatl
type: Opaque
stringData:
  OPENAI_API_KEY: placeholder
