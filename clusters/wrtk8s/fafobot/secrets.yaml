# Requires 1Password item (per [[eso-onepassword]] convention) in vault wrtk8s,
# item fafobot_fafobot-secrets, one field per variable:
#   BLUESKY_IDENTIFIER    — the Bluesky handle the bot posts as (e.g. name.bsky.social)
#   BLUESKY_APP_PASSWORD  — Bluesky app password
#   MASTODON_BASE_URL     — https://<server> the bot's Mastodon account is on
#   MASTODON_ACCESS_TOKEN — token of an app created by that account (scopes:
#                           read:notifications read:statuses write:media
#                           write:statuses write:favourites)
# Other platforms: add fields named like the variables in fafofm-bot's README and
# list them below. The Signal account needs no secret: signal-cli is linked by QR code.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fafobot-secrets
  namespace: fafobot
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: fafobot-secrets
  data:
    - secretKey: BLUESKY_IDENTIFIER
      remoteRef:
        key: fafobot_fafobot-secrets/BLUESKY_IDENTIFIER
    - secretKey: BLUESKY_APP_PASSWORD
      remoteRef:
        key: fafobot_fafobot-secrets/BLUESKY_APP_PASSWORD
    - secretKey: MASTODON_BASE_URL
      remoteRef:
        key: fafobot_fafobot-secrets/MASTODON_BASE_URL
    - secretKey: MASTODON_ACCESS_TOKEN
      remoteRef:
        key: fafobot_fafobot-secrets/MASTODON_ACCESS_TOKEN
