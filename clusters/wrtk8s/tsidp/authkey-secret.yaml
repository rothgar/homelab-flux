---
# 1Password item shape (wrtk8s vault):
#   item name:  tsidp-authkey
#   field:      authkey
#   value:      tskey-auth-xxxxxxxxxxxxxxxx   (or tskey-client-... for
#                                              OAuth client secret)
# See [[eso-onepassword]] memory for the key: <item>/<field> convention.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tsidp-authkey
  namespace: tsidp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tsidp-authkey
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: tsidp-authkey/authkey
