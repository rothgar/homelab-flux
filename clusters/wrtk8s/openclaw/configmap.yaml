apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token",
          "allowTailscale": true
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": ["*"]
        }
      },
      "models": {
        "providers": {
          "ollama": {
            "baseUrl": "http://ollama.ollama.svc.cluster.local:11434",
            "apiKey": "ollama",
            "api": "ollama",
            "models": [
              {
                "id": "qwen2.5:3b",
                "name": "Qwen 2.5 3B",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 32768,
                "maxTokens": 8192
              },
              {
                "id": "qwen2.5-coder:3b",
                "name": "Qwen 2.5 Coder 3B",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 32768,
                "maxTokens": 8192
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace"
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          },
          {
            "id": "ollama",
            "name": "Ollama Local",
            "model": "ollama/qwen2.5:3b",
            "workspace": "~/.openclaw/workspace/ollama"
          }
        ]
      },
      "cron": { "enabled": false },
      "channels": {
        "whatsapp": {
          "dmPolicy": "allowlist",
          "allowFrom": ["+16267869019"],
          "groupPolicy": "allowlist",
          "groupAllowFrom": ["+16267869019"]
        }
      }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
