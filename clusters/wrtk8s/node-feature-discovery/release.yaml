apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 5m
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: nfd
        namespace: node-feature-discovery
  values:
    # Defaults are fine: master + worker DaemonSet + GC. Rules picked up
    # from NodeFeatureRule CRs (see amdgpu-rule.yaml). Sticks to the
    # default `feature.node.kubernetes.io/` label namespace so we don't
    # need to widen the allowlist.
    master:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    worker:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
