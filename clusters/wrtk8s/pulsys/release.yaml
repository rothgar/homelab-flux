apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulsys
  namespace: pulsys
spec:
  interval: 5m
  chart:
    spec:
      chart: deploy/charts/pulsys
      sourceRef:
        kind: GitRepository
        name: pulsys
        namespace: pulsys
  values:
    image:
      # Upstream ghcr.io/pulsys-io/pulsys is private, so we mirror the
      # source-built image (deploy/docker/Dockerfile at tag v0.1.4) to the
      # local unauth registry. Rebuild + repush when bumping the version.
      repository: cr.jgarr.net/pulsys-io/pulsys
      tag: "0.1.4"

    proxy:
      # HF clients don't require TLS; MetalLB LB below exposes :80 → :8080.
      publicBaseURL: http://hf.jgarr.net
      logLevel: info

    admin:
      enabled: true
      tenant: default
      imports:
        worker: true
        hfTokenSecret: pulsys-hf-token

    postgres:
      existingSecret: pulsys-pg-app
      existingSecretKey: uri

    persistence:
      enabled: true
      existingClaim: pulsys-cache

    service:
      type: ClusterIP
      port: 8080
      adminPort: 6060

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 2Gi
