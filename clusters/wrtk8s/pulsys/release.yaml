apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulsys
  namespace: pulsys
spec:
  interval: 5m
  chart:
    spec:
      chart: deploy/charts/pulsys
      sourceRef:
        kind: GitRepository
        name: pulsys
        namespace: pulsys
  values:
    image:
      # Chart is pinned to the merge commit for PR #47 (see source.yaml).
      # Image tag is set explicitly since the chart's appVersion doesn't
      # move in lockstep with releases. 0.1.5 adds the admin console + a
      # dev Keycloak so PATs can be minted via UI instead of psql INSERTs.
      repository: ghcr.io/pulsys-io/pulsys
      tag: "0.1.5"

    console:
      # The chart defaults console.image.tag to Chart.AppVersion (still 0.1.4
      # even on the b21522f2 commit) — but ghcr.io/pulsys-io/pulsys-console
      # only started shipping at 0.1.5, so the default resolves to a
      # non-existent tag. Pin it explicitly.
      image:
        tag: "0.1.5"

    proxy:
      # HF clients don't require TLS; MetalLB LB below exposes :80 → :8080.
      publicBaseURL: http://hf.jgarr.net
      logLevel: info

    admin:
      enabled: true
      tenant: default
      imports:
        worker: true
        hfTokenSecret: pulsys-hf-token

    postgres:
      existingSecret: pulsys-pg-app
      existingSecretKey: uri

    persistence:
      enabled: true
      existingClaim: pulsys-cache

    service:
      type: ClusterIP
      port: 8080
      adminPort: 6060

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 2Gi
