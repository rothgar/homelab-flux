apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: pulsys
  namespace: pulsys
spec:
  interval: 1h
  url: https://github.com/pulsys-io/pulsys
  ref:
    # v0.1.5 was cut a day before PR #47 (chart duplicate-label fix) merged,
    # so that tag still has the bug flux's helm-controller rejects. Pin to
    # the merge commit until upstream cuts v0.1.6.
    commit: 3699fc08ad5f94e92b838aa7cfbc9399b1e88cf0
  ignore: |
    /*
    !/deploy/charts/pulsys
