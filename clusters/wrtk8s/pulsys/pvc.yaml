# synology-iscsi (block-level) is ~5-10x faster than nfs-synology for
# the large-file random I/O pulsys does as a pull-through cache. Pulsys
# runs as UID 65532 with fsGroup 65532 in podSecurityContext, so kubelet
# chowns the iSCSI mount on attach — no chown Job needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulsys-cache
  namespace: pulsys
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-iscsi
  resources:
    requests:
      storage: 100Gi
