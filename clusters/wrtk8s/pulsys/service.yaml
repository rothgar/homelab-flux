# Public data-plane exposure via MetalLB. Kept separate from the chart's
# ClusterIP Service so the admin port (6060) stays internal — the chart
# combines data + admin ports on one Service, and exposing that as LB
# would publish /admin/api/v1 and /metrics.
apiVersion: v1
kind: Service
metadata:
  name: pulsys-lb
  namespace: pulsys
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hf.jgarr.net
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: pulsys
    app.kubernetes.io/instance: pulsys
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Tailscale-only exposure for the admin console. Using an Ingress
# (ingressClassName: tailscale) rather than a Service-annotation so the
# tailscale operator does actual TLS termination — https://pulsys.<tailnet>.ts.net/
# is a secure origin, which the console's PKCE flow needs (crypto.subtle
# is undefined on plain http:// non-localhost).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsys-console-tailscale
  namespace: pulsys
spec:
  ingressClassName: tailscale
  rules:
    - host: pulsys
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulsys-console
                port:
                  number: 80
  tls:
    - hosts:
        - pulsys
