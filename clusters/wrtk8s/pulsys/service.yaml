# Public data-plane exposure via MetalLB. Kept separate from the chart's
# ClusterIP Service so the admin port (6060) stays internal — the chart
# combines data + admin ports on one Service, and exposing that as LB
# would publish /admin/api/v1 and /metrics.
apiVersion: v1
kind: Service
metadata:
  name: pulsys-lb
  namespace: pulsys
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hf.jgarr.net
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: pulsys
    app.kubernetes.io/instance: pulsys
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Tailscale-only exposure for the admin console. The helm chart owns
# svc/pulsys-console (ClusterIP); annotating it directly would get
# overwritten on reconcile, so this is a parallel Service selecting the
# same pod. Ends up as https://pulsys.<tailnet>.ts.net/ — a secure
# context, which the console's PKCE flow needs (crypto.subtle isn't
# available on plain http://<lan-ip>).
apiVersion: v1
kind: Service
metadata:
  name: pulsys-console-tailscale
  namespace: pulsys
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "pulsys"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulsys-console
    app.kubernetes.io/instance: pulsys
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
