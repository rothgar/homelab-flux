apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pulsys-pg
  namespace: pulsys
spec:
  instances: 1
  # Single-instance homelab DB — the auto-generated PDB (minAvailable=1) blocks
  # node drains during Talos upgrades. Disable it so drain proceeds; the ~30s
  # postgres restart on a new node is acceptable downtime.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: pulsys
      owner: pulsys

  storage:
    size: 5Gi
    storageClass: nfs-synology

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
