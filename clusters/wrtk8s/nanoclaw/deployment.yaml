apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanoclaw
  namespace: nanoclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nanoclaw
  template:
    metadata:
      labels:
        app: nanoclaw
    spec:
      containers:
        - name: nanoclaw
          image: ghcr.io/rothgar/nanoclaw:main
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: CONTAINER_IMAGE
              value: ghcr.io/rothgar/nanoclaw-agent:main
            - name: ASSISTANT_NAME
              valueFrom:
                configMapKeyRef:
                  name: nanoclaw-config
                  key: ASSISTANT_NAME
                  optional: true
            - name: TZ
              value: America/Los_Angeles
          volumeMounts:
            - name: env-secret
              mountPath: /app/.env
              subPath: .env
              readOnly: true
            - name: data
              mountPath: /app/store
              subPath: store
            - name: data
              mountPath: /app/groups
              subPath: groups
            - name: data
              mountPath: /app/data
              subPath: data
            - name: config
              mountPath: /home/nanoclaw/.config/nanoclaw
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 4Gi
      volumes:
        - name: env-secret
          secret:
            secretName: nanoclaw-credentials
        - name: data
          persistentVolumeClaim:
            claimName: nanoclaw-data
        - name: config
          configMap:
            name: nanoclaw-config
            items:
              - key: mount-allowlist.json
                path: mount-allowlist.json
              - key: sender-allowlist.json
                path: sender-allowlist.json
        - name: dind-storage
          emptyDir: {}
