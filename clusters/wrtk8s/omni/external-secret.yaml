apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omni-factory-creds
  namespace: omni
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: omni-factory-creds
  data:
    # Create in 1Password as an item named `omni-factory-creds` with two
    # fields (`username`, `password`) — Sidero-supplied Enterprise Image
    # Factory credentials. See [[eso-onepassword]] for the key-format
    # convention this uses (`<item>/<field>`, no `property`).
    - secretKey: username
      remoteRef:
        key: omni-factory-creds/username
    - secretKey: password
      remoteRef:
        key: omni-factory-creds/password
