# Tailscale operator OAuth credentials. Originally created out-of-band
# with `kubectl create secret ...` at the initial deploy; sourced from
# 1Password via ESO now so the next ns rename (or accidental prune)
# doesn't lose it. The chart's default expected name is `operator-oauth`
# with keys `client_id` + `client_secret`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale_operator-oauth/client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale_operator-oauth/client_secret
