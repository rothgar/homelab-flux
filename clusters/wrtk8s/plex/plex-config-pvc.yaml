apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: plex
spec:
  # iSCSI (block) instead of node-local local-path: Plex's DB is SQLite
  # with heavy fsync/small-write patterns and node-pinned storage means
  # the pod can't reschedule onto other amdgpu-labelled workers. iSCSI
  # lets any node NFD tags with `feature.node.kubernetes.io/amdgpu-present=true`
  # reattach the same volume. Restic restore in the initContainer still
  # works the same.
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-iscsi
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-backup
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-synology
  resources:
    requests:
      storage: 50Gi
