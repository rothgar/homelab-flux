apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
spec:
  replicas: 1
  strategy:
    # Recreate — iSCSI RWO can't be handed off during a rolling upgrade,
    # kubelet on the old node blocks the new pod's Attach.
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      priorityClassName: plex-high-priority
      # AMD VAAPI transcoding on any node NFD flags as having an AMD
      # display controller (see node-feature-discovery/amdgpu-rule.yaml).
      # Currently only mini; add more AMD-accelerator nodes and NFD will
      # label them within a scan cycle. NVIDIA GPU slot on mini stays
      # free for whisper-webui.
      nodeSelector:
        feature.node.kubernetes.io/amdgpu-present: "true"
      securityContext:
        # 44 = video (Debian/Ubuntu convention, matches /dev/dri owner),
        # 109 = render (needed for the renderD128 node itself). The
        # linuxserver.io Plex image runs as PUID/PGID 1027/100, neither
        # of which is in these groups by default, so add them explicitly.
        supplementalGroups: [44, 109]
      initContainers:
        - name: restore-backup
          image: restic/restic:0.19.1
          command:
            - sh
            - -c
            - |
              if [ -d "/config/Library" ] && [ "$(ls -A /config/Library 2>/dev/null)" ]; then
                echo "Config already exists, skipping restore"
                exit 0
              fi
              echo "Config is empty, attempting restore from backup..."
              export RESTIC_REPOSITORY=/backup
              export RESTIC_PASSWORD=plex-volsync-backup
              if restic snapshots --json | grep -q '"time"'; then
                echo "Found snapshots, restoring latest..."
                restic restore latest --target /
                echo "Restore complete"
              else
                echo "No snapshots found, starting fresh"
              fi
          volumeMounts:
            - name: data
              mountPath: /config/Library/Application Support
            - name: backup
              mountPath: /backup
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:1.43.4.10903-e5521bd8c-ls325
          ports:
            - containerPort: 32400
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: PUID
              value: "1027"
            - name: PGID
              value: "100"
            - name: DEBUG
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /config/Library/Application Support
            - name: transcode
              mountPath: /transcode
            - name: dri
              mountPath: /dev/dri
            - name: movies
              mountPath: /data/movies
            - name: music
              mountPath: /data/music
            - name: pictures
              mountPath: /data/pictures
            - name: tv
              mountPath: /data/tv
            - name: audiobooks
              mountPath: /data/audiobooks
            - name: education
              mountPath: /data/education
            - name: shorts
              mountPath: /data/shorts
            - name: soundtracks
              mountPath: /data/soundtracks
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: plex-config
        - name: backup
          persistentVolumeClaim:
            claimName: plex-config-backup
        - name: transcode
          emptyDir: {}
        - name: dri
          hostPath:
            path: /dev/dri
        - name: movies
          persistentVolumeClaim:
            claimName: plex-movies
        - name: music
          persistentVolumeClaim:
            claimName: plex-music
        - name: pictures
          persistentVolumeClaim:
            claimName: plex-pictures
        - name: tv
          persistentVolumeClaim:
            claimName: plex-tv
        - name: audiobooks
          persistentVolumeClaim:
            claimName: plex-audiobooks
        - name: education
          persistentVolumeClaim:
            claimName: plex-education
        - name: shorts
          persistentVolumeClaim:
            claimName: plex-shorts
        - name: soundtracks
          persistentVolumeClaim:
            claimName: plex-soundtracks
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: plex
spec:
  type: LoadBalancer
  selector:
    app: plex
  ports:
    - name: plex
      port: 32400
      targetPort: 32400
---
apiVersion: v1
kind: Service
metadata:
  name: plex-ts
  namespace: plex
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "plex"
spec:
  type: ClusterIP
  selector:
    app: plex
  ports:
    - name: https
      port: 443
      targetPort: 32400
