apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-iscsi
  namespace: iscsi-csi
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-iscsi
      sourceRef:
        kind: HelmRepository
        name: csi-driver-iscsi
        namespace: iscsi-csi
  values:
    controller:
      tolerations:
        - operator: Exists
          effect: NoSchedule
    node:
      tolerations:
        - operator: Exists
          effect: NoSchedule
