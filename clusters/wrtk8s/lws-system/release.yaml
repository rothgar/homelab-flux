# LeaderWorkerSet operator: one model replica as a leader pod plus worker pods, used to run a single vLLM server
# across both DGX Sparks (tensor parallel 2). Same chart version the dgx cluster rendered (dgx-example render.sh).
# The LeaderWorkerSets themselves are in vllm-system/lws, applied after these CRDs exist.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lws
  namespace: lws-system
spec:
  interval: 1h
  chart:
    spec:
      chart: lws
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: lws
        namespace: lws-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
