# Clear DHCP-provided search domains cluster-wide. Without this, the LAN
# DHCP server hands out `jgarr.net` → kubelet inherits it into every pod's
# resolv.conf → any short external hostname (github.com etc.) hits the
# `*.jgarr.net` wildcard as `<name>.jgarr.net` first and gets 47.149.56.32
# (public IP hairpin, unreachable). Empty list explicitly clears; leaving
# unset would inherit from DHCP.
apiVersion: v1alpha1
kind: ResolverConfig
searchDomains:
  # `.invalid` is RFC 2606-reserved and guaranteed to return NXDOMAIN,
  # so setting a single-entry list here (a) survives Omni's YAML
  # serialization — which strips `domains: []` down to nothing — and
  # (b) overrides the DHCP-supplied `jgarr.net` search domain that was
  # combining with the `*.jgarr.net` wildcard to hijack external DNS.
  # Cost: one extra NXDOMAIN lookup per short external hostname before
  # glibc falls through to the absolute name.
  domains:
    - talos.invalid
  disableDefault: true
