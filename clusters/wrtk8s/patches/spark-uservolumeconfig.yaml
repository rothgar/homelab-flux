---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
volumeType: partition
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  maxSize: 2TiB
  minSize: 1TiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: plex
volumeType: partition
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  maxSize: 100GiB
  minSize: 50GiB
