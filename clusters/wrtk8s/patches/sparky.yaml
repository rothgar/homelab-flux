apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: sparky
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  maxSize: 200GiB
---
# Dedicated partition for LLM weight caches (HF_HOME, vLLM download-dir).
# Same shape as spark's — mounted at /var/mnt/model by Talos.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: model
volumeType: partition
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  maxSize: 1TiB
  minSize: 800GiB
