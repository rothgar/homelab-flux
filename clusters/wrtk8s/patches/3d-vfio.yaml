machine:
  network:
    interfaces:
      - interface: br0
        dhcp: true
        bridge:
          stp:
            enabled: true
          interfaces:
            - enp37s0
  kernel:
    modules:
      - name: vfio
      - name: vfio_iommu_type1
      - name: vfio_pci
        parameters:
          - "ids=10de:1b81,10de:10f0"
