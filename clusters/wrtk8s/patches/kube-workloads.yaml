# Tells Talos NOT to install its bundled Flannel / kube-proxy / CoreDNS —
# Flux manages those from clusters/wrtk8s/flannel/ so we don't want them
# fighting.
#
# Written as a v1alpha1 nested-map patch (not the Talos 1.14 typed docs)
# because Omni 1.10+ still emits `.machine.features.kubePrism` and
# `.machine.cluster.proxy` in the base config, and Talos 1.14 rejects
# having both shapes present ("KubePrism config in v1alpha1 config can't
# be used with KubePrismConfig document"). See [[omni-1-10-4-kube-
# upgrade-double-emit]] memory for the same class of issue in the
# Omni-generated kubernetes-upgrade patch.
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
  coreDNS:
    disabled: true
