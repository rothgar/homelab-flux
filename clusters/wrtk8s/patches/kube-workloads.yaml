# Talos 1.14 typed-doc replacement for the old v1alpha1
# `cluster.network.cni.name: none` / `cluster.proxy.disabled: true` /
# `cluster.coreDNS.disabled: true` combo. Tells Talos NOT to install
# its bundled Flannel / kube-proxy / CoreDNS — Flux manages those from
# clusters/wrtk8s/flannel/ so we don't want them fighting.
#
# KubePrism stays enabled so kubelet reaches the API via
# localhost:7445 without a load balancer.
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
# $patch: delete drops the default KubeFlannelCNIConfig doc that Talos
# renders when a Flannel CNI would otherwise be installed. Matches the
# pattern used in the upstream Cilium-on-Talos deployment guide.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
