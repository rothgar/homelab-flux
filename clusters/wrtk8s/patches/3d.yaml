apiVersion: v1alpha1
auto: "off"
hostname: 3d
kind: HostnameConfig
---
# Shrink Talos's default EPHEMERAL a lot — this is a single-NVMe box and
# the `home` UserVolume below wants the rest for the Steam library +
# Resolve media.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  maxSize: 50GiB
  grow: false
---
# Dedicated partition backing Wolf's /home: Steam library, Resolve
# projects + media, user dotfiles. Fills the rest of nvme0n1.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: home
volumeType: partition
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  minSize: 500GiB
  grow: true
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  games-on-whales.io/gaming: "true"
taints:
  dedicated: "gaming:PreferNoSchedule"
---
# Wolf injects virtual gamepad/keyboard events into session containers
# via /dev/uinput; the module isn't autoloaded on Talos.
apiVersion: v1alpha1
kind: KernelModuleConfig
name: uinput
---
# Talos ships user namespaces off; Steam's pressure-vessel/bwrap refuses
# to start without them ("Steam now requires user namespaces").
apiVersion: v1alpha1
kind: SysctlConfig
params:
  user.max_user_namespaces: "11255"
