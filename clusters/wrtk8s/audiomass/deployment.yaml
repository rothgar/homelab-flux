apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomass
  namespace: audiomass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiomass
  template:
    metadata:
      labels:
        app: audiomass
    spec:
      containers:
        # AudioMass is a pure client-side JS app; the image is just nginx
        # with `src/` baked in from the rothgar/AudioMass fork. The GHA in
        # that repo builds a multi-arch (amd64 + arm64) image on every
        # push to production. Image is public — no imagePullSecret needed.
        - name: audiomass
          image: ghcr.io/rothgar/audiomass:latest
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
