# Tailscale ingress → Wolf web UI at https://wolf for pairing from
# outside the LAN. Moonlight clients themselves still hit 3d's LAN IP;
# this URL is only for the pairing/admin page.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wolf-tailscale
  namespace: wolf
spec:
  ingressClassName: tailscale
  rules:
    # NOTE: MagicDNS short name must NOT be `wolf` — Wolf advertises
    # itself as `wolf` to Moonlight, and if that short name resolves to
    # a tailnet IP, Moonlight's pair handshake routes to the ingress
    # instead of the LAN hostNetwork, breaking the state machine.
    - host: wolf-ui
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wolf
                port:
                  number: 47989
  tls:
    - hosts:
        - wolf-ui
