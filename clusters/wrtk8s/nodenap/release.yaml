# nodenap powers machines on and off to cut electricity cost:
# https://github.com/rothgar/nodenap
#
# The chart's own PowerPolicy is disabled: ./config brings a tuned one
# (applied by nodenap-config.yaml once the CRDs exist).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nodenap
  namespace: nodenap
spec:
  interval: 5m
  # Helm skips CRD changes on upgrade; let Flux apply them.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: nodenap
      version: "0.1.10"
      sourceRef:
        kind: HelmRepository
        name: nodenap
        namespace: nodenap
  values:
    policy:
      create: false
    # Always run on the control plane (mini), which is never powered off.
    # Preferred-only lets upgrades land on a worker: with hostNetwork the
    # terminating pod still holds its host ports on mini.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: node-role.kubernetes.io/control-plane, operator: Exists}
    # Prometheus here only selects ServiceMonitors with this label.
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    # ConfigMap for the Grafana dashboard sidecar.
    grafanaDashboard:
      enabled: true
