# nodenap powers machines on and off to cut electricity cost:
# https://github.com/rothgar/nodenap
#
# The chart's own PowerPolicy is disabled: ./config brings a tuned one
# (applied by nodenap-config.yaml once the CRDs exist).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nodenap
  namespace: nodenap
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nodenap
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: nodenap
        namespace: nodenap
  values:
    policy:
      create: false
    # Prometheus here only selects ServiceMonitors with this label.
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    # ConfigMap for the Grafana dashboard sidecar.
    grafanaDashboard:
      enabled: true
