# Requires 1Password items:
#   nodenap_omni/endpoint           — https://<account>.omni.siderolabs.io
#   nodenap_omni/serviceAccountKey  — from:
#       omnictl serviceaccount create nodenap --use-user-role=false --role Operator
#     (keys expire after a year by default; renew with
#      `omnictl serviceaccount renew nodenap`)
#   nodenap_home-assistant/token    — Home Assistant long-lived access token
#     (Profile → Security → Long-lived access tokens)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omni
  namespace: nodenap
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: omni
  data:
    - secretKey: endpoint
      remoteRef:
        key: nodenap_omni/endpoint
    - secretKey: serviceAccountKey
      remoteRef:
        key: nodenap_omni/serviceAccountKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
  namespace: nodenap
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: home-assistant
  data:
    - secretKey: token
      remoteRef:
        key: nodenap_home-assistant/token
