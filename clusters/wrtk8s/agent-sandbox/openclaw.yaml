apiVersion: v1
kind: Namespace
metadata:
  name: openclaw
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        }
      },
      "models": {
        "providers": {
          "aperture": {
            "baseUrl": "http://aperture.gerbil-dragon.ts.net/v1",
            "apiKey": "${VLLM_API_KEY}",
            "api": "openai-completions",
            "models": [
              {"id": "qwen3.6-27b", "name": "qwen3.6-27b"},
              {"id": "gemini-2.5-flash", "name": "gemini-2.5-flash"},
              {"id": "gemini-2.5-flash-lite", "name": "gemini-2.5-flash-lite"}
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": { "primary": "aperture/qwen3.6-27b" },
          "thinkingDefault": "off",
          "verboseDefault": "off"
        }
      },
      "messages": {
        "suppressToolErrors": true
      },
      "tools": {
        "profile": "coding"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-serve-config
  namespace: openclaw
data:
  serve.json: |
    {
      "TCP": {"443": {"HTTPS": true}},
      "Web": {
        "openclaw.gerbil-dragon.ts.net:443": {
          "Handlers": {
            "/": {"Proxy": "http://127.0.0.1:18789"}
          }
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-ts
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-ts-role
  namespace: openclaw
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-ts-rolebinding
  namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-ts-role
subjects:
  - kind: ServiceAccount
    name: openclaw-ts
    namespace: openclaw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-etc-pvc
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 256Mi
  storageClassName: nfs-synology
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-config-pvc
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: openclaw
  namespace: openclaw
spec:
  podTemplate:
    metadata:
      labels:
        app: openclaw
    spec:
      serviceAccountName: openclaw-ts
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: copy-config
          image: busybox
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["sh", "-c", "mkdir -p /etc/openclaw/npm && [ -f /etc/openclaw/openclaw.json ] || cp /config/openclaw.json /etc/openclaw/openclaw.json"]
          volumeMounts:
            - name: cm-volume
              mountPath: /config
            - name: openclaw-etc
              mountPath: /etc/openclaw
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.5.7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secret
                  key: gateway-token
            - name: VLLM_API_KEY
              value: "local"
            - name: BEEPER_BACKUP_CODE
              valueFrom:
                secretKeyRef:
                  name: openclaw-beeper-backup
                  key: BEEPER_BACKUP_CODE
            - name: OPENCLAW_CONFIG_PATH
              value: "/etc/openclaw/openclaw.json"
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: HTTP_PROXY
              value: "http://127.0.0.1:1055"
            - name: HTTPS_PROXY
              value: "http://127.0.0.1:1055"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.0.0.0/8,10.244.0.0/16,.cluster.local,.svc"
          command:
            - node
            - dist/index.js
            - gateway
            - --bind=lan
            - --port
            - "18789"
            - --allow-unconfigured
            - --verbose
          ports:
            - containerPort: 18789
            - containerPort: 18790
          volumeMounts:
            - mountPath: /home/node/.openclaw/workspace
              name: workspaces-pvc
            - mountPath: /home/node/.openclaw
              name: config-pvc
            - mountPath: /etc/openclaw
              name: openclaw-etc
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:stable
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-tailscale-auth
                  key: authkey
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "true"
            - name: TS_HOSTNAME
              value: "openclaw"
            - name: TS_KUBE_SECRET
              value: "openclaw-ts-state"
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: "127.0.0.1:1055"
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale/serve.json
          volumeMounts:
            - name: tailscale-serve
              mountPath: /etc/tailscale
      volumes:
        - name: config-pvc
          persistentVolumeClaim:
            claimName: openclaw-config-pvc
        - name: cm-volume
          configMap:
            name: openclaw-config
        - name: openclaw-etc
          persistentVolumeClaim:
            claimName: openclaw-etc-pvc
        - name: tailscale-serve
          configMap:
            name: tailscale-serve-config
  volumeClaimTemplates:
    - metadata:
        name: workspaces-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
