---
# Generated once in-cluster (refreshInterval 0 = never regenerate).
# MIRU_ENCRYPTION_KEY encrypts the stored Plex credentials, so rotating it
# means signing in to Plex again from Admin.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: miru-secret
  namespace: miru
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miru-secrets
  namespace: miru
spec:
  refreshInterval: "0"
  target:
    name: miru-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTH_SESSION_SECRET: "{{ .session_password }}"
        MIRU_ENCRYPTION_KEY: "{{ .encryption_password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: miru-secret
      rewrite:
        - regexp: {source: "^password$", target: "session_password"}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: miru-secret
      rewrite:
        - regexp: {source: "^password$", target: "encryption_password"}
