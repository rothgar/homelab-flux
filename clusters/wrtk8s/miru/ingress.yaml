apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miru
  namespace: miru
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: miru.jgarr.net
spec:
  ingressClassName: traefik
  rules:
    - host: miru.jgarr.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: miru
                port:
                  number: 8080
  tls:
    - hosts:
        - miru.jgarr.net
      secretName: miru-tls
