apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-remote-config
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talos-remote-config
  template:
    metadata:
      labels:
        app: talos-remote-config
    spec:
      containers:
        - name: talos-remote-config
          image: ghcr.io/siderolabs/talos-remote-config:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: talos-remote-config
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: talos-remote-config
  ports:
    - port: 80
      targetPort: 8080
