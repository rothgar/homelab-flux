apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-resources
  namespace: romm
spec:
  storageClassName: nfs-synology
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-redis
  namespace: romm
spec:
  storageClassName: nfs-synology
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-assets
  namespace: romm
spec:
  storageClassName: nfs-synology
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-config
  namespace: romm
spec:
  storageClassName: nfs-synology
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      automountServiceAccountToken: false
      # Service "romm" would inject ROMM_PORT=tcp://..., which RomM reads as
      # its nginx listen port.
      enableServiceLinks: false
      # Pods can't resolve *.ts.net; route tsidp through the tailscale egress
      # proxy (romm-tsidp-egress in tsidp-egress.yaml).
      hostAliases:
        - ip: 10.96.200.43
          hostnames: [tsidp.gerbil-dragon.ts.net]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: romm
          image: rommapp/romm:5.4.1
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: romm-credentials
          env:
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER
              value: Tailscale
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://tsidp.gerbil-dragon.ts.net
            - name: OIDC_REDIRECT_URI
              value: https://rom.jgarr.net/api/oauth/openid
            # tsidp emits `username`, not `preferred_username`.
            - name: OIDC_USERNAME_ATTRIBUTE
              value: username
            # Anonymous read-only browsing (includes ROM/BIOS downloads). Safe only
            # because rom.jgarr.net is LAN-only (10.1.1.152) and the ts.net
            # ingress is tailnet-only.
            - name: KIOSK_MODE
              value: "true"
          volumeMounts:
            - name: resources
              mountPath: /romm/resources
            - name: redis-data
              mountPath: /redis-data
            - name: library
              mountPath: /romm/library
            - name: assets
              mountPath: /romm/assets
            - name: config
              mountPath: /romm/config
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: redis-data
          persistentVolumeClaim:
            claimName: romm-redis
        - name: library
          persistentVolumeClaim:
            claimName: romm-roms
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets
        - name: config
          persistentVolumeClaim:
            claimName: romm-config
---
apiVersion: v1
kind: Service
metadata:
  name: romm
  namespace: romm
spec:
  selector:
    app: romm
  ports:
    - port: 8080
      targetPort: 8080
