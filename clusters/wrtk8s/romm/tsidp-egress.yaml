---
# Tailscale operator egress to tsidp. Pods can't resolve *.ts.net, so the
# romm Deployment pins tsidp.gerbil-dragon.ts.net to this proxy's ClusterIP
# via hostAliases (TLS still verifies against the real tsidp cert).
apiVersion: v1
kind: Service
metadata:
  name: tsidp
  namespace: romm
  annotations:
    tailscale.com/tailnet-fqdn: tsidp.gerbil-dragon.ts.net
spec:
  externalName: unused  # tailscale operator rewrites this
  type: ExternalName
---
# The operator's egress Service is headless (resolves to the proxy pod IP,
# which changes on restart). This pins a stable ClusterIP in front of the
# proxy pod so the romm Deployment's hostAlias can point at it.
apiVersion: v1
kind: Service
metadata:
  name: romm-tsidp-egress
  namespace: tailscale
spec:
  clusterIP: 10.96.200.43
  selector:
    tailscale.com/managed: "true"
    tailscale.com/parent-resource: tsidp
    tailscale.com/parent-resource-ns: romm
    tailscale.com/parent-resource-type: svc
  ports:
    - name: https
      port: 443
      targetPort: 443
