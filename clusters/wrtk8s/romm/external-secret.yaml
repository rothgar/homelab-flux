# Requires 1Password item (per [[eso-onepassword]] convention), vault wrtk8s:
#   romm_romm-credentials
#     mariadb-root-password  MariaDB root password
#     mariadb-password       password for the romm database user
#     auth-secret-key        RomM session signing key (`openssl rand -hex 32`)
# The non-secret settings (database, user, host) live in the template below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-credentials
  namespace: romm
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: romm-credentials
    template:
      engineVersion: v2
      data:
        MARIADB_DATABASE: romm
        MARIADB_USER: romm
        DB_HOST: romm-db
        DB_NAME: romm
        DB_USER: romm
        MARIADB_ROOT_PASSWORD: "{{ .rootPassword }}"
        MARIADB_PASSWORD: "{{ .password }}"
        DB_PASSWD: "{{ .password }}"
        ROMM_AUTH_SECRET_KEY: "{{ .authSecretKey }}"
  data:
    - secretKey: rootPassword
      remoteRef:
        key: romm_romm-credentials/mariadb-root-password
    - secretKey: password
      remoteRef:
        key: romm_romm-credentials/mariadb-password
    - secretKey: authSecretKey
      remoteRef:
        key: romm_romm-credentials/auth-secret-key
