# Reference copy only, NOT deployed. The live file is
# /romm/config/config.yml on the romm-config PVC and RomM's UI edits it.
# Sync by hand: kubectl -n romm exec deploy/romm -- cat /romm/config/config.yml
# RomM library layout. The Synology share is an old ES-DE/EmuDeck tree:
# most platforms are {platform}/roms/{game} with BIOS in {platform}/bios,
# but newer dumps sit directly in the platform folder.
filesystem:
  structure:
    default: "{platform}/roms/{game}"
    firmware: "{platform}/bios"
    PS1: "{platform}/{game}"
    PSP: "{platform}/{game}"
    dreamcast: "{platform}/{game}"
    gamecube: "{platform}/{game}"
    mame: "{platform}/{game}"
    ps2: "{platform}/{game}"
    ps3: "{platform}/{game}"
    switch: "{platform}/{game}"
    vita: "{platform}/{game}"
    xbox: "{platform}/{game}"
system:
  platforms:
    PS1: psx
    segaGG: gamegear
    segaSG: sg1000
    vb: virtualboy
    ws: wonderswan
exclude:
  platforms: [".ipfs", "bios", "config", "hashes", "main", "scripts", "tools"]
  roms:
    single_file:
      names: ["systeminfo.txt"]
