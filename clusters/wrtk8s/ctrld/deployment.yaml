apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctrld
  namespace: ctrld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctrld
  template:
    metadata:
      labels:
        app: ctrld
    spec:
      containers:
        - name: ctrld
          image: controldns/ctrld:1.5.7
          # Registered / daemon-in-container mode: --cd pulls the full
          # resolver config from Control D at boot AND registers this
          # instance so it appears in the Control D dashboard for
          # filtering + analytics. --config points at a writable path
          # where ctrld persists the device_id token so the same
          # dashboard endpoint identity survives pod restarts
          # (emptyDir below — losing it just triggers a fresh
          # re-registration on next boot with a new device_id).
          # --custom-hostname is the label that shows in the dashboard.
          args:
            - --cd=$(RESOLVER_ID)
            - --primary_upstream=https://freedns.controld.com/$(RESOLVER_ID)
            - --config=/var/lib/ctrld/ctrld.toml
            - --custom-hostname=wrtk8s-ctrld
            - --listen=0.0.0.0:53
          env:
            - name: RESOLVER_ID
              valueFrom:
                secretKeyRef:
                  name: ctrld-resolver-id
                  key: id
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          securityContext:
            # port 53 is <1024 so needs the bind capability; drop the rest.
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/ctrld
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: state
          emptyDir: {}
