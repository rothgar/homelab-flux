apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctrld
  namespace: ctrld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctrld
  template:
    metadata:
      labels:
        app: ctrld
    spec:
      containers:
        - name: ctrld
          image: controldns/ctrld:1.5.7
          # The container ENTRYPOINT is already `ctrld run`, so args
          # here are just flags. --cd pulls the upstream + ruleset from
          # Control D; --listen exposes on all container interfaces so
          # the ClusterIP Service can front it.
          args:
            # In no-config mode ctrld requires both --primary_upstream
            # and --listen explicitly; --cd alone isn't enough (it's
            # the Control D lookup hint, not a full upstream URL).
            - --primary_upstream=https://freedns.controld.com/$(RESOLVER_ID)
            - --listen=0.0.0.0:53
          env:
            - name: RESOLVER_ID
              valueFrom:
                secretKeyRef:
                  name: ctrld-resolver-id
                  key: id
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          securityContext:
            # port 53 is <1024 so needs the bind capability; drop the rest.
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 15
            periodSeconds: 30
