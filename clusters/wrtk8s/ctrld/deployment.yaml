apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctrld
  namespace: ctrld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctrld
  template:
    metadata:
      labels:
        app: ctrld
    spec:
      containers:
        - name: ctrld
          image: controldns/ctrld:1.5.7
          # `run` is the foreground mode (`start` is for daemonizing as a
          # system service and only there does the `--cd` shortcut work).
          # In `run` we build the upstream URL from the Resolver ID
          # ourselves. Kubernetes interpolates $(RESOLVER_ID) from the
          # env below into the arg at pod start.
          args:
            - run
            - --primary_upstream=https://freedns.controld.com/$(RESOLVER_ID)
            - --listen=0.0.0.0:53
          env:
            - name: RESOLVER_ID
              valueFrom:
                secretKeyRef:
                  name: ctrld-resolver-id
                  key: id
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          securityContext:
            # port 53 is <1024 so needs the bind capability; drop the rest.
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 15
            periodSeconds: 30
