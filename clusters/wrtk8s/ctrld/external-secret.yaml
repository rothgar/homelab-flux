apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ctrld-resolver-id
  namespace: ctrld
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ctrld-resolver-id
  data:
    # 1Password item `ctrld_ctrld-resolver-id`, `password` field holds
    # the Control D Resolver ID (short slug from the dashboard). Landed
    # in the default password field rather than a custom `id` field
    # because that's where 1Password's UI puts secret-shaped values by
    # default; ESO doesn't care which field name as long as it matches.
    - secretKey: id
      remoteRef:
        key: ctrld_ctrld-resolver-id/password
