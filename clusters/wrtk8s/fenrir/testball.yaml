# Smallest possible App for smoke-testing the DRA path end-to-end.
# Uses the same shared NVIDIA GPU claim the wolf-agent already allocated,
# a `devic.es/uinput` request for virtual input, and the default-wolf
# device class so the operator wires up the wayland render node via the
# wolf-agent's DRA driver.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: testball
  namespace: direwolf-dev
spec:
  # CRD requires appAssetWebP; a 26-byte 1×1 WebP keeps it minimal.
  appAssetWebP: UklGRhoAAABXRUJQVlA4IA4AAAAQAAGAiYCAgICAgIAA
  id: 3
  isHDRSupported: false
  title: Test Ball
  deviceClassName: default-wolf
  volumeClaimTemplates:
    - metadata:
        name: app-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
  template:
    spec:
      # Talos needs the nvidia runtime class to inject /dev/dri + /dev/nvidia*
      # even when the GPU is claimed via DRA.
      runtimeClassName: nvidia
      nodeSelector:
        games-on-whales.io/gaming: "true"
      resourceClaims:
        - name: nvidia-gpu
          resourceClaimName: shared-nvidia-gpu
      containers:
        - name: app
          image: ghcr.io/games-on-whales/base-app:edge
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: app-data
              mountPath: /home/retro
          resources:
            requests:
              cpu: 1
              memory: 1Gi
              devic.es/uinput: "1"
            limits:
              cpu: 2
              memory: 2Gi
              devic.es/uinput: "1"
            claims:
              - name: nvidia-gpu
