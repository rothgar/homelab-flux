# Wolf-agent is a PERSISTENT standalone pod (not spawned per session) that
# owns the wolf process and its DRA GPU claim. Pinned to 3d — the only
# node with the siderolabs uinput/uhid/joydev extensions, our NVIDIA
# runtime class, and the generic-device-plugin for virtual input.
---
# The NVIDIA GPU that wolf uses for encoding, consumed via DRA.
# `gpu.nvidia.com` is the DeviceClass advertised by the in-cluster NVIDIA
# DRA driver (see `kubectl get deviceclass`).
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: shared-nvidia-gpu
  namespace: direwolf-dev
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          allocationMode: ExactCount
          count: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wolf-dra
  namespace: direwolf-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wolf-dra
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses"]
    verbs: ["get"]
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["sessions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["sessions/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wolf-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wolf-dra
subjects:
  - kind: ServiceAccount
    name: wolf-dra
    namespace: direwolf-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wolf-agent
  namespace: direwolf-dev
  labels:
    app: wolf-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wolf-agent
  template:
    metadata:
      labels:
        app: wolf-agent
    spec:
      serviceAccountName: wolf-dra
      # Pin to 3d: only node with the gaming extensions + squat.ai/uinput.
      nodeSelector:
        games-on-whales.io/gaming: "true"
      # Nvidia CDI injection on Talos requires the nvidia runtime class.
      runtimeClassName: nvidia
      # GameStream's RTSP + RTP stack is a UDP flood on dynamic port
      # ranges that MetalLB L2 + kube-proxy NAT handles poorly. Also the
      # moonlight-proxy's launch response constructs the RTSP URL from
      # the wolf-agent pod's NodeIP (3d's LAN IP), expecting the ports to
      # live on the host — so without hostNetwork the Moonlight client
      # hits "connection refused" at rtsp://<node-ip>:48010. Running
      # hostNetwork binds all the ports directly on 3d's LAN IP, which
      # is what GameStream clients expect.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      resourceClaims:
        - name: nvidia-gpu
          resourceClaimName: shared-nvidia-gpu
      volumes:
        - name: wolf-sock
          emptyDir: {}
        - name: plugins-dir
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: sockets-dir
          hostPath:
            path: /var/run/wolf-sockets
            type: DirectoryOrCreate
        - name: cdi-dir
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: wolf-cfg
          configMap:
            name: wolf-cfg
            defaultMode: 0755
        - name: direwolf-certs
          configMap:
            name: direwolf-certs
            defaultMode: 0600
        - name: egl-glvnd-nvidia
          configMap:
            name: egl-glvnd-nvidia
            defaultMode: 0444
      containers:
        - name: wolf-agent
          image: cr.jgarr.net/fenrir/wolf-agent:dev
          imagePullPolicy: Always
          env:
            - { name: LOG_LEVEL,  value: "5" }
            - { name: APP_NAME,   value: wolf-agent }
            - { name: NODE_NAME,  valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: POD_NAME,   valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: POD_UID,    valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
            - { name: DRIVER_NAME, value: wolf.dra.io }
            - { name: SOCKETS_DIR, value: /var/run/wolf-sockets }
            - { name: WOLF_SOCKET_PATH, value: /etc/wolf/wolf.sock }
            - { name: MAX_WAYLAND_SOCKETS, value: "10" }
            - { name: QUEUE_TIMEOUT_SECONDS, value: "30" }
            - { name: TLS_CERT, value: /etc/wolf/cfg/server.crt }
            - { name: TLS_KEY, value: /etc/wolf/cfg/server.key }
          volumeMounts:
            - { name: wolf-sock,        mountPath: /etc/wolf }
            - { name: plugins-dir,      mountPath: /var/lib/kubelet/plugins }
            - { name: plugins-registry, mountPath: /var/lib/kubelet/plugins_registry }
            - { name: sockets-dir,      mountPath: /var/run/wolf-sockets }
            - { name: cdi-dir,          mountPath: /var/run/cdi }
            - { name: direwolf-certs, mountPath: /etc/wolf/cfg/server.crt, subPath: server.crt, readOnly: true }
            - { name: direwolf-certs, mountPath: /etc/wolf/cfg/server.key, subPath: server.key, readOnly: true }
          securityContext:
            privileged: true
        - name: wolf
          # :sha-d6d41de (upstream Fenrir install default) panics in the
          # gstreamer waylanddisplaysrc negotiate path even after all
          # DRA-era env fixes (glvnd ICD, GBM_BACKENDS_PATH). Try :stable
          # which is a known-good older release.
          image: ghcr.io/games-on-whales/wolf:stable
          imagePullPolicy: IfNotPresent
          env:
            - { name: XDG_RUNTIME_DIR, value: /var/run/wolf-sockets }
            - { name: TZ,              value: America/Los_Angeles }
            - { name: WOLF_SOCKET_PATH, value: /etc/wolf/wolf.sock }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: all }
            - { name: NVIDIA_VISIBLE_DEVICES,     value: all }
            # Point libgbm at NVIDIA's backend. The debian default search
            # path is /usr/lib/x86_64-linux-gnu/gbm (Mesa only); nvidia
            # ships nvidia-drm_gbm.so at /usr/lib/gbm. Classic
            # nvidia-container-toolkit sets this on its own; the DRA path
            # doesn't, so DMABuf format negotiation yields [] and wolf's
            # wayland pipeline bails with "not-negotiated".
            - { name: GBM_BACKENDS_PATH, value: /usr/lib/gbm }
            # Moonlight connects RTSP to the host it paired with, taking only
            # the port from the launch response, so the proxy and wolf must
            # share 3d's IP. The proxy owns 47984/47989; move wolf's own
            # (unused under Fenrir) HTTP servers out of the way.
            - { name: WOLF_HTTP_PORT,  value: "48989" }
            - { name: WOLF_HTTPS_PORT, value: "48984" }
            # Debug: expose the actual Rust panic + wayland-display-core log
            # path on the next /launch. Turn these off once the issue is
            # localized.
            - { name: RUST_BACKTRACE, value: "full" }
            - { name: RUST_LOG, value: "info" }
            - { name: WOLF_LOG_LEVEL, value: "DEBUG" }
            - { name: GST_DEBUG, value: "waylanddisplaysrc:5,wolf_wayland_source:5,2" }
          volumeMounts:
            - { name: sockets-dir, mountPath: /var/run/wolf-sockets }
            - { name: wolf-sock,   mountPath: /etc/wolf }
            - { name: wolf-cfg,    mountPath: /etc/wolf/cfg/config.toml, subPath: config.toml, readOnly: false }
            - { name: direwolf-certs, mountPath: /etc/wolf/cfg/server.crt, subPath: server.crt, readOnly: true }
            - { name: direwolf-certs, mountPath: /etc/wolf/cfg/server.key, subPath: server.key, readOnly: true }
            # libglvnd EGL ICD dispatch file — tells libEGL to use nvidia's
            # driver. Missing from the nvidia DRA injection; without this
            # wolf's wayland compositor falls back to Mesa DRI2 and panics.
            - { name: egl-glvnd-nvidia, mountPath: /usr/share/glvnd/egl_vendor.d/10_nvidia.json, subPath: 10_nvidia.json, readOnly: true }
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              devic.es/uinput: "1"
            limits:
              cpu: "4"
              memory: 4Gi
              devic.es/uinput: "1"
            claims:
              - name: nvidia-gpu
          securityContext:
            privileged: true
