---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf-dev
  labels:
    app: direwolf
    component: moonlight-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: direwolf
      component: moonlight-proxy
  template:
    metadata:
      labels:
        app: direwolf
        component: moonlight-proxy
    spec:
      serviceAccountName: direwolf-moonlight-proxy
      # Moonlight dials RTSP at the same host it paired with (it only takes
      # the port from the launch response), so the proxy must share an IP
      # with wolf-agent. Run both on 3d's host network: clients add 3d by
      # its LAN IP, and wolf sees real client IPs, which it checks against
      # the session's client_ip.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        games-on-whales.io/gaming: "true"
      containers:
        - name: moonlight-proxy
          image: cr.jgarr.net/fenrir/moonlight-proxy:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 47984
            - containerPort: 47989
          env:
            - name: APP_NAME
              value: moonlight-proxy
            - name: SERVER_CERT
              value: /etc/certs/server.crt
            - name: SERVER_KEY
              value: /etc/certs/server.key
            - name: ALLOWED_HOSTS
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: certs
          configMap:
            name: direwolf-certs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf-dev
rules:
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["pairings", "profiles", "apps", "sessions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["pairings"]
    verbs: ["create", "patch"]
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["sessions"]
    verbs: ["create", "delete", "get"]
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["lobbies"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf-dev
subjects:
  - kind: ServiceAccount
    name: direwolf-moonlight-proxy
    namespace: direwolf-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: direwolf-moonlight-proxy
