# GNOME desktop (images/desktop) over logan's home, with Steam, Firefox and
# DaVinci Resolve in the dock. Steam games launched from here need the same
# sandbox privileges as the Steam app.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: desktop
  namespace: direwolf-dev
spec:
  appAssetWebP: UklGRhoAAABXRUJQVlA4IA4AAAAQAAGAiYCAgICAgIAA
  id: 4
  isHDRSupported: false
  title: Desktop
  deviceClassName: default-wolf
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        games-on-whales.io/gaming: "true"
      resourceClaims:
        - name: nvidia-gpu
          resourceClaimName: shared-nvidia-gpu
      # Resolve Studio's RLM activation checks the ethernet MAC (and the hostid,
      # pinned via /etc/hostid below); a pod's eth0 gets a random MAC every time.
      # Kubernetes has no MAC field, so set it in the pod's netns before the app starts.
      initContainers:
        - name: pin-mac
          image: busybox:1.36
          command: [ip, link, set, dev, eth0, address, "02:42:4c:6f:67:61"]
          securityContext:
            capabilities:
              add: [NET_ADMIN]
      containers:
        - name: app
          image: cr.jgarr.net/fenrir/desktop:latest
          imagePullPolicy: Always
          # Steam's pressure-vessel runtime uses bwrap namespaces; same
          # privileges Wolf's stock steam app config grants.
          securityContext:
            capabilities:
              add: [SYS_ADMIN, SYS_NICE, SYS_PTRACE, NET_RAW, MKNOD, NET_ADMIN]
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          env:
            # Run as logan so paths baked into the restored home resolve.
            - { name: UNAME, value: logan }
            - { name: HOME, value: /home/logan }
            - { name: TZ, value: America/Los_Angeles }
            - { name: RUN_SWAY, value: "1" }
            - { name: DESKTOP_APP, value: gnome }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: all }
            - { name: GBM_BACKENDS_PATH, value: /usr/lib/gbm }
          volumeMounts:
            - name: home
              mountPath: /home/logan
            - name: home
              mountPath: /opt/resolve
              subPath: .fenrir/opt-resolve
            - name: home
              mountPath: /var/BlackmagicDesign
              subPath: .fenrir/var-blackmagicdesign
            # Resolve Studio's RLM activation is bound to the native hostid, which glibc
            # derives from the pod IP when /etc/hostid is absent, so every new pod lost
            # the license. Pin it (value from the pod Studio was re-activated in).
            - name: home
              mountPath: /etc/hostid
              subPath: .fenrir/hostid
              readOnly: true
            - name: egl-glvnd-nvidia
              mountPath: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
              subPath: 10_nvidia.json
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 2
              memory: 2Gi
              devic.es/uinput: "1"
            limits:
              memory: 12Gi
              devic.es/uinput: "1"
            claims:
              - name: nvidia-gpu
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: logan-home
        - name: egl-glvnd-nvidia
          configMap:
            name: egl-glvnd-nvidia
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
