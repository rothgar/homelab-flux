# Fenrir (games-on-whales/fenrir) — post-DRA merge, built from our own
# fork at ~/src/fenrir and pushed to cr.jgarr.net/fenrir/*:dev.
#
# Architectural notes vs. the pre-DRA deploy we tore out:
# - Session pods are now StatefulSets built directly from App.spec.template
#   (runtimeClassName + nodeSelector finally stick).
# - GPUs flow through DRA (ResourceClaim → wolf.dra.io / gpu.nvidia.com),
#   not via a per-user hardcoded "openebs-hostpath" PVC.
# - wolf-agent is a persistent standalone pod that the operator reuses for
#   every session; no more per-launch wolf container spin-up.
# - Virtual input (uinput) still comes from squat's generic-device-plugin,
#   now using its default `devic.es/uinput` resource name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - crds/apps.yaml
  - crds/lobbies.yaml
  - crds/pairings.yaml
  - crds/profiles.yaml
  - crds/sessions.yaml
  - configmaps.yaml
  - deviceclass.yaml
  - generic-device-plugin.yaml
  - operator.yaml
  - moonlight-proxy.yaml
  - wolf-agent.yaml
  - profile.yaml
  - home.yaml
  - firefox.yaml
  - steam.yaml
  - desktop.yaml
  - davinci-resolve.yaml
