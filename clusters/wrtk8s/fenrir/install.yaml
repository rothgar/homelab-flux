# A YAML containing everything you need to install direwolf
---
apiVersion: v1
kind: Service
metadata:
  name: direwolf
  namespace: direwolf
  labels:
    app: direwolf
    component: moonlight-proxy
  annotations:
    "lbipam.cilium.io/sharing-key": "direwolf"
    "metallb.universe.tf/allow-shared-ip": "direwolf"
spec:
  type: LoadBalancer
  selector:
    app: direwolf
    component: moonlight-proxy
  ports:
    - name: http
      protocol: TCP
      port: 47984
    - name: https
      protocol: TCP
      port: 47989
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf
  labels:
    app: direwolf
    component: moonlight-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: direwolf
      component: moonlight-proxy
  template:
    metadata:
      labels:
        app: direwolf
        component: moonlight-proxy
    spec:
      serviceAccountName: direwolf-moonlight-proxy
      containers:
        - name: moonlight-proxy
          image: ghcr.io/games-on-whales/moonlight-proxy:main
          imagePullPolicy: IfNotPresent
          args:
          - --tls-cert=/etc/certs/server.crt
          - --tls-key=/etc/certs/server.key
          ports:
          - containerPort: 47984
          - containerPort: 47989
          env:
          # Useful for debugging pairing to skip constant PIN screens.
          # Requires modified moonlight client.
          # - name: HARDCODED_PIN
          #   value: "1111"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
          - name: certs
            mountPath: /etc/certs
            readOnly: true
      volumes:
      - name: certs
        configMap:
          name: direwolf-certs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: direwolf-operator
  namespace: direwolf
  labels:
    app: direwolf
    component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: direwolf
      component: operator
  template:
    metadata:
      labels:
        app: direwolf
        component: operator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - direwolf
                - key: component
                  operator: In
                  values:
                  - operator
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: direwolf-operator
      containers:
        - name: operator
          image: ghcr.io/games-on-whales/operator:main
          imagePullPolicy: IfNotPresent
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          ## To specify which image you want to use for wolf and wolf-agent 
          # - name: WOLF_IMAGE
          #   value: ghcr.io/games-on-whales/wolf:session
          # - name: AGENT_IMAGE
          #   value: ghcr.io/games-on-whales/fenrir/wolf-agent:main
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: direwolf-operator
  namespace: direwolf
  labels:
    app: direwolf
    component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: direwolf-operator
  namespace: direwolf
  labels:
    app: direwolf
    component: operator
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["direwolf.games-on-whales.github.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "persistentvolumeclaims", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: direwolf-operator
  namespace: direwolf
  labels:
    app: direwolf
    component: operator
subjects:
- kind: ServiceAccount
  name: direwolf-operator
  namespace: direwolf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: direwolf-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf
  labels:
    app: direwolf
    component: direwolf-moonlight-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf
  labels:
    app: direwolf
    component: direwolf-moonlight-proxy
rules:
- apiGroups: ["direwolf.games-on-whales.github.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["direwolf.games-on-whales.github.io"]
  resources: ["pairings", "sessions"]
  verbs: ["create", "delete", "patch", "update", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: direwolf-moonlight-proxy
  namespace: direwolf
  labels:
    app: direwolf
    component: direwolf-moonlight-proxy
subjects:
- kind: ServiceAccount
  name: direwolf-moonlight-proxy
  namespace: direwolf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: direwolf-moonlight-proxy
---
