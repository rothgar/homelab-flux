# The DRA DeviceClass that Fenrir uses when the operator allocates a
# session-local "wolf" device for each lobby. The wolf-agent publishes
# devices under the `wolf.dra.io` driver; this class steers the
# operator's ResourceClaims at those devices, with the render node and
# codec capabilities embedded as opaque config that wolf consumes.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: default-wolf
spec:
  selectors:
    - cel:
        expression: device.driver == "wolf.dra.io"
  config:
    - opaque:
        driver: wolf.dra.io
        parameters:
          video_settings:
            wayland_render_node: /dev/dri/renderD128
            runner_render_node:  /dev/dri/renderD128
            # Drop the drm-format={NV12,YV12,...} filter. NVIDIA's wayland
            # smithay backend exposes AR24/XR24/AB24/XB24 with NVIDIA-
            # specific modifiers (not NV12/YV12), so the intersection was
            # empty and waylanddisplaysrc's base_src.rs:452 negotiate
            # failed with Internal data stream error. Letting caps float
            # lets cudaupload+cudaconvertscale downstream handle the
            # colorspace conversion to NV12 for the h264 encoder.
            video_producer_buffer_caps: 'video/x-raw(memory:DMABuf)'
