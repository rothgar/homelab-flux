# Upstream examples/applications/01-firefox.yaml adapted for NVIDIA on 3d.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: firefox
  namespace: direwolf-dev
spec:
  appAssetWebP: UklGRhoAAABXRUJQVlA4IA4AAAAQAAGAiYCAgICAgIAA
  id: 1
  isHDRSupported: false
  title: Firefox
  deviceClassName: default-wolf
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        games-on-whales.io/gaming: "true"
      resourceClaims:
        - name: nvidia-gpu
          resourceClaimName: shared-nvidia-gpu
      containers:
        - name: app
          image: ghcr.io/games-on-whales/firefox:edge
          env:
            # Run as logan so paths baked into the restored home resolve.
            - { name: UNAME, value: logan }
            - { name: HOME, value: /home/logan }
            - { name: TZ, value: America/Los_Angeles }
            - { name: RUN_SWAY, value: "1" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: all }
            - { name: GBM_BACKENDS_PATH, value: /usr/lib/gbm }
          volumeMounts:
            - name: home
              mountPath: /home/logan
            - name: egl-glvnd-nvidia
              mountPath: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
              subPath: 10_nvidia.json
              readOnly: true
          resources:
            requests:
              cpu: 2
              memory: 2Gi
              devic.es/uinput: "1"
            limits:
              memory: 4Gi
              devic.es/uinput: "1"
            claims:
              - name: nvidia-gpu
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: logan-home
        - name: egl-glvnd-nvidia
          configMap:
            name: egl-glvnd-nvidia
