# Static local PV backed by 3d's `home` UserVolume (see patches/3d.yaml),
# migrated from the wolf/ bundle. Same StorageClass and PV — only the PVC
# consumer changed (direwolf/logan-home instead of wolf/wolf-home).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-3d
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: 3d-home
spec:
  storageClassName: local-3d
  capacity:
    storage: 800Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/mnt/home
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["3d"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logan-home
  namespace: direwolf
spec:
  storageClassName: local-3d
  volumeName: 3d-home
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 800Gi
---
# The direwolf-operator hardcodes "openebs-hostpath" as the default
# storage class for the per-user PVC it creates (string is literally
# embedded in the operator binary, no env-var override). Rather than
# install OpenEBS or patch upstream, alias the name to our existing
# local-path provisioner so the operator's PVC provisions correctly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath
provisioner: cluster.local/local-path-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
