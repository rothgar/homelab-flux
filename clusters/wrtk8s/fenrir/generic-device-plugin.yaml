# squat.ai generic-device-plugin — exposes /dev/uinput as squat.ai/uinput
# which the wolf container requests so it can inject virtual gamepad /
# keyboard events for Moonlight clients. The post-DRA Fenrir still uses
# this for virtual input; DRA replaced the GPU allocation path only.
# Pinned to 3d (the gaming node) so the resource is only advertised where
# the siderolabs uinput/uhid/joydev extensions are installed.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin-gaming
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin-gaming
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin-gaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin-gaming
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        games-on-whales.io/gaming: "true"
      containers:
        - name: generic-device-plugin-gaming
          image: ghcr.io/squat/generic-device-plugin:latest
          args:
            # devic.es is the plugin's default resource domain. Upstream
            # Fenrir examples request `devic.es/uinput`, so we leave the
            # default rather than forcing --domain=squat.ai.
            - --device
            - |
              name: uinput
              groups:
                - count: 10
                  paths:
                    - path: /dev/uinput
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
          securityContext:
            privileged: true
          volumeMounts:
            - { name: device-plugin, mountPath: /var/lib/kubelet/device-plugins }
            - { name: dev,           mountPath: /dev }
      volumes:
        - name: device-plugin
          hostPath: { path: /var/lib/kubelet/device-plugins }
        - name: dev
          hostPath: { path: /dev }
