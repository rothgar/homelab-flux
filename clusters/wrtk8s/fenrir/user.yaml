# User CR tells Fenrir's direwolf-operator which resources to allocate
# for the session pod. Scheduling to 3d is implicit: only 3d has
# nvidia.com/gpu AND squat.ai/uinput (we scoped the generic-device-plugin
# DS to the gaming node), so the scheduler has one feasible node. The
# User CRD doesn't expose nodeSelector or tolerations.
#
# Name MUST be "alex" today: moonlight-proxy hardcodes "alex" as the
# user referenced by every Pairing it creates (no --user flag exists in
# the binary as of main@ec6c640). Rename it and the post-pair
# pairchallenge fails with `user not found` / Moonlight client error 204.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: alex
  namespace: direwolf
spec:
  resources:
    requests:
      nvidia.com/gpu: "1"
      cpu: 4000m
      memory: 8G
    limits:
      nvidia.com/gpu: "1"
      cpu: 4000m
      memory: 8G
  volumes:
    - name: home
      persistentVolumeClaim:
        claimName: logan-home
  sidecarPolicies:
    wolf:
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
      resources:
        requests:
          nvidia.com/gpu: "1"
          squat.ai/uinput: "1"
          cpu: 1000m
          memory: 2G
        limits:
          nvidia.com/gpu: "1"
          squat.ai/uinput: "1"
          cpu: 1000m
          memory: 2G
      volumeMounts:
        - name: home
          mountPath: /home
