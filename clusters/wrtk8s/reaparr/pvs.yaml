apiVersion: v1
kind: PersistentVolume
metadata:
  name: reaparr-movies
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 10.1.1.4#/volume1/kubernetes/reaparr-movies
    volumeAttributes:
      server: 10.1.1.4
      share: /volume1/kubernetes/reaparr-movies
---
