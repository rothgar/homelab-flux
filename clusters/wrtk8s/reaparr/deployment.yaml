apiVersion: apps/v1
kind: Deployment
metadata:
  name: reaparr
  namespace: reaparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reaparr
  template:
    metadata:
      labels:
        app: reaparr
    spec:
      # spark can't mount the Synology NFS PVCs for this workload (server
      # returns NOENT); pi4-1 has been carrying it fine for months. Pin
      # away from spark until that's diagnosed.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [spark]
      initContainers:
        - name: fix-permissions
          image: busybox:1.38
          command: ["sh", "-c", "chown -R 911:1001 /Config /Downloads && chmod -R u+rw /Config"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /Config
            - name: downloads
              mountPath: /Downloads
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1001
      automountServiceAccountToken: false
      containers:
        - name: reaparr
          image: reaparr/reaparr:0.40.0
          ports:
            - containerPort: 7000
          env:
            - name: TZ
              value: "America/Los_Angeles"
            # Header auth via the Tailscale ingress: the proxy sets this
            # header to the caller's verified tailnet login. Configured in
            # ReaparrSettings.json (not in git):
            #   NetworkSettings.AllowedProxyIps = 10.244.0.0/16 (pod CIDR, so the
            #     ingress's X-Forwarded-For is used as the client address)
            #   HeaderAuthentication.TrustedProxies = 100.64.0.0/10 (tailnet)
            - name: AUTH_HEADER_TOKEN
              value: "Tailscale-User-Login"
          volumeMounts:
            - name: config
              mountPath: /Config
            - name: downloads
              mountPath: /Downloads
            - name: movies
              mountPath: /Movies
            - name: tvshows
              mountPath: /TvShows
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: reaparr-config
        - name: downloads
          persistentVolumeClaim:
            claimName: reaparr-downloads-nfs
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: tvshows
          persistentVolumeClaim:
            claimName: tvshows
---
apiVersion: v1
kind: Service
metadata:
  name: reaparr
  namespace: reaparr
spec:
  selector:
    app: reaparr
  ports:
    - port: 7000
      targetPort: 7000
