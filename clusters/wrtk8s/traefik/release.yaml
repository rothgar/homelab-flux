apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  values:
    service:
      type: LoadBalancer
      # Allow gitea-ssh (and any other same-keyed LB in the cluster) to share
      # this metallb IP so git.jgarr.net can host both HTTPS (80/443) and SSH
      # (22) on one A record.
      annotations:
        metallb.universe.tf/allow-shared-ip: gitea-web-ssh
    ports:
      websecure:
        transport:
          respondingTimeouts:
            # Traefik v3 defaults readTimeout to 60s, which cuts off large
            # image-layer PUTs to cr.jgarr.net mid-upload.
            readTimeout: 30m
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: true
      name: traefik
    additionalArguments:
      - --providers.kubernetesgateway
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
        matchLabelKeys:
          - pod-template-hash
