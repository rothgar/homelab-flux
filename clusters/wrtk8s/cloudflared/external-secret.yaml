# Requires 1Password item (per [[eso-onepassword]] convention):
#   cloudflare_tunnel-token/token  — the token minted via Cloudflare
#   Zero Trust → Networks → Tunnels → Create a tunnel → Install
#   connector (bare token string; starts with `eyJ...`). Note: item
#   name is `cloudflare_` (singular), not `cloudflared_`.
#
# Ingress rules (hostname → service) are configured in the Cloudflare
# dashboard against the tunnel, NOT in the pod. This keeps secrets out
# of git and lets you add/remove hostnames without a reconcile.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel-token
  data:
    - secretKey: token
      remoteRef:
        key: cloudflare_tunnel-token/token
