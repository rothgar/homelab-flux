apiVersion: v1
kind: Service
metadata:
  name: kvmm
  namespace: default
  labels:
    app: kvmm
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "kvmm"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: kvmm
