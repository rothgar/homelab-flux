apiVersion: batch/v1
kind: CronJob
metadata:
  name: hockeytime
  namespace: hockeytime
spec:
  # Once per day in America/Los_Angeles. Gotify never expires messages,
  # so the ntfy-era "keep-alive at midnight to bridge the 12h cache" is
  # gone — the dedup fetch always sees every prior alert.
  schedule: "0 9 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: hockeytime
              image: cr.jgarr.net/hockeytime:latest
              imagePullPolicy: Always
              envFrom:
                # `gotify` Secret carries GOTIFY_URL / GOTIFY_APP_TOKEN /
                # GOTIFY_CLIENT_TOKEN. Provisioned out-of-band today
                # (kubectl create secret); migrate to ExternalSecret +
                # 1Password when convenient.
                - secretRef:
                    name: gotify
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
