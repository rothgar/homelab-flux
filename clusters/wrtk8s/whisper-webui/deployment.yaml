apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-webui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-webui
  template:
    metadata:
      labels:
        app: whisper-webui
    spec:
      runtimeClassName: nvidia
      containers:
        - name: whisper-webui
          image: ghcr.io/rothgar/whisper-webui:v0.0.0-d2bdcf7
          args:
            - --server_port
            - "7860"
            - --server_name
            - "0.0.0.0"
          ports:
            - containerPort: 7860
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /Whisper-WebUI/models
            - name: outputs
              mountPath: /Whisper-WebUI/outputs
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-models
        - name: outputs
          persistentVolumeClaim:
            claimName: whisper-outputs
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-webui
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: whisper-webui
  ports:
    - port: 80
      targetPort: 7860
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whisper-webui-tailscale
  namespace: default
spec:
  ingressClassName: tailscale
  rules:
    - host: whisper
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Route through KEDA HTTP interceptor so the Deployment can
              # scale to zero and wake on demand. See keda-scaler.yaml.
              service:
                name: whisper-webui-scaled
                port:
                  number: 8080
  tls:
    - hosts:
        - whisper
