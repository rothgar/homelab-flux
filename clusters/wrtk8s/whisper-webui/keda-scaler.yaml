# Front whisper-webui with the KEDA HTTP interceptor so the GPU-consuming
# Deployment scales to zero when idle and wakes on the first request.
#
# Traffic path:
#   client → Tailscale Ingress (whisper.gerbil-dragon.ts.net)
#          → backend: whisper-webui-scaled (ExternalName)
#          → keda-add-ons-http-interceptor-proxy.keda:8080
#          → matches HTTPScaledObject by Host header
#          → buffers request, scales Deployment 0→1 if needed
#          → forwards to whisper-webui:80 (containerPort 7860)
# Selector-less ClusterIP Service with an EndpointSlice reconciled by the
# `keda-ep-reconciler` CronJob (see clusters/wrtk8s/keda/interceptor-
# endpointslice-reconciler.yaml). The CronJob populates the endpoints
# with the current KEDA interceptor *pod* IPs every 15 min. Earlier
# attempts to put the interceptor Service ClusterIP in the endpoints
# silently fail — kube-proxy only forwards EndpointSlice entries that
# resolve to pod IPs. The reconciler-managed state is deliberately NOT
# duplicated here, so Flux won't blow it away on every reconcile.
apiVersion: v1
kind: Service
metadata:
  name: whisper-webui-scaled
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: whisper-webui
  namespace: default
spec:
  # Host header the interceptor matches against. Tailscale operator
  # preserves the client's original Host, which is the FQDN below.
  hosts:
    - whisper.gerbil-dragon.ts.net
    # `whisper` tailnet node went offline for 22+ days, so the tailscale
    # operator re-registered the proxy under `whisper-1`. Keep both so
    # the ingress works whichever name the operator currently owns.
    - whisper-1.gerbil-dragon.ts.net
    - whisper-webui-scaled
    - whisper-webui-scaled:8080
  scaleTargetRef:
    name: whisper-webui
    kind: Deployment
    apiVersion: apps/v1
    service: whisper-webui
    port: 80
  replicas:
    min: 0
    max: 1
  # 30 min of idle before KEDA scales whisper back to 0. In the current
  # tailnet routing (tailscale proxy dials whisper-webui direct, bypassing
  # the KEDA interceptor) KEDA never sees in-flight requests, so scale-down
  # was firing mid-transcription and killing the pod. 30 min covers most
  # audio files comfortably.
  scaledownPeriod: 1800
