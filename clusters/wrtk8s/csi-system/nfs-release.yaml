apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: csi-system
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-nfs
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: csi-system
  values:
    controller:
      # Only the control-plane taint: tolerating every NoSchedule taint let the
      # scheduler place the controller on a cordoned, powered-off node (qb2)
      # after an eviction, leaving NFS provisioning down. The node plugin below
      # is a DaemonSet and does need to run everywhere.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    node:
      tolerations:
        - operator: Exists
          effect: NoSchedule
