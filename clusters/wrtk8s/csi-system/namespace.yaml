apiVersion: v1
kind: Namespace
metadata:
  name: csi-system
  labels:
    # All 3 CSI drivers (local-path, nfs-csi, synology-csi) need privileged
    # to mount host paths / kernel modules from their DaemonSets.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
