# Synology DSM API credentials for the synology-csi driver. Originally
# created with `kubectl create secret ... --from-file=client-info.yml`
# out-of-band, so it disappeared when we deleted the old synology-csi
# namespace. Wire through 1Password now so the next ns rename doesn't
# lose it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: client-info-secret
  namespace: csi-system
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: client-info-secret
  data:
    # 1P item `csi-system_client-info-secret`, field `client-info.yml`
    # containing the full DSM connection YAML, e.g.:
    #   clients:
    #     - host: 10.1.1.4
    #       port: 5000
    #       https: false
    #       username: <dsm-user>
    #       password: <dsm-pass>
    - secretKey: client-info.yml
      remoteRef:
        key: csi-system_client-info-secret/client-info.yml
