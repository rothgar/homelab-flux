# Synology DSM API credentials for the synology-csi driver. Originally
# created out-of-band, wired through 1Password now so the next ns rename
# doesn't lose it. The CSI driver expects a `client-info.yml` file
# containing a full connection block; 1P stores the two secret fields
# individually as `username` + `password`, so ESO's target.template
# renders them into the file shape the CSI mounts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: client-info-secret
  namespace: csi-system
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: client-info-secret
    template:
      engineVersion: v2
      data:
        client-info.yml: |
          clients:
            - host: 10.1.1.4
              port: 5000
              https: false
              username: "{{ .username }}"
              password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: csi-system_client-info-secret/username
    - secretKey: password
      remoteRef:
        key: csi-system_client-info-secret/password
