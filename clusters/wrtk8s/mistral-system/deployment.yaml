apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mistral-cache
  namespace: mistral-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral
  namespace: mistral-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mistral
  template:
    metadata:
      labels:
        app: mistral
    spec:
      terminationGracePeriodSeconds: 30
      hostIPC: true
      nodeSelector:
        kubernetes.io/hostname: benchy
      initContainers:
        - name: download-weights
          image: ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.9.0-9b67e09-a91b644
          command:
            - /bin/bash
            - -c
            - |
              set -e
              WEIGHTS_DIR=/home/container_app_user/cache_root/weights/Mistral-7B-Instruct-v0.3
              if [ -f "${WEIGHTS_DIR}/config.json" ]; then
                echo "Model weights already present, skipping download"
                exit 0
              fi
              mkdir -p "${WEIGHTS_DIR}"
              echo "Downloading Mistral-7B-Instruct-v0.3 weights..."
              /home/container_app_user/tt-metal/python_env/bin/huggingface-cli download \
                mistralai/Mistral-7B-Instruct-v0.3 \
                --local-dir "${WEIGHTS_DIR}" \
                --token "${HF_TOKEN}"
              echo "Download complete"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          volumeMounts:
            - name: model-cache
              mountPath: /home/container_app_user/cache_root
      containers:
        - name: mistral
          image: ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.9.0-9b67e09-a91b644
          args:
            - /home/container_app_user/tt-metal/python_env/bin/python
            - /home/container_app_user/app/src/run_vllm_api_server.py
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: CACHE_ROOT
              value: /home/container_app_user/cache_root
            - name: TT_MODEL_SPEC_JSON_PATH
              value: /etc/tt-inference/model-spec.json
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              hugepages-1Gi: 4Gi
              memory: 16Gi
            requests:
              hugepages-1Gi: 4Gi
              memory: 16Gi
          securityContext:
            privileged: true
          volumeMounts:
            - name: tenstorrent
              mountPath: /dev/tenstorrent
            - name: hugepages
              mountPath: /dev/hugepages-1G
            - name: model-cache
              mountPath: /home/container_app_user/cache_root
            - name: model-spec
              mountPath: /etc/tt-inference
      volumes:
        - name: tenstorrent
          hostPath:
            path: /dev/tenstorrent
            type: Directory
        - name: hugepages
          emptyDir:
            medium: HugePages-1Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: mistral-cache
        - name: model-spec
          configMap:
            name: mistral-model-spec
---
apiVersion: v1
kind: Service
metadata:
  name: mistral-server
  namespace: mistral-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "mistral"
spec:
  selector:
    app: mistral
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
