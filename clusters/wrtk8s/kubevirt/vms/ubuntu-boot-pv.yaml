apiVersion: v1
kind: PersistentVolume
metadata:
  name: ubuntu-boot-local
spec:
  capacity:
    storage: 232Gi
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /dev/sda
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - 3d
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubuntu-boot-local
  namespace: kubevirt
spec:
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: ubuntu-boot-local
  resources:
    requests:
      storage: 232Gi
