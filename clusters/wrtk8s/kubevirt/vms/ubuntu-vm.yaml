apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubuntu-home
  namespace: kubevirt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-synology
  resources:
    requests:
      storage: 50Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu
  namespace: kubevirt
spec:
  running: true
  dataVolumeTemplates: []
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      nodeSelector:
        kubernetes.io/hostname: 3d
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          gpus:
            - name: gpu
              deviceName: nvidia.com/gpu-passthrough
          interfaces:
            - name: default
              masquerade: {}
            - name: lan
              macAddress: "9a:85:55:74:10:98"
              bridge: {}
          disks:
            - name: boot
              disk:
                bus: virtio
            - name: home
              disk:
                bus: virtio
            - name: smb-credentials
              disk:
                bus: virtio
              serial: SMBCREDS
            - name: cloudinit
              disk:
                bus: virtio
      networks:
        - name: default
          pod: {}
        - name: lan
          multus:
            networkName: br0
      volumes:
        - name: boot
          persistentVolumeClaim:
            claimName: ubuntu-boot-local
        - name: home
          persistentVolumeClaim:
            claimName: ubuntu-home
        - name: smb-credentials
          secret:
            secretName: ubuntu-smb-credentials
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: ubuntu-cloudinit
