apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubuntu-home
  namespace: kubevirt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-synology
  resources:
    requests:
      storage: 50Gi
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ubuntu-boot
  namespace: kubevirt
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: nfs-synology
    resources:
      requests:
        storage: 20Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu
  namespace: kubevirt
spec:
  running: true
  dataVolumeTemplates: []
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      nodeSelector:
        kubernetes.io/hostname: 3d
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          gpus:
            - name: gpu
              deviceName: nvidia.com/gpu-passthrough
          interfaces:
            - name: default
              masquerade: {}
            - name: lan
              macAddress: "9a:85:55:74:10:98"
              bridge: {}
          disks:
            - name: boot
              disk:
                bus: virtio
            - name: home
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
      networks:
        - name: default
          pod: {}
        - name: lan
          multus:
            networkName: br0
      volumes:
        - name: boot
          dataVolume:
            name: ubuntu-boot
        - name: home
          persistentVolumeClaim:
            claimName: ubuntu-home
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: ubuntu
              manage_etc_hosts: true
              ssh_pwauth: true
              users:
                - name: ubuntu
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: false
                  plain_text_passwd: ubuntu
                  ssh_authorized_keys:
                    - ssh-rsa 
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINK1AyRqlsnygTUljmL7cXgHkFsb3mDU6gb0MIwZnZ0O
                  ssh_import_id:
                    - gh:rothgar
              mounts:
                - [/dev/vdb, /home, ext4, "defaults,nofail", "0", "2"]
              bootcmd:
                - |
                  if ! blkid /dev/vdb; then
                    mkfs.ext4 /dev/vdb
                  fi
              package_update: true
              packages:
                - qemu-guest-agent
                - ubuntu-desktop-minimal
                - spice-vdagent
                - flatpak
                - nvidia-driver-550
                - evdi-dkms
              write_files:
                - path: /etc/X11/xorg.conf.d/10-nvidia-virtual.conf
                  content: |
                    Section "Device"
                        Identifier "NVIDIA"
                        Driver     "nvidia"
                        BusID      "PCI:10:0:0"
                        Option     "ConnectedMonitor" "DFP-0"
                        Option     "AllowEmptyInitialConfiguration" "true"
                        Option     "ModeValidation" "NoDFPNativeResolutionCheck,NoVirtualSizeCheck,NoMaxPClkCheck,NoHorizSyncCheck,NoVertRefreshCheck,NoWidthAlignmentCheck"
                    EndSection

                    Section "Monitor"
                        Identifier "Monitor0"
                        HorizSync  28.0-280.0
                        VertRefresh 43.0-240.0
                        Modeline "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
                        Modeline "2560x1440_60" 241.50 2560 2608 2640 2720 1440 1443 1448 1481 +hsync +vsync
                        Modeline "3840x2160_60" 533.00 3840 3888 3920 4000 2160 2163 2168 2222 +hsync +vsync
                    EndSection

                    Section "Screen"
                        Identifier "Screen0"
                        Device     "NVIDIA"
                        Monitor    "Monitor0"
                        DefaultDepth 24
                        SubSection "Display"
                            Depth 24
                            Modes "3840x2160" "2560x1440" "1920x1080" "1600x900" "1280x720"
                        EndSubSection
                    EndSection
                - path: /etc/modprobe.d/evdi.conf
                  content: |
                    options evdi initial_device_count=1
                    softdep drm post: evdi
                - path: /etc/modules-load.d/evdi.conf
                  content: |
                    evdi
                - path: /etc/gdm3/custom.conf
                  content: |
                    [daemon]
                    WaylandEnable=false
                    AutomaticLoginEnable=true
                    AutomaticLogin=ubuntu

                    [security]

                    [xdmcp]

                    [chooser]

                    [debug]
              runcmd:
                - systemctl enable --now qemu-guest-agent
                - systemctl set-default graphical.target
                - systemctl enable gdm
                - wget -O /tmp/sunshine.deb https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-ubuntu-24.04-amd64.deb
                - apt install -y /tmp/sunshine.deb
                - rm /tmp/sunshine.deb
                - sudo -u ubuntu bash -c 'mkdir -p /home/ubuntu/.config/sunshine && echo "capture = x11" > /home/ubuntu/.config/sunshine/sunshine.conf'
                - sudo -u ubuntu bash -c 'systemctl --user enable sunshine'
                - setcap cap_sys_admin+p $(readlink -f $(which sunshine)) || true
                - flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
                - flatpak install -y flathub com.moonlight_stream.Moonlight
