apiVersion: v1
kind: Secret
metadata:
  name: ubuntu-cloudinit
  namespace: kubevirt
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: ubuntu
    manage_etc_hosts: true
    ssh_pwauth: true
    users:
      - name: ubuntu
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        lock_passwd: false
        plain_text_passwd: ubuntu
        ssh_authorized_keys:
          - ssh-rsa 
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINK1AyRqlsnygTUljmL7cXgHkFsb3mDU6gb0MIwZnZ0O
        ssh_import_id:
          - gh:rothgar
    bootcmd:
      - mkdir -p /mnt/smb-credentials
      - mount /dev/$(lsblk -o NAME,SERIAL | grep SMBCREDS | awk '{print $1}') /mnt/smb-credentials
    package_update: true
    packages:
      - qemu-guest-agent
      - vanilla-gnome-desktop
      - flatpak
      - nvidia-driver-550
      - cifs-utils
      - fuse3
      - libfuse2t64
      - libapr1t64
      - libaprutil1t64
      - libasound2t64
      - libglib2.0-0t64
      - libxcb-composite0
      - libxcb-cursor0
      - libxcb-xinput0
      - libxcb-xinerama0
      - libavcodec-extra
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - ffmpeg
      - nfs-kernel-server
    write_files:
      - path: /etc/X11/xorg.conf.d/10-nvidia-virtual.conf
        content: |
          Section "Device"
              Identifier "NVIDIA"
              Driver     "nvidia"
              Option     "ConnectedMonitor" "DFP-0"
              Option     "AllowEmptyInitialConfiguration" "true"
              Option     "ModeValidation" "NoDFPNativeResolutionCheck,NoVirtualSizeCheck,NoMaxPClkCheck,NoHorizSyncCheck,NoVertRefreshCheck,NoWidthAlignmentCheck"
          EndSection

          Section "Monitor"
              Identifier "Monitor0"
              HorizSync  28.0-280.0
              VertRefresh 43.0-240.0
              Modeline "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
              Modeline "2560x1440_60" 241.50 2560 2608 2640 2720 1440 1443 1448 1481 +hsync +vsync
              Modeline "3840x2160_60" 533.00 3840 3888 3920 4000 2160 2163 2168 2222 +hsync +vsync
          EndSection

          Section "Screen"
              Identifier "Screen0"
              Device     "NVIDIA"
              Monitor    "Monitor0"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "3840x2160" "2560x1440" "1920x1080" "1600x900" "1280x720"
              EndSubSection
          EndSection
      - path: /etc/gdm3/custom.conf
        content: |
          [daemon]
          WaylandEnable=false
          AutomaticLoginEnable=true
          AutomaticLogin=ubuntu

          [security]

          [xdmcp]

          [chooser]

          [debug]
      - path: /etc/exports
        append: true
        content: |
          /home/ubuntu/Videos 10.1.0.0/22(rw,sync,no_subtree_check,no_root_squash)
      - path: /etc/dconf/profile/user
        content: |
          user-db:user
          system-db:local
      - path: /etc/dconf/db/local.d/00-vm-defaults
        content: |
          [org/gnome/desktop/input-sources]
          sources=[('xkb', 'us+dvorak'), ('xkb', 'us')]

          [org/gnome/desktop/screensaver]
          lock-enabled=false

          [org/gnome/desktop/session]
          idle-delay=uint32 0
    runcmd:
      - systemctl enable --now qemu-guest-agent
      - exportfs -ra
      - systemctl enable --now nfs-kernel-server
      - systemctl set-default graphical.target
      - systemctl enable gdm
      - wget -O /tmp/sunshine.deb https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-ubuntu-24.04-amd64.deb
      - apt install -y /tmp/sunshine.deb
      - rm /tmp/sunshine.deb
      - loginctl enable-linger ubuntu
      - sudo -u ubuntu bash -c 'mkdir -p /home/ubuntu/.config/sunshine && echo "capture = x11" > /home/ubuntu/.config/sunshine/sunshine.conf'
      # Wait for user@1000 manager to be ready, then enable+start sunshine with proper dbus session
      - until [ -S /run/user/1000/bus ]; do sleep 1; done
      - sudo -u ubuntu XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus systemctl --user enable --now sunshine
      - setcap cap_sys_admin+p $(readlink -f $(which sunshine)) || true
      - mkdir -p /mnt/d/public /mnt/d/video
      - echo '//10.1.1.4/public /mnt/d/public cifs credentials=/mnt/smb-credentials/credentials,uid=1000,gid=1000,nofail 0 0' >> /etc/fstab
      - echo '//10.1.1.4/video /mnt/d/video cifs credentials=/mnt/smb-credentials/credentials,uid=1000,gid=1000,nofail 0 0' >> /etc/fstab
      - mount -a
      - dconf update
      # Install Steam
      - dpkg --add-architecture i386
      - apt update
      - DEBIAN_FRONTEND=noninteractive apt install -y steam-installer
      # Install DaVinci Resolve Studio from SMB share.
      # Note: recent Blackmagic installers refuse to run as root — install manually
      # after first boot if this step fails.
      - SKIP_PACKAGE_CHECK=1 /mnt/d/public/install/resolve/DaVinci_Resolve_Studio_20.3.1_Linux.run -i -a -y || true
      - mkdir -p /opt/resolve/libs/disabled
      - mv /opt/resolve/libs/libglib-2.0.so* /opt/resolve/libs/libgio-2.0.so* /opt/resolve/libs/libgobject-2.0.so* /opt/resolve/libs/libgmodule-2.0.so* /opt/resolve/libs/disabled/ 2>/dev/null || true
      # Flatpak
      - flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - flatpak install -y flathub com.moonlight_stream.Moonlight
