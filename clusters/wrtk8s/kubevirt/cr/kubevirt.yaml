apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - GPU
    permittedHostDevices:
      pciHostDevices:
        - pciVendorSelector: "10DE:1B81"
          resourceName: nvidia.com/gpu-passthrough
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  infra:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
  workloadUpdateStrategy: {}
