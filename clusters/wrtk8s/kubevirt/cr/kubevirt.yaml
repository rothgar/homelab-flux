apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - GPU
    permittedHostDevices:
      mediatedDevices: []
      externalResourceProvider: true
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  infra:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
  workloadUpdateStrategy: {}
