apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/containerized-data-importer/releases/download/v1.64.0/cdi-cr.yaml
patches:
  - target:
      kind: CDI
      name: cdi
    patch: |
      - op: add
        path: /spec/config/scratchSpaceStorageClass
        value: nfs-synology
