apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt-manager/kubevirt-manager/releases/download/v1.5.4/bundled-v1.5.4.yaml
namespace: kubevirt
patches:
  # Remove the kubevirt-manager namespace since we use the existing kubevirt namespace
  - target:
      kind: Namespace
      name: kubevirt-manager
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kubevirt-manager
  # Pin image to release version and schedule on amd64 nodes
  - target:
      kind: Deployment
      name: kubevirt-manager
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: kubevirtmanager/kubevirt-manager:1.5.4
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: amd64
  # Expose via Tailscale
  - target:
      kind: Service
      name: kubevirt-manager
    patch: |
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations/tailscale.com~1expose
        value: "true"
      - op: add
        path: /metadata/annotations/tailscale.com~1hostname
        value: kubevirt
  # Fix ClusterRoleBinding subjects to reference kubevirt namespace
  - target:
      kind: ClusterRoleBinding
    patch: |
      - op: replace
        path: /subjects/0/namespace
        value: kubevirt
