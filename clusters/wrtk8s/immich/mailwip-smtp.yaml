# Mailwip SMTP credentials + Immich's config file.
#
# A config file at IMMICH_CONFIG_FILE overrides the DB settings on every
# startup. Immich does NOT expand ${VAR} in it, so the whole file is
# rendered by ESO into the immich-config Secret with real values.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailwip-smtp
  namespace: immich
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mailwip-smtp
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: mailwip-smtp/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: immich
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-config
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "notifications": {
              "smtp": {
                "enabled": true,
                "from": "Immich <noreply@jgarr.net>",
                "replyTo": "noreply@jgarr.net",
                "transport": {
                  "ignoreCert": false,
                  "host": "smtp.hanami.run",
                  "port": 587,
                  "username": "noreply@jgarr.net",
                  "password": {{ .smtpPassword | toJson }}
                }
              }
            },
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://tsidp.gerbil-dragon.ts.net",
              "clientId": {{ .oauthClientId | toJson }},
              "clientSecret": {{ .oauthClientSecret | toJson }},
              "scope": "openid email profile",
              "tokenEndpointAuthMethod": "client_secret_post",
              "buttonText": "Login with Tailscale",
              "autoRegister": true,
              "autoLaunch": false,
              "storageLabelClaim": "username",
              "mobileOverrideEnabled": true,
              "mobileRedirectUri": "https://immich.jgarr.net/api/oauth/mobile-redirect"
            },
            "passwordLogin": {
              "enabled": true
            }
          }
  data:
    - secretKey: smtpPassword
      remoteRef:
        key: mailwip-smtp/password
    - secretKey: oauthClientId
      remoteRef:
        key: immich_immich-oidc/client-id
    - secretKey: oauthClientSecret
      remoteRef:
        key: immich_immich-oidc/client-secret
