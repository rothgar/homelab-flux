apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-pictures
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.1.1.4
    path: /volume1/pictures
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-pictures
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-pictures
  resources:
    requests:
      storage: 1Ti
