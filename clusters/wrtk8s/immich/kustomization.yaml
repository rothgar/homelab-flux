apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - source.yaml
  - library-pvc.yaml
  - pictures-pvc.yaml
  - postgres.yaml
  - release.yaml
  - httproute.yaml
  - tailscale-ingress.yaml
  - external-secret.yaml
  # NOTE: ml-scaler.yaml contains an HTTPScaledObject that depends on the KEDA
  # HTTP add-on CRD. Re-enable this line AFTER Flux has installed the keda
  # namespace's HelmReleases (check with `kubectl get crds | grep http.keda.sh`).
  # Leaving it uncommented before that CRD exists blocks the entire root
  # Kustomization on dry-run failure.
  # - ml-scaler.yaml
