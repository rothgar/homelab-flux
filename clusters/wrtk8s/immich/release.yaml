apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      # immich-0.13.2 is tagged in git but not yet published to the
      # https://immich-app.github.io/immich-charts index (index.yaml
      # tops out at 0.12.0). Stay on 0.12.0 for the chart itself; the
      # image tags below carry the actual app version bump.
      version: "0.12.0"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  values:
    immich:
      persistence:
        library:
          existingClaim: immich-library

    server:
      enabled: true
      controllers:
        main:
          # Keep immich-server on nodes whose LAN IP is in the Synology's
          # NFS export allowlist. sparky (spark) sits on a different DHCP
          # scope (10.1.15.0/24) that the Synology's `/volume1/pictures`
          # and CSI-provisioned `/volume1/kubernetes/*` exports don't
          # accept — mounts fail with "access denied by server". Remove
          # this once the Synology exports are widened to 10.1.0.0/16.
          pod:
            nodeSelector:
              kubernetes.io/arch: amd64
          containers:
            main:
              image:
                # renovate: image=ghcr.io/immich-app/immich-server
                tag: v3.2.2
              env:
                DB_URL: "postgresql://immich:immich@immich-postgres:5432/immich"
                # Route ML calls through KEDA HTTP interceptor so the ML
                # Deployment can scale to zero. See ml-scaler.yaml.
                IMMICH_MACHINE_LEARNING_URL: "http://immich-ml-scaled:8080"
                # Mailwip SMTP (see mailwip-smtp.yaml). Immich substitutes
                # ${SMTP_PASSWORD} from envFrom into the JSON on load.
                IMMICH_CONFIG_FILE: /etc/immich/config.json
              envFrom:
                - secretRef:
                    name: mailwip-smtp
      persistence:
        pictures:
          enabled: true
          existingClaim: immich-pictures
          globalMounts:
            - path: /mnt/external/pictures
              readOnly: true
        mail-config:
          enabled: true
          type: configMap
          name: immich-mail-config
          globalMounts:
            - path: /etc/immich
              readOnly: true

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                # renovate: image=ghcr.io/immich-app/immich-machine-learning
                tag: v3.2.2-cuda
              env:
                DB_URL: "postgresql://immich:immich@immich-postgres:5432/immich"
              resources:
                limits:
                  nvidia.com/gpu: 1
          pod:
            runtimeClassName: nvidia
            nodeSelector:
              nvidia.com/gpu: "true"
              kubernetes.io/arch: amd64
      persistence:
        cache:
          enabled: true
          storageClass: local-path
          size: 10Gi

    valkey:
      enabled: true
