apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-values
  namespace: home-assistant
data:
  values.yaml: |
    persistence:
      enabled: true
    service:
      type: LoadBalancer
      additionalPorts:
        - name: homekit-1
          port: 21063
          targetPort: 21063
          protocol: TCP
        - name: homekit-2
          port: 21064
          targetPort: 21064
          protocol: TCP
        - name: homekit-3
          port: 21065
          targetPort: 21065
          protocol: TCP
    configuration:
      enabled: true
      forceInit: true
      trusted_proxies:
        - 10.244.0.0/16
        - 10.96.0.0/12
        - 100.64.0.0/10
