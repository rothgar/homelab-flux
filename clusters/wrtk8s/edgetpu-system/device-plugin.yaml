apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coral-edgetpu-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coral-edgetpu-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: coral-edgetpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coral-edgetpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        google.com/edgetpu: "true"
      tolerations:
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: coral-edgetpu-device-plugin
          image: ghcr.io/squat/generic-device-plugin:0.2.0
          args:
            - --domain=google.com
            - --device
            - |
              name: edgetpu
              groups:
                - paths:
                    - path: /dev/apex_0
          resources:
            requests:
              cpu: 50m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 40Mi
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
