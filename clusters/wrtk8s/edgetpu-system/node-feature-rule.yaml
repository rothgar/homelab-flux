apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: coral-edgetpu
spec:
  rules:
    - name: coral-edgetpu
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor:
              op: In
              value: ["1ac1"]
            device:
              op: In
              value: ["089a"]
      labels:
        google.com/edgetpu: "true"
