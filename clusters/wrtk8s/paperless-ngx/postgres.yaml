apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless-ngx
spec:
  instances: 1
  # Single-instance homelab DB — the auto-generated PDB (minAvailable=1) blocks
  # node drains during Talos upgrades. Disable it so drain proceeds; the ~30s
  # postgres restart on a new node is acceptable downtime.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db-credentials

  storage:
    size: 10Gi
    storageClass: nfs-synology

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
