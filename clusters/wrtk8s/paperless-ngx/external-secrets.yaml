apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db-credentials
  namespace: paperless-ngx
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: paperless-ngx_paperless-db-credentials/username
    - secretKey: password
      remoteRef:
        key: paperless-ngx_paperless-db-credentials/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secret-key
  namespace: paperless-ngx
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-secret-key
  data:
    - secretKey: secret-key
      remoteRef:
        key: paperless-ngx_paperless-secret-key/secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-admin
  namespace: paperless-ngx
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-admin
  data:
    - secretKey: username
      remoteRef:
        key: paperless-ngx_paperless-admin/username
    - secretKey: password
      remoteRef:
        key: paperless-ngx_paperless-admin/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-oidc
  namespace: paperless-ngx
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-oidc
    template:
      engineVersion: v2
      data:
        providers: '{"openid_connect": {"SCOPE": ["openid", "profile", "email"], "OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "tailscale", "name": "Tailscale", "client_id": "{{ .clientId }}", "secret": "{{ .clientSecret }}", "settings": {"server_url": "https://tsidp.gerbil-dragon.ts.net/.well-known/openid-configuration", "token_auth_method": "client_secret_post"}}]}}'
  data:
    - secretKey: clientId
      remoteRef:
        key: paperless-ngx_paperless-oidc/client-id
    - secretKey: clientSecret
      remoteRef:
        key: paperless-ngx_paperless-oidc/client-secret
