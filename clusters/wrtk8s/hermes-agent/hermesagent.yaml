# HermesAgent CR wired to Aperture as an OpenAI-compatible upstream.
# The `custom` provider (aliases: vllm, ollama, local, llamacpp) is Hermes'
# generic passthrough for local/OpenAI-compat servers; no key_env => keyless
# request (Aperture on the tailnet doesn't require auth).
apiVersion: agents.hermeum.app/v1alpha1
kind: HermesAgent
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  hermes:
    config:
      raw:
        model:
          provider: custom
          default: hermes-4.3-36b
          base_url: https://ai.gerbil-dragon.ts.net/v1
    storage:
      persistence:
        enabled: true
        size: 5Gi
        # nfs-synology-open sets mountPermissions=0777 on fresh PVCs.
        # The hermes-agent init container runs as UID 10000; without
        # 0777 (or an fsGroup the CRD doesn't expose) it can't
        # `mkdir /opt/data` on either synology-iscsi (root:root) or
        # plain nfs-synology (Synology's default 0755 mode).
        storageClassName: nfs-synology-open
