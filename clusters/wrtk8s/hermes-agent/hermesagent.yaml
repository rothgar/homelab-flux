# HermesAgent CR wired to Aperture as an OpenAI-compatible upstream.
# The `custom` provider (aliases: vllm, ollama, local, llamacpp) is Hermes'
# generic passthrough for local/OpenAI-compat servers; no key_env => keyless
# request (Aperture on the tailnet doesn't require auth).
#
# Discord bot token + allowed-user ID live in the `hermes-discord` Secret
# (provisioned via `kubectl create secret` — same out-of-band pattern as
# the Gotify tokens). Migrate to ExternalSecret + 1Password when convenient.
apiVersion: agents.hermeum.app/v1alpha1
kind: HermesAgent
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  hermes:
    config:
      raw:
        model:
          provider: custom
          default: hermes-4.3-36b
          # Reach aperture through the Tailscale operator egress proxy
          # (see aperture-egress.yaml). The proxy joins the tailnet as
          # tag:k8s, which aperture's ACL grants map to `role:admin,
          # models:**`. Pods can't resolve *.gerbil-dragon.ts.net
          # directly (no tailscaled in-pod), so we go via the k8s
          # ExternalName Service instead of the tailnet FQDN.
          base_url: http://aperture.hermes-agent.svc.cluster.local/v1
        mcp_servers:
          aperture:
            # Aperture serves MCP at /v1/mcp (verified 2026-09-23:
            # `curl -X POST … /v1/mcp -d '{"jsonrpc":"2.0",…}'` → 200).
            url: http://aperture.hermes-agent.svc.cluster.local/v1/mcp
            enabled: true
        # Discord behaviour knobs. Token + allowed users come from the
        # workspace dotEnv Secret below.
        discord:
          require_mention: true
          auto_thread: true
          history_backfill: true
    workspace:
      # hermes-discord Secret → $HERMES_HOME/.env, so the discord platform
      # plugin (auto-enabled once DISCORD_BOT_TOKEN is present) picks up
      # credentials and the allowlist.
      dotEnv:
        secretRef:
          name: hermes-discord
    storage:
      persistence:
        enabled: true
        # existingClaim references the pre-provisioned synology-iscsi
        # PVC that data-pvc.yaml chowns to 10000:10000 with a one-shot
        # Job — needed because the CRD doesn't expose
        # podSecurityContext.fsGroup, iSCSI PVs come up root:root, and
        # Synology's NFS export refuses UID 10000 writes even at 0777.
        existingClaim: hermes-data
