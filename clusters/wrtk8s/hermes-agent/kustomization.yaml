apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - source.yaml
  - release.yaml
  # Added in a follow-up commit after the HelmRelease landed the CRD —
  # Flux dry-runs the whole tree before applying, so leaving the CR in
  # the same commit as the operator blocks reconciliation on the first
  # apply. Once the CRD is registered this is safe.
  - hermesagent.yaml
