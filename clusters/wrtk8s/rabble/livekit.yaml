apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: rabble
  labels:
    app: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      # Disable automatic service env vars (e.g. LIVEKIT_PORT=tcp://...) which
      # crash the LiveKit server because it tries to parse them as command-line
      # flags.
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Media runs on the node's own network namespace so the SFU's host ICE
      # candidate is the node IP (reachable from the LAN) and its STUN lookups
      # leave from the same port it serves media on. Pinned to one node so the
      # address is stable; if you ever forward UDP 7882 / TCP 7881 on the
      # router, point them at this node.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: sparky
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.8
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/livekit/livekit.yaml"
            - "--bind"
            - "0.0.0.0"
            # Single UDP ICE media port (7882), matching the LoadBalancer Service.
            - "--udp-port"
            - "7882"
            - "--keys"
            - "devkey: devsecret0123456789abcdef0123456789abcdef"
            # The node IP (downward-API hostIP). With use_external_ip set in
            # the config file LiveKit also discovers the WAN address via STUN
            # and advertises both.
            - "--node-ip"
            - "$(NODE_IP)"
            - "--dev"
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
              readOnly: true
          # Reachability, in order of preference:
          #   * LAN clients: direct to <node IP>:7882 (host candidate).
          #   * Everyone else: the WAN address is advertised too, but nothing
          #     is forwarded on the router, so the client relays through
          #     Cloudflare TURN. The app mints per-join TURN credentials when
          #     the `rabble-turn` Secret exists (see app.yaml); the SFU dials
          #     the relay outbound, which the home NAT allows.
          #   * The public WSS signaling plane goes through the Cloudflare
          #     Tunnel public hostname rabble-livekit.jgarr.net.
          ports:
            - name: signaling
              containerPort: 7880
            - name: tcp-ice
              containerPort: 7881
            - name: udp-ice
              containerPort: 7882
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: livekit-config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: rabble
data:
  # Command-line flags in the Deployment override anything repeated here.
  livekit.yaml: |
    rtc:
      tcp_port: 7881
      udp_port: 7882
      # Discover the WAN address via STUN and advertise it as a host
      # candidate alongside the node IP, so a TURN relay has a public
      # address to send to (the client only grants the relay permission for
      # addresses it was told about).
      use_external_ip: true
      # Validation sends a probe to the discovered address and expects it
      # back, which needs a router port forward or NAT hairpin. Neither is
      # set up, so trust the STUN result.
      skip_external_ip_validation: true
      # Keep the node IP candidate for LAN clients.
      advertise_internal_ip: true
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: rabble
  labels:
    app: livekit
spec:
  type: LoadBalancer
  selector:
    app: livekit
  ports:
    # TCP signaling. Referenced as the backend of the rabble-livekit Ingress
    # (WSS plane) and by the app via LIVEKIT_URL. Exposed on the LoadBalancer
    # too so a client can hit raw ws:// directly if desired.
    - name: signaling
      port: 7880
      targetPort: 7880
    # TCP ICE candidate — helpful when UDP is blocked.
    - name: tcp-ice
      port: 7881
      targetPort: 7881
    # UDP ICE media plane. In production you typically expose a whole range
    # (e.g. 50000-50100) and rely on the network layer to route it to the pod;
    # single port 7882 is fine for the --dev single-port setup.
    - name: udp-ice
      port: 7882
      targetPort: 7882
      protocol: UDP
