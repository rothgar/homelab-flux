# DEV-only plain in-cluster Secrets. These replace the 1Password ExternalSecrets
# (external-secret.yaml) so the stack can be deployed without a 1Password
# integration. Values are dev placeholders — do not reuse in production.
apiVersion: v1
kind: Secret
metadata:
  name: rabble-db-credentials
  namespace: rabble
type: Opaque
stringData:
  # Must match the CNPG bootstrap.initdb secret reference (postgres.yaml) and
  # the DATABASE_URL used by the app.
  username: bluesky
  password: bluesky
---
apiVersion: v1
kind: Secret
metadata:
  name: rabble-app-secrets
  namespace: rabble
type: Opaque
stringData:
  # Fixed 64-char hex dev value (openssl rand -hex 32).
  SESSION_SECRET: 2da5c6c2bb7322c86376211be7571ee582b8fdd31e5ec743fd29b1e79da1b68f
  # Public URL over the tailnet (Tailscale Ingress serves the short hostname
  # rabble.gerbil-dragon.ts.net).
  PUBLIC_URL: https://rabble.gerbil-dragon.ts.net
  # Development JWKS private key (dev-only, non-production). A real key pair is
  # committed at /home/jgarr/src/rabble.radio/private-key.pem and embedded below.
  JWKS_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg3cly37UzgKREx3Xz
    eaYF7kXXLHP+/xrADQy8lKDXIQGhRANCAATg2kmzdX1y2c7PpU39wmL6QBuCvoBi
    kFIHHiq7Iy2TW7fR0zuEZu43sPCbVgX7FfrQLjiNbqb8MgvtL3qfBmcK
    -----END PRIVATE KEY-----
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: devsecret0123456789abcdef0123456789abcdef
  LIVEKIT_URL: ws://livekit:7880
  DATABASE_URL: postgresql://bluesky:bluesky@rabble-db-rw.rabble.svc.cluster.local.:5432/bluesky_spaces?schema=public
  # Garage credentials (see garage.yaml). These must match the
  # GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY used to bootstrap the
  # single-node Garage server.
  S3_ACCESS_KEY: GKab260e8ace5111aec9df478455183be5
  S3_SECRET_KEY: 7c019c0f349f40bcadb2c0eb6ef9d3ff42d4f03f947a471d1d01d09757531822
