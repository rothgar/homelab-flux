# Public (LAN / Cloudflare DNS) exposure through the shared Traefik Gateway.
# external-dns publishes rabble.jgarr.net and rabble-livekit.jgarr.net to
# Cloudflare pointing at the Traefik LoadBalancer (10.1.1.152); TLS is
# terminated by the Gateway's wildcard-jgarr-net-tls certificate.
#
# rabble.jgarr.net          -> rabble-app (Next.js)
# rabble-livekit.jgarr.net  -> livekit:7880 (WSS signaling only; UDP media
#                              stays on the MetalLB LoadBalancer, see
#                              livekit.yaml)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabble
  namespace: rabble
  annotations:
    external-dns.alpha.kubernetes.io/hostname: rabble.jgarr.net
    external-dns.alpha.kubernetes.io/target: 10.1.1.152
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
  hostnames:
    - rabble.jgarr.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rabble-app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabble-livekit
  namespace: rabble
  annotations:
    external-dns.alpha.kubernetes.io/hostname: rabble-livekit.jgarr.net
    external-dns.alpha.kubernetes.io/target: 10.1.1.152
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
  hostnames:
    - rabble-livekit.jgarr.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: livekit
          port: 7880
