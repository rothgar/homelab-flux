# Routes on the shared Traefik Gateway (TLS from wildcard-jgarr-net-tls).
#
# Public DNS for these hostnames is NOT managed by external-dns on purpose:
# Bluesky OAuth requires https://rabble.jgarr.net/oauth-client-metadata.json
# to be fetchable from the public internet, and the Traefik LB (10.1.1.152)
# is LAN-only. Both names are published as Cloudflare Tunnel public hostnames
# (configured in the Cloudflare Zero Trust dashboard, same as frigate):
#   rabble.jgarr.net          -> http://rabble-app.rabble.svc.cluster.local:80
#   rabble-livekit.jgarr.net  -> http://livekit.rabble.svc.cluster.local:7880
# These HTTPRoutes keep the hostnames reachable through Traefik for clients
# with a local DNS override to 10.1.1.152. UDP media stays on the MetalLB
# LoadBalancer (see livekit.yaml) and is LAN-only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabble
  namespace: rabble
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
  hostnames:
    - rabble.jgarr.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rabble-app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabble-livekit
  namespace: rabble
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
  hostnames:
    - rabble-livekit.jgarr.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: livekit
          port: 7880
