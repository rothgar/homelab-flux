apiVersion: apps/v1
kind: Deployment
metadata:
  name: arm
  namespace: arm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arm
  template:
    metadata:
      labels:
        app: arm
    spec:
      nodeSelector:
        arm.io/optical-drive: "true"
      containers:
        - name: arm
          image: automaticrippingmachine/automatic-ripping-machine:latest
          ports:
            - containerPort: 8080
          env:
            - name: ARM_UID
              value: "1000"
            - name: ARM_GID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arm-api-keys
                  key: OMDB_API_KEY
          securityContext:
            privileged: true
          volumeMounts:
            - name: media
              mountPath: /home/arm/media
            - name: music
              mountPath: /home/arm/music
            - name: movies
              mountPath: /home/arm/movies
            - name: tv
              mountPath: /home/arm/tv
            - name: config
              mountPath: /etc/arm/config
            - name: dev
              mountPath: /dev
            - name: udev
              mountPath: /run/udev
      volumes:
        - name: media
          emptyDir: {}
        - name: music
          persistentVolumeClaim:
            claimName: arm-music
        - name: movies
          persistentVolumeClaim:
            claimName: arm-movies
        - name: tv
          persistentVolumeClaim:
            claimName: arm-tv
        - name: config
          persistentVolumeClaim:
            claimName: arm-config
        - name: dev
          hostPath:
            path: /dev
        - name: udev
          hostPath:
            path: /run/udev
