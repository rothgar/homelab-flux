apiVersion: apps/v1
kind: Deployment
metadata:
  name: arm
  namespace: arm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arm
  template:
    metadata:
      labels:
        app: arm
    spec:
      nodeSelector:
        arm.io/optical-drive: "true"
      # Share PID namespace so the disc-detector sidecar can `nsenter`
      # into the arm container to invoke the rip wrapper.
      shareProcessNamespace: true
      initContainers:
        - name: fix-media-permissions
          image: busybox
          command: ["sh", "-c", "chown 1000:1000 /media /music && chmod 775 /media /music"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: media
              mountPath: /media
            - name: music
              mountPath: /music
      containers:
        - name: arm
          image: automaticrippingmachine/automatic-ripping-machine:2.24.3
          ports:
            - containerPort: 8080
          env:
            - name: ARM_UID
              value: "1000"
            - name: ARM_GID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arm-api-keys
                  key: OMDB_API_KEY
            - name: MAKEMKV_PERMA_KEY
              valueFrom:
                secretKeyRef:
                  name: arm-api-keys
                  key: MAKEMKV_PERMA_KEY
          securityContext:
            privileged: true
          volumeMounts:
            - name: media
              mountPath: /home/arm/media
            - name: music
              mountPath: /home/arm/music
            - name: config
              mountPath: /etc/arm/config
            # ARM writes arm.db + MakeMKV settings.conf under $HOME, which
            # isn't on the PVC by default — reuse the config PVC via subPath
            # so both survive pod restarts.
            - name: config
              mountPath: /home/arm/db
              subPath: home-db
            - name: config
              mountPath: /home/arm/.MakeMKV
              subPath: home-makemkv
            - name: dev
              mountPath: /dev
            - name: udev
              mountPath: /run/udev
        # Disc-detector sidecar: the ARM container's in-container udevd
        # doesn't reliably fire the rip trigger on media inserts (kernel
        # uevents don't cross the pod's network namespace). Poll the
        # /dev/sr0 block device size instead; on 0 → non-zero, invoke
        # the ARM rip wrapper inside the arm container's namespaces.
        - name: disc-detector
          image: alpine:3.20
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              apk add --no-cache util-linux >/dev/null 2>&1
              prev="?"
              while true; do
                if [ -e /sys/block/sr0/size ]; then
                  curr=$(cat /sys/block/sr0/size)
                else
                  curr="missing"
                fi
                if [ "$prev" = "0" ] && [ "$curr" != "0" ] && [ "$curr" != "missing" ]; then
                  echo "$(date -Iseconds) [disc-detector] disc inserted (size=$curr sectors); triggering ARM"
                  ARM_PID=$(pgrep -f 'sbin/my_init' | head -1)
                  if [ -n "$ARM_PID" ]; then
                    nsenter -t $ARM_PID -a -- /sbin/setuser arm /opt/arm/scripts/docker/docker_arm_wrapper.sh sr0 &
                  else
                    echo "$(date -Iseconds) [disc-detector] ERROR: no my_init PID"
                  fi
                elif [ "$prev" != "?" ] && [ "$prev" != "0" ] && [ "$curr" = "0" ]; then
                  echo "$(date -Iseconds) [disc-detector] disc ejected"
                fi
                prev=$curr
                sleep 15
              done
          volumeMounts:
            - name: dev
              mountPath: /dev
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: arm-media
        - name: music
          persistentVolumeClaim:
            claimName: arm-music
        - name: config
          persistentVolumeClaim:
            claimName: arm-config
        - name: dev
          hostPath:
            path: /dev
        - name: udev
          hostPath:
            path: /run/udev
