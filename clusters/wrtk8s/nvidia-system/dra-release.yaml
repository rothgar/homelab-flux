apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra-driver-gpu
  namespace: nvidia-system
spec:
  interval: 5m
  chart:
    spec:
      chart: dra-driver-nvidia-gpu
      version: 0.4.0
      sourceRef:
        kind: HelmRepository
        name: dra-driver-nvidia
        namespace: nvidia-system
  values:
    resources:
      gpus:
        enabled: true
    nvidiaDriverRoot: /usr/local
    gpuResourcesEnabledOverride: true
    kubeletPlugin:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
