apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: nvidia-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gpu-operator
      version: ">=26.3.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
        namespace: nvidia-system
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    devicePlugin:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
