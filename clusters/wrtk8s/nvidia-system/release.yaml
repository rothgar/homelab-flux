apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: nvidia-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gpu-operator
      version: ">=26.3.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
        namespace: nvidia-system
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    devicePlugin:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    dcgmExporter:
      # Switch from the sparse default-counters.csv (15 series) to the
      # profiling-inclusive dcp-metrics-included.csv shipped in the exporter
      # image: adds tensor/FP64/FP32/FP16/INT active, NVLink BW, PCIe TX/RX,
      # ECC totals, fan, power limits, p-state, XID — ~35 extra series for
      # parity with nvml-based exporters.
      args: ["-f", "/etc/dcgm-exporter/dcp-metrics-included.csv"]
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
