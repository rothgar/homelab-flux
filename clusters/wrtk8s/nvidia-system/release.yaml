apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: nvidia-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gpu-operator
      version: ">=26.3.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
        namespace: nvidia-system
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    devicePlugin:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    dcgmExporter:
      # Disabled 2026-11-17: on our consumer-GPU fleet (RTX 2060/3060, GB10)
      # DCGM's DCP profiling module can't load, so default-counters.csv tops
      # out at ~11–15 series per node while nvidia_gpu_exporter (nvml) gives
      # 100+ at ~1/9th the memory.
      enabled: false
      # Keep the old label: SSA-shrinking the live map to {} encodes it as
      # null, which the ClusterPolicy CRD rejects and wedges every upgrade.
      serviceMonitor:
        enabled: false
        additionalLabels:
          release: kube-prometheus-stack
  upgrade:
    disableWait: true
