apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
  namespace: kubelet-csr-approver
spec:
  interval: 5m
  chart:
    spec:
      chart: kubelet-csr-approver
      sourceRef:
        kind: HelmRepository
        name: kubelet-csr-approver
        namespace: kubelet-csr-approver
  values:
    providerIpPrefixes:
      # LAN is 10.1.0.0/16 in aggregate; sparky was landing in 10.1.15.0/24
      # (different DHCP scope from mini/z/iota which live in 10.1.0.0/22),
      # so its kubelet CSRs were denied for out-of-prefix SAN IP.
      - 10.1.0.0/16
    providerRegex: ".*"
    bypassDnsResolution: true
