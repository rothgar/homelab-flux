# nvidia/Qwen3.8-27B-NVFP4 — mixed-precision quant. MLP layers + lm_head
# are NVFP4 (4-bit, group_size 16), attention (both standard and Gated
# DeltaNet) stays FP8. Weights ~14-18 GB vs the full-FP8 model's ~28 GB,
# so decode throughput on the bandwidth-bound GB10 should roughly double
# from the measured 8.5 tok/s baseline.
#
# Launch args come from the HF card's reference vLLM command, adapted for
# GB10 (TP1, not GB300's TP4). The card specifies `vllm-openai:nightly`
# because NVFP4 support is newer than the `:qwen38` tag carries; this is
# an unversioned image so it changes under us — accept that trade-off or
# re-pin once a stable tag exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-27b-nvfp4
  namespace: vllm-system
spec:
  # Stopped: spark runs rank 0 of qwen38-flash-next (lws/qwen38-flash-next.yaml).
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-27b-nvfp4
  template:
    metadata:
      labels:
        app: qwen38-27b-nvfp4
        vllm-model: "true"
    spec:
      terminationGracePeriodSeconds: 15
      runtimeClassName: nvidia
      hostAliases:
        - ip: 10.1.1.164
          hostnames: [hf.jgarr.net]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - spark
                      - sparky
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vllm-model: "true"
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:nightly
          # vllm/vllm-openai ENTRYPOINT is ["vllm","serve"]; args starts at
          # the model positional.
          args:
            - nvidia/Qwen3.8-27B-NVFP4
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - qwen3.8-27b-nvfp4
            - --trust-remote-code
            - --gpu-memory-utilization
            - "0.85"
            - --tensor-parallel-size
            - "1"
            - --seed
            - "0"
            - --kv-cache-dtype
            - fp8_e4m3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            - --reasoning-parser
            - qwen3
            - --mm-encoder-tp-mode
            - data
            - --enable-chunked-prefill
            - --enable-prefix-caching
            - --max-num-seqs
            - "32"
            - --max-num-batched-tokens
            - "32768"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/huggingface
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Memory request = what the model really occupies, so the scheduler (and the
          # power autoscaler) never packs other memory-hungry pods next to it. On GB10's
          # unified memory vLLM's CUDA allocations aren't charged to the container like
          # ordinary RSS (kubectl top shows ~6-7 GiB), so no memory limit is set.
          # weights 20.4 + KV 8.0 (one 262144-token context, fp8, 32 KiB/token) + runtime ≈ 45 GiB,
          # but --gpu-memory-utilization 0.85 pre-allocates 102.9 GiB (+6 GiB process) → 109Gi
          resources:
            requests:
              memory: 109Gi
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /root/.cache
              subPath: cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/model
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-27b-nvfp4
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "qwen38-27b-nvfp4"
spec:
  selector:
    app: qwen38-27b-nvfp4
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
