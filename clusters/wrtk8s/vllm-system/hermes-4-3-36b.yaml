# NousResearch/Hermes-4.3-36B — dense 36B (SeedOssForCausalLM), 72 GB bf16.
# Pinned to spark; fits comfortably in the GB10's 128 GB unified pool with
# ~15 GB of headroom at max_model_len=32K + max_num_seqs=4. Bump
# --dtype fp8 and --kv-cache-dtype fp8 if you want to double the context
# or fit more concurrent sessions.
#
# Tailnet exposure via the Tailscale operator; the LB annotation gives
# the service an in-tailnet DNS name (hermes-4-3-36b.<tailnet>.ts.net)
# that Aperture can register as its own upstream. Dot-free hostname
# because Tailscale rejects DNS-label dots.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-4-3-36b
  namespace: vllm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-4-3-36b
  template:
    metadata:
      labels:
        app: hermes-4-3-36b
    spec:
      terminationGracePeriodSeconds: 15
      runtimeClassName: nvidia
      # Cluster DNS resolves *.jgarr.net → 47.149.56.32 (WAN wildcard),
      # which pods can't reach. Pulsys HF cache lives on the tailnet at
      # the pulsys-lb MetalLB IP; pin it here until CoreDNS gets a local
      # host override for hf.jgarr.net.
      hostAliases:
        - ip: 10.1.1.164
          hostnames: [hf.jgarr.net]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - spark
      containers:
        - name: vllm
          # v26.06-py3 segfaults on GB10 with driver 595. Pinning to 26.04.
          # seed_oss architecture landed upstream in vLLM 0.7.x; verify with
          # `vllm serve NousResearch/Hermes-4.3-36B --help-model` if the
          # server refuses at boot.
          image: nvcr.io/nvidia/vllm:26.04-py3
          command:
            - vllm
            - serve
            - NousResearch/Hermes-4.3-36B
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - hermes-4.3-36b
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "32768"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            - --enable-prefix-caching
            - --max-num-batched-tokens
            - "8192"
            - --max-num-seqs
            - "4"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/huggingface
            - name: HF_ENDPOINT
              value: http://hf.jgarr.net
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            # ~72 GB weights need to download from the pulsys HF cache on
            # first cold start; give ~90 min total budget (540 * 10 s).
            failureThreshold: 540
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /root/.cache
              subPath: cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/model
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-4-3-36b
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    # Dot-free Tailscale hostname; register this in Aperture as an
    # upstream at http://hermes-4-3-36b.<tailnet>.ts.net:8000/v1
    tailscale.com/hostname: "hermes-4-3-36b"
spec:
  selector:
    app: hermes-4-3-36b
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
