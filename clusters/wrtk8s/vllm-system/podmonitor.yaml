apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: qwen-vllm
  namespace: vllm-system
  labels:
    release: kube-prometheus-stack
spec:
  # Every model pod carries vllm-model: "true" (also used for the one-model-
  # per-node anti-affinity), so new models are scraped without editing this.
  # The old app-name list missed qwen38-27b-nvfp4 (app label has the -nvfp4).
  selector:
    matchLabels:
      vllm-model: "true"
  podMetricsEndpoints:
    - port: http
      interval: 30s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
