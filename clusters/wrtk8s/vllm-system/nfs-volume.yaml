apiVersion: v1
kind: PersistentVolume
metadata:
  name: vllm-models
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.1.1.4
    path: /volume1/kubernetes/vllm
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: vllm-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: vllm-models
  resources:
    requests:
      storage: 500Gi
