# Qwen3.8 27B FP8 — dense hybrid (Gated DeltaNet + Gated Attention) model.
# ~28 GB of fine-grained FP8 (E4M3, block_size 128x128) weights, so plenty of
# headroom on the 128 GB GB10 unified pool for a long-context KV cache.
#
# Config notes:
# - Qwen3_5ForConditionalGeneration is a multimodal (VLM) architecture; we
#   serve it as text here. `--trust-remote-code` because this arch may not
#   be in the pinned nvcr vllm image's registry yet.
# - Native max_position_embeddings is 262144. Matching qwen36-35b-a3b at
#   131072 keeps KV cache well inside memory for the common long-context path.
# - MTP head exists (mtp_num_hidden_layers: 1) but the model card does not
#   ship a recommended speculative-decoding recipe; skip --speculative-config
#   until there's a published one that lines up with vLLM's mtp impl.
# - FP8 is auto-detected from quantization_config in the HF repo — no
#   explicit `--quantization fp8` flag needed.
#
# Pinned to one of the GB10s (spark/sparky). ds41-flash is scaled to 0 to
# free a slot; the vllm-model=true podAntiAffinity enforces one-per-GB10.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-27b-fp8
  namespace: vllm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-27b-fp8
  template:
    metadata:
      labels:
        app: qwen38-27b-fp8
        vllm-model: "true"
    spec:
      terminationGracePeriodSeconds: 15
      runtimeClassName: nvidia
      hostAliases:
        - ip: 10.1.1.164
          hostnames: [hf.jgarr.net]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - spark
                      - sparky
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vllm-model: "true"
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          # vLLM-maintained Qwen3.8 image per the official GB10 recipe at
          # https://recipes.vllm.ai/Qwen/Qwen3.8-27B?hardware=dgx_spark_gb10
          # — carries the Gated DeltaNet + Gated Attention kernels this
          # hybrid-attention model needs. Previous nvcr 26.09 pin fell back
          # to Triton/eager kernels and hit ~8 tok/s decode.
          image: vllm/vllm-openai:qwen38
          # vllm/vllm-openai images have ENTRYPOINT ["vllm","serve"], so
          # args starts at the model positional — no leading `vllm serve`.
          args:
            - Qwen/Qwen3.8-27B-FP8
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - qwen3.8-27b-fp8
            - --trust-remote-code
            - --gpu-memory-utilization
            - "0.8"
            - --tensor-parallel-size
            - "1"
            - --enable-auto-tool-choice
            # qwen3_coder parser per the recipe; qwen3_xml (what qwen36 uses)
            # doesn't match this model's tool-call format.
            - --tool-call-parser
            - qwen3_coder
            - --reasoning-parser
            - qwen3
            # VLM encoder sharding mode required by the recipe.
            - --mm-encoder-tp-mode
            - data
            - --enable-prefix-caching
            - --max-num-seqs
            - "8"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/huggingface
            # Recipe sets VLLM_USE_RUST_FRONTEND=1 but its minijinja renderer
            # chokes on `{% generation %}` in Qwen3.8's chat template. Python
            # frontend handles it. The hybrid-attention kernel perf win comes
            # from the image, not the frontend.
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            # ~28 GB cold download budget: 360 * 10 s = 60 min.
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /root/.cache
              subPath: cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/model
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-27b-fp8
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "qwen38-27b-fp8"
spec:
  selector:
    app: qwen38-27b-fp8
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
