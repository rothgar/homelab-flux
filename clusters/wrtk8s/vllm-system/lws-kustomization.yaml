# The LeaderWorkerSets in lws/ need the CRDs from lws-system's HelmRelease, which the root sync applies but Helm
# installs afterwards; applied separately so the root sync never dry-runs an unknown kind. Retries until they exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vllm-lws
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./clusters/wrtk8s/vllm-system/lws
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
