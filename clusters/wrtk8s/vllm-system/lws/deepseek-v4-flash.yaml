# DeepSeek-V4-Flash-0731 across both DGX Sparks (tensor parallel 2, one GB10 per rank), ported from the dgx cluster
# (dgx-example manifests/deepseek-v4-flash.yaml), which ported eugr's spark-vllm-docker recipe:
# github.com/eugr/spark-vllm-docker/blob/main/recipes/deepseek-v4-flash-0731.yaml
#
# Changes from the dgx cluster: leader on spark and worker on sparky (were jarvis/ultron), weights on the `model` user
# volume (/var/mnt/model), HF_TOKEN from the hf-token secret, a Tailscale-exposed Service instead of the ts-plug
# sidecar, and no hard-coded Hugging Face CDN IPs in hostAliases.
#
# Scaled to 0: this needs both Sparks' GPUs, so qwen36-35b-a3b (spark) and ds41-flash (sparky) have to be scaled to 0
# first. It also needs the ConnectX-7 link between spark and sparky up; see patches/cx7-spark.yaml before wiring that.
#
# eugr/spark-vllm-b12x is a "B12X" (Blackwell 12x) build of vLLM: --moe-backend b12x, --linear-backend b12x,
# --attention-backend B12X_MLA_SPARSE and the VLLM_USE_B12X_* toggles are the DSV4-native fast paths. Ranks find each
# other with vLLM's built-in torch.distributed (--nnodes 2 --node-rank N --master-addr $LWS_LEADER_ADDRESS); the
# image doesn't ship Ray.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: deepseek-v4-flash
  namespace: vllm-system
spec:
  replicas: 0
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: deepseek-v4-flash
          app.kubernetes.io/component: leader
          vllm-model: "true"
      spec:
        runtimeClassName: nvidia
        # NCCL_IB_HCA below is per node, so each rank stays on its node; a swap would also lose the weight cache
        nodeSelector:
          kubernetes.io/hostname: spark
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        # ndots:1: names with a dot are tried as absolute first, before the jgarr.net search suffix, whose wildcard
        # record would otherwise answer for huggingface.co and friends. Cluster DNS stays (ClusterFirst): the ranks
        # rendezvous through the LeaderWorkerSet's headless Service name.
        dnsConfig:
          options:
            - name: ndots
              value: "1"
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        containers:
          - name: vllm
            image: docker.io/eugr/spark-vllm-b12x:nightly-20260810
            command:
              - bash
              - -c
              - |
                exec vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
                  --served-model-name deepseek-v4-flash-0731 \
                  --host 0.0.0.0 \
                  --port 8000 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --pipeline-parallel-size 1 \
                  --nnodes 2 \
                  --node-rank 0 \
                  --master-addr ${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --kv-cache-dtype fp8 \
                  --block-size 256 \
                  --max-model-len 524288 \
                  --max-num-seqs 8 \
                  --max-num-batched-tokens 8192 \
                  --gpu-memory-utilization 0.85 \
                  --enable-prefix-caching \
                  --tokenizer-mode deepseek_v4 \
                  --tool-call-parser deepseek_v4 \
                  --enable-auto-tool-choice \
                  --reasoning-parser deepseek_v4 \
                  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
                  --default-chat-template-kwargs.thinking=true \
                  --default-chat-template-kwargs.reasoning_effort=high \
                  --load-format auto \
                  --moe-backend b12x \
                  --linear-backend b12x \
                  --attention-backend B12X_MLA_SPARSE \
                  --max-cudagraph-capture-size 64 \
                  --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
                  --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}'
            env: &env
              - name: HF_HOME
                value: /models
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
              # plain safetensors downloads; Xet's chunked path adds a CAS server and more to go wrong
              - name: HF_HUB_DISABLE_XET
                value: "1"
              - name: DO_NOT_TRACK
                value: "1"
              # eugr recipe: B12X kernels, AOT compile, GB10 arch
              - name: CUTE_DSL_ARCH
                value: sm_121a
              - name: VLLM_USE_AOT_COMPILE
                value: "1"
              - name: VLLM_USE_BREAKABLE_CUDAGRAPH
                value: "0"
              - name: VLLM_USE_MEGA_AOT_ARTIFACT
                value: "-1"
              - name: VLLM_MEMORY_PROFILE_INCLUDE_ATTN
                value: "1"
              - name: VLLM_USE_FLASHINFER_SAMPLER
                value: "1"
              - name: VLLM_USE_B12X_WO_PROJECTION
                value: "1"
              - name: VLLM_USE_B12X_MHC
                value: "1"
              - name: VLLM_USE_B12X_FP8_GEMM
                value: "1"
              - name: VLLM_USE_B12X_MOE
                value: "1"
              - name: VLLM_USE_B12X_SPARSE_INDEXER
                value: "1"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "1"
              - name: B12X_MLA_SM120_UNIFIED
                value: "1"
              - name: B12X_MOE_FORCE_A8
                value: "1"
              # NCCL over ConnectX-7 RoCE, single rail on mlx5_0 (enp1s0f0np0). On the dgx cluster that was the
              # cabled port on both nodes; on wrtk8s, check the spark <-> sparky cable map first:
              #   cat /sys/class/infiniband/mlx5_*/ports/1/phys_state   (in a pod holding the gpu-rdma claim)
              - name: NCCL_IB_HCA
                value: "=mlx5_0:1"
              # RoCEv2 over the link-local IPv6 GID (the CX-7 ports have no IPv4). patches/cx7-spark.yaml would add a
              # /30 and disable IPv6 on the port; if that's ever wired, this index changes
              - name: NCCL_IB_GID_INDEX
                value: "1"
              # direct cable, no switch/PFC: a long QP retransmit timeout (4.096 us * 2^22, ~17 s) so transient
              # stalls don't become RETRY_EXC_ERR
              - name: NCCL_IB_TIMEOUT
                value: "22"
              # eth0 (flannel) carries only NCCL's bootstrap socket; collectives go over the HCA above
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_DEBUG
                value: INFO
              - name: VLLM_LOGGING_LEVEL
                value: DEBUG
              - name: PYTHONUNBUFFERED
                value: "1"
              # room for torch.compile / AOT compile on a cold start
              - name: VLLM_ENGINE_INIT_TIMEOUT_S
                value: "3600"
            ports:
              - containerPort: 8000
                name: http
              - containerPort: 29500
                name: dist-coord
            startupProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              # first start downloads the weights and AOT-compiles: up to 2 h
              failureThreshold: 720
            livenessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
            volumeMounts: &mounts
              - name: models
                mountPath: /models
              - name: shm
                mountPath: /dev/shm
        volumes: &volumes
          - name: models
            hostPath:
              path: /var/mnt/model
              type: DirectoryOrCreate
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: deepseek-v4-flash
          app.kubernetes.io/component: worker
          vllm-model: "true"
      spec:
        runtimeClassName: nvidia
        nodeSelector:
          kubernetes.io/hostname: sparky
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        dnsConfig:
          options:
            - name: ndots
              value: "1"
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        containers:
          - name: vllm
            image: docker.io/eugr/spark-vllm-b12x:nightly-20260810
            command:
              - bash
              - -c
              - |
                exec vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
                  --served-model-name deepseek-v4-flash-0731 \
                  --host 0.0.0.0 \
                  --port 8000 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --pipeline-parallel-size 1 \
                  --nnodes 2 \
                  --node-rank 1 \
                  --master-addr ${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --headless \
                  --kv-cache-dtype fp8 \
                  --block-size 256 \
                  --max-model-len 524288 \
                  --max-num-seqs 8 \
                  --max-num-batched-tokens 8192 \
                  --gpu-memory-utilization 0.85 \
                  --enable-prefix-caching \
                  --tokenizer-mode deepseek_v4 \
                  --tool-call-parser deepseek_v4 \
                  --enable-auto-tool-choice \
                  --reasoning-parser deepseek_v4 \
                  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
                  --default-chat-template-kwargs.thinking=true \
                  --default-chat-template-kwargs.reasoning_effort=high \
                  --load-format auto \
                  --moe-backend b12x \
                  --linear-backend b12x \
                  --attention-backend B12X_MLA_SPARSE \
                  --max-cudagraph-capture-size 64 \
                  --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
                  --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}'
            env: *env
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
            volumeMounts: *mounts
        volumes: *volumes
---
# The OpenAI API on the leader, on the tailnet as deepseek-v4-flash (as ds41-flash). The LeaderWorkerSet makes its own
# headless Service named deepseek-v4-flash for the ranks' rendezvous, so this one takes a different name.
apiVersion: v1
kind: Service
metadata:
  name: deepseek-v4-flash-api
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "deepseek-v4-flash"
spec:
  selector:
    app.kubernetes.io/name: deepseek-v4-flash
    app.kubernetes.io/component: leader
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
