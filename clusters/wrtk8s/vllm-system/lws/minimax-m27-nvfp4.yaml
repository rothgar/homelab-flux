# MiniMax-M2.7 (NVFP4) across both DGX Sparks as one tensor-parallel replica (tp=2, one GB10 per rank), ported from
# the dgx cluster (dgx-example manifests/minimax-m27-nvfp4.yaml), itself from
# nicolerenee/infra:kubernetes/apps/inference/models/minimax-m27-nvfp4.
#
# Changes from the dgx cluster: leader on spark and worker on sparky, weights on the `model` user volume
# (/var/mnt/model), Hugging Face through the pulsys cache with the hf-token secret (as qwen36-35b-a3b) instead of the
# dgx `huggingface` secret, and a Tailscale-exposed Service.
#
# Scaled to 0: needs both Sparks' GPUs (scale qwen36-35b-a3b and ds41-flash to 0 first) and the ConnectX-7 link.
#
# --load-format instanttensor is required on GB10's 128 GB unified memory: it streams weights straight to the GPU with
# almost nothing left on the host. fastsafetensors buffers the whole model in host RAM, and the default mmap loader
# leaves weight pages in the page cache that collide with the GPU autotuner's workspace; both OOM.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: minimax-m27-nvfp4
  namespace: vllm-system
spec:
  replicas: 0
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: minimax-m27-nvfp4
          app.kubernetes.io/component: leader
          vllm-model: "true"
      spec:
        runtimeClassName: nvidia
        nodeSelector:
          kubernetes.io/hostname: spark
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        # jgarr.net's wildcard record answers for hf.jgarr.net from pods; pin pulsys's MetalLB IP
        hostAliases:
          - ip: 10.1.1.164
            hostnames: [hf.jgarr.net]
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        containers:
          - name: vllm
            # eugr spark-vllm (arm64, built for GB10) serves the distributed NVFP4 MoE path correctly; the official
            # vllm/vllm-openai:v0.24.0 loads this model but hangs in multi-node generation (sample_tokens RPC times
            # out, EngineDeadError, 500s). Digest-pinned.
            image: mirror.gcr.io/eugr/spark-vllm:latest@sha256:e58fc97951c6c53822d743d4db2531b749c0ce8dd3a4cd8022b33d1b7495b562
            command:
              - bash
              - -c
              - |
                vllm serve nvidia/MiniMax-M2.7-NVFP4 \
                  --served-model-name nvidia/MiniMax-M2.7-NVFP4 minimax-m2.7 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --gpu-memory-utilization 0.80 \
                  --max-model-len 196608 \
                  --load-format instanttensor \
                  --enable-auto-tool-choice \
                  --tool-call-parser minimax_m2 \
                  --reasoning-parser minimax_m2 \
                  --enable-prompt-tokens-details \
                  --nnodes 2 \
                  --node-rank 0 \
                  --master-addr $${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --host 0.0.0.0 \
                  --port 8000
            env: &env
              - name: HF_HOME
                value: /models
              - name: HF_ENDPOINT
                value: http://hf.jgarr.net
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
              - name: DO_NOT_TRACK
                value: "1"
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: expandable_segments:True
              # NCCL over RDMA on the ConnectX-7 ports in the gpu-rdma claim
              - name: NCCL_IB_HCA
                value: mlx5
              - name: NCCL_NET_GDR_LEVEL
                value: "2"
              # log NCCL init to see where multi-node bootstrap stalls and which transport it picks; drop to WARN
              # once the link is proven
              - name: NCCL_DEBUG
                value: INFO
              - name: NCCL_DEBUG_SUBSYS
                value: INIT,NET,GRAPH,ENV
              # Marlin/Triton for the NVFP4 MoE kernels; without it vLLM 0.24 can pick a DeepGEMM path that asserts on
              # some FP8/FP4 checkpoints
              - name: VLLM_MARLIN_USE_ATOMIC_ADD
                value: "1"
            ports:
              - containerPort: 8000
                name: http
              - containerPort: 29500
                name: dist-coord
            startupProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              # the first start downloads ~230 GB, then loads, compiles and captures CUDA graphs
              failureThreshold: 720
            livenessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
            volumeMounts: &mounts
              - name: models
                mountPath: /models
              - name: shm
                mountPath: /dev/shm
        volumes: &volumes
          - name: models
            hostPath:
              path: /var/mnt/model
              type: DirectoryOrCreate
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: minimax-m27-nvfp4
          app.kubernetes.io/component: worker
          vllm-model: "true"
      spec:
        runtimeClassName: nvidia
        nodeSelector:
          kubernetes.io/hostname: sparky
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        hostAliases:
          - ip: 10.1.1.164
            hostnames: [hf.jgarr.net]
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        containers:
          - name: vllm
            image: mirror.gcr.io/eugr/spark-vllm:latest@sha256:e58fc97951c6c53822d743d4db2531b749c0ce8dd3a4cd8022b33d1b7495b562
            command:
              - bash
              - -c
              - |
                vllm serve nvidia/MiniMax-M2.7-NVFP4 \
                  --served-model-name nvidia/MiniMax-M2.7-NVFP4 minimax-m2.7 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --gpu-memory-utilization 0.80 \
                  --max-model-len 196608 \
                  --load-format instanttensor \
                  --enable-auto-tool-choice \
                  --tool-call-parser minimax_m2 \
                  --reasoning-parser minimax_m2 \
                  --enable-prompt-tokens-details \
                  --nnodes 2 \
                  --node-rank 1 \
                  --master-addr $${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --headless \
                  --host 0.0.0.0 \
                  --port 8000
            env: *env
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
            volumeMounts: *mounts
        volumes: *volumes
---
# The OpenAI API on the leader, on the tailnet as minimax-m27-nvfp4. The LeaderWorkerSet makes its own headless
# Service named minimax-m27-nvfp4 for the ranks' rendezvous, so this one takes a different name.
apiVersion: v1
kind: Service
metadata:
  name: minimax-m27-nvfp4-api
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "minimax-m27-nvfp4"
spec:
  selector:
    app.kubernetes.io/name: minimax-m27-nvfp4
    app.kubernetes.io/component: leader
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
