apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      terminationGracePeriodSeconds: 15
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - spark
      containers:
        - name: vllm
          image: nvcr.io/nvidia/vllm:26.04-py3
          command:
            - vllm
            - serve
            - Qwen/Qwen3.6-27B-FP8
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - qwen3.6-27b
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "65536"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            - --enable-prefix-caching
            - --kv-cache-dtype
            - fp8
            - --max-num-seqs
            - "1"
            - --default-chat-template-kwargs
            - '{"enable_thinking": false}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/huggingface
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /root/.cache
              subPath: cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/longhorn/vllm
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-server
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "vllm"
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
