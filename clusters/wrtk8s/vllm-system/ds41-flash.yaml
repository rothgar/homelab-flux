# antirez/ds4 serving DeepSeek V4.1 Flash Q2.
#
# ds4 is a specialized C/CUDA inference engine (not vLLM, not llama.cpp)
# with an explicit DGX Spark build target (`make cuda-spark`, sm_121).
# No prebuilt container ships; we compile and download at init time.
#
# Model: DeepSeek-V4.1-Flash-Q2.gguf — 341 GiB (152 GiB resident +
# 189 GiB disk-only Engram tables accessed via --ssd-streaming). The
# file lives on the GB10's local NVMe at /var/mnt/model.
#
# One-time cold start downloads 341 GiB from HuggingFace via the
# pulsys HF cache (hf.jgarr.net). Expect ~1-2 h depending on upstream
# bandwidth; subsequent restarts reuse the local file.
#
# Shares the `vllm-model: "true"` label with hermes-4-3-36b and
# qwen36-35b-a3b, so one of those must be scaled to 0 for this pod to
# schedule onto the only remaining GB10 slot.
#
# Tailnet exposure: Service type LoadBalancer with the Tailscale
# operator annotation gives it an in-tailnet DNS name. Register it in
# Aperture at http://ds41-flash.<tailnet>.ts.net:8000/v1 as a new
# upstream so it joins the pool at ai.gerbil-dragon.ts.net.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds41-flash
  namespace: vllm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ds41-flash
  template:
    metadata:
      labels:
        app: ds41-flash
        vllm-model: "true"
    spec:
      terminationGracePeriodSeconds: 30
      runtimeClassName: nvidia
      # jgarr.net wildcard DNS resolves to the WAN IP (unreachable
      # from pods). Pin pulsys HF cache to its MetalLB IP directly.
      # huggingface.co is NOT aliased — this model repo isn't on the
      # pulsys token's allowlist, so we bypass pulsys and pull direct
      # from HF for this one. (If pulsys permissions change, re-add
      # the alias and switch the download URL back to hf.jgarr.net.)
      hostAliases:
        - ip: 10.1.1.164
          hostnames: [hf.jgarr.net]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [spark, sparky]
        # One model per GB10 — ds4 uses the full GPU + 128 GB unified
        # pool + ~341 GB of SSD-streamed weights.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vllm-model: "true"
              topologyKey: kubernetes.io/hostname
      initContainers:
        # Build ds4 against the Spark's Blackwell toolchain. Binaries
        # persist on the host under /var/mnt/model/ds4/ so pod restarts
        # don't repeat the ~5 min nvcc compile.
        - name: build-ds4
          image: nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04
          command:
            - bash
            - -euxc
            - |
              apt-get update -q
              apt-get install -y -q git ca-certificates build-essential
              cd /models
              if [ ! -x /models/ds4/ds4-server ]; then
                rm -rf /models/ds4-tmp
                git clone --depth 1 https://github.com/antirez/ds4.git /models/ds4-tmp
                cd /models/ds4-tmp
                make cuda-spark
                mv /models/ds4 /models/ds4-old 2>/dev/null || true
                mv /models/ds4-tmp /models/ds4
                rm -rf /models/ds4-old
              fi
              echo "ds4 build present at /models/ds4"
              ls -la /models/ds4/ds4-server
          volumeMounts:
            - name: models
              mountPath: /models
        # Download the Q2 GGUF via pulsys. Resumable; re-runs are
        # no-ops once the full 341 GiB file is in place.
        - name: download-model
          image: python:3.14-slim
          command:
            - bash
            - -euxc
            - |
              # Bypass ds4's download_model.sh entirely for this file.
              # The script refuses `curl` for files it deems "too large"
              # (341 GiB) and insists on the hf CLI; the CLI in turn
              # hits pulsys /api endpoints that return bad JSON (observed:
              # "Local entry not found" with CloudFront ID). Direct curl
              # against pulsys's /resolve/main/FILE works and resumes.
              apt-get update -q >/dev/null
              apt-get install -y -q curl ca-certificates >/dev/null
              mkdir -p /models/ds4-gguf
              cd /models/ds4-gguf
              FILE=DeepSeek-V4.1-Flash-Q2.gguf
              URL=https://huggingface.co/antirez/deepseek-v4.1-flash-gguf/resolve/main/$FILE
              # --continue-at - resumes a partial download; the loop
              # restarts on transient drops so a 341 GiB file eventually
              # finishes even if pulsys renegotiates.
              while true; do
                # Model is public (gated:false) so no auth needed.
                # pulsys-issued HF_TOKEN scopes to specific repos; sending
                # it here would 403 for antirez/* since pulsys hasn't
                # whitelisted this repo under that token.
                if curl -fL --retry 20 --retry-delay 30 --retry-connrefused \
                        -C - -o "$FILE.part" "$URL"; then
                  break
                fi
                echo "transfer dropped; retrying in 15s"
                sleep 15
              done
              mv "$FILE.part" "$FILE"
              ls -lh /models/ds4-gguf/
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: ds4-server
          image: nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04
          command:
            - bash
            - -euxc
            - |
              cd /models/ds4
              exec ./ds4-server \
                --cuda \
                -m /models/ds4-gguf/DeepSeek-V4.1-Flash-Q2.gguf \
                --ssd-streaming \
                --ctx 32768 \
                --host 0.0.0.0 \
                --port 8000
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            # Model warm-up + mmap of 341 GiB can take a while even
            # after the download finishes. Budget ~30 min.
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/model
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ds41-flash
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "ds41-flash"
spec:
  selector:
    app: ds41-flash
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
