apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui-ts
  namespace: vllm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-webui-ts-role
  namespace: vllm-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-webui-ts-rolebinding
  namespace: vllm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: open-webui-ts-role
subjects:
  - kind: ServiceAccount
    name: open-webui-ts
    namespace: vllm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: vllm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      serviceAccountName: open-webui-ts
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.10.2
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: ""
            # `;`-separated list of OpenAI-compatible backends. open-webui
            # merges the /v1/models responses from each into one picker.
            - name: OPENAI_API_BASE_URLS
              value: "http://qwen36-27b:8000/v1;http://qwen38-27b:8000/v1"
            - name: OPENAI_API_KEYS
              value: "local;local"
            - name: WEBUI_AUTH
              value: "false"
            - name: HTTP_PROXY
              value: "http://127.0.0.1:1055"
            - name: HTTPS_PROXY
              value: "http://127.0.0.1:1055"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.0.0.0/8,10.244.0.0/16,.cluster.local,.svc"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:stable
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-tailscale-auth
                  key: TS_AUTH
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "true"
            - name: TS_HOSTNAME
              value: "open-webui"
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: "127.0.0.1:1055"
            - name: TS_KUBE_SECRET
              value: "open-webui-ts-state"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: vllm-system
spec:
  selector:
    app: open-webui
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
