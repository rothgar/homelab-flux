apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: vllm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.9.2
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: ""
            - name: OPENAI_API_BASE_URLS
              value: "http://aperture.gerbil-dragon.ts.net/v1"
            - name: OPENAI_API_KEYS
              value: "local"
            - name: WEBUI_AUTH
              value: "false"
            - name: HTTP_PROXY
              value: "http://127.0.0.1:1055"
            - name: HTTPS_PROXY
              value: "http://127.0.0.1:1055"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.0.0.0/8,10.244.0.0/16,.cluster.local,.svc"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:stable
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-tailscale-auth
                  key: TS_AUTH
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "true"
            - name: TS_HOSTNAME
              value: "open-webui"
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: "127.0.0.1:1055"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: vllm-system
spec:
  selector:
    app: open-webui
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
