apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: vllm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.9.2
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: ""
            - name: OPENAI_API_BASE_URL
              value: "http://vllm-server.vllm-system.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "none"
            - name: WEBUI_AUTH
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: vllm-system
spec:
  selector:
    app: open-webui
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
