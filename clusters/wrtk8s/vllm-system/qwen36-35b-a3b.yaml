# Qwen 3.6 35B A3B — MoE with ~35B total / ~3B active per token. Pinned to
# spark (qwen 3.6-27b is scaled to 0 to free the GPU). Weights are ~35 GB in
# bf16 (the base HF repo doesn't ship an FP8 variant), so we let vLLM load
# with dtype auto and keep the KV cache in fp8 for headroom on the 128 GB
# unified pool.
#
# Tailnet exposure via the Tailscale operator — hostname `qwen36-35b-a3b`
# is dot-free (Tailscale DNS-label restriction) and distinct from
# `qwen36-27b` / `qwen38-27b`, so Aperture can register it as its own
# provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-35b-a3b
  namespace: vllm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen36-35b-a3b
  template:
    metadata:
      labels:
        app: qwen36-35b-a3b
    spec:
      terminationGracePeriodSeconds: 15
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - spark
      containers:
        - name: vllm
          # v26.06-py3 segfaults on GB10 with driver 595. Pinning to 26.04.
          image: nvcr.io/nvidia/vllm:26.04-py3
          command:
            - vllm
            - serve
            - Qwen/Qwen3.6-35B-A3B
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - qwen3.6-35b-a3b
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "65536"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_xml
            - --reasoning-parser
            - qwen3
            - --enable-prefix-caching
            - --kv-cache-dtype
            - fp8
            # vLLM auto-picks attention block_size=2096 for this arch to
            # align with Mamba pages; default max-num-batched-tokens=2048
            # trips an assertion. 8192 also gives concurrency headroom.
            - --max-num-batched-tokens
            - "8192"
            - --max-num-seqs
            - "4"
            - --default-chat-template-kwargs
            - '{"enable_thinking": true}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/huggingface
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            # ~35 GB weights need to download from HF on first cold start;
            # give ~1 h total budget (360 * 10 s = 60 min).
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /root/.cache
              subPath: cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/longhorn/vllm
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen36-35b-a3b
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    # Dot-free Tailscale hostname; unique so Aperture can register it as
    # its own upstream (http://qwen36-35b-a3b.<tailnet>.ts.net:8000).
    tailscale.com/hostname: "qwen36-35b-a3b"
spec:
  selector:
    app: qwen36-35b-a3b
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
