apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: vllm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hf-token
  data:
    - secretKey: token
      remoteRef:
        key: vllm-system_hf-token
        property: token
