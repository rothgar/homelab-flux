# Qwen 3.8-Flash-Next 180B MoE (NVFP4) served by SGLang on one GB10.
#
# Ported from https://github.com/andreasknopke/qwen38-one-spark/serve-next.sh.
# The upstream project is a bare `docker run` on a Spark; this is the
# equivalent as a Deployment + Service + patch ConfigMap.
#
# Image `lmsysorg/sglang:dev-qwen38-next-local` (SGLang qwen4-main-squashed
# branch, commit 4ccff141db) is multi-arch (linux/arm64 present), carries
# the GB10-NEXTN NaN fixes (#36811/#38308/#38290), ModelOpt MIXED_PRECISION
# loader (#38121), and the file-backed PLE backend (#37068) upstream.
# A ~286 KiB patch ConfigMap bind-mounts three python files on top:
# the degeneration guard (batch_result_processor.py), the mamba radix
# race fix (mamba_radix_cache.py — SGLANG_DISABLE_CHUNKED_RADIX_INSERT=1
# toggles it), and the tokenizer_manager.py changes.
#
# Model: RadixArk/Qwen3.8-Flash-Next-NVFP4 (~126 GiB on-disk, pulled to
# /models/huggingface on first start). A 48 GiB file-backed PLE table at
# /ple is sparse-written on boot (takes ~10 min cold on fresh file).
#
# Replaces qwen3.6-35b-a3b in the vllm-model slot (one-model-per-GB10
# anti-affinity).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next
  namespace: vllm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-flash-next
  template:
    metadata:
      labels:
        app: qwen38-flash-next
        vllm-model: "true"
    spec:
      terminationGracePeriodSeconds: 30
      runtimeClassName: nvidia
      hostAliases:
        - ip: 10.1.1.164
          hostnames: [hf.jgarr.net]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [spark, sparky]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vllm-model: "true"
              topologyKey: kubernetes.io/hostname
      containers:
        - name: sglang
          image: lmsysorg/sglang:dev-qwen38-next-local
          command:
            - python3
            - -m
            - sglang.launch_server
          args:
            - --model-path
            - RadixArk/Qwen3.8-Flash-Next-NVFP4
            - --served-model-name
            - qwen3.8-flash-next
            - --host
            - "0.0.0.0"
            - --port
            - "30000"
            - --load-format
            - auto
            - --tp-size
            - "1"
            - --prefill-attention-backend
            - triton
            - --decode-attention-backend
            - trtllm_mha
            - --quantization
            - modelopt_fp4
            - --ple-offload-embedding
            # `file` offloads expert weights to disk; required because
            # `pinned` eats the whole GB10 unified pool and OOMs on
            # weight load. The GPU device-feature probe for file-backend
            # needs the pod to expose all NVIDIA capabilities + privileged
            # (see securityContext below), otherwise it refuses with
            # "device reports it does not [support host page tables]".
            - --ple-offload-backend
            - file
            - --ple-offload-dir
            - /ple
            - --language-only
            - --reasoning-parser
            - qwen3
            - --default-chat-template-kwargs
            - '{"enable_thinking": true, "reasoning_effort": "low"}'
            - --tool-call-parser
            - qwen3_coder
            - --mamba-radix-cache-strategy
            - extra_buffer
            - --mem-fraction-static
            - "0.79"
            - --context-length
            - "262144"
            - --chunked-prefill-size
            - "2048"
            - --max-running-requests
            - "4"
            - --allow-auto-truncate
            - --enable-metrics
            - --kv-cache-dtype
            - auto
            - --speculative-algorithm
            - NEXTN
            - --speculative-num-steps
            - "3"
            - --speculative-eagle-topk
            - "1"
            - --speculative-num-draft-tokens
            - "4"
            - --speculative-draft-model-quantization
            - unquant
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/huggingface
            - name: HF_ENDPOINT
              value: http://hf.jgarr.net
            # Expose full NVIDIA capabilities inside the container so the
            # SGLang CUDA device-feature probe sees HMM support (same as
            # Docker's `--gpus all` on a bare Spark).
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            # Patch toggles (see serve-next.sh header comment).
            - name: SGLANG_QWEN4_PLE_FILE_RSS_BUDGET_GB
              value: "8"
            - name: SGLANG_DEGEN_GUARD
              value: "1"
            - name: SGLANG_DEGEN_FORENSIC
              value: "1"
            - name: SGLANG_DEGEN_WINDOW
              value: "999999"
            - name: SGLANG_DEGEN_IMPOSSIBLE_TOKEN
              value: "1"
            - name: SGLANG_IMPOSSIBLE_TOKEN_MAX
              value: "248077"
            - name: SGLANG_DISABLE_CHUNKED_RADIX_INSERT
              value: "1"
            - name: SGLANG_ORPHAN_ABORT
              value: "1"
          # Full driver caps + privileged so the SGLang device-feature
          # probe can see HMM / pageable-host-memory support on the GB10.
          # Without this the file PLE backend refuses to start.
          securityContext:
            privileged: true
          ports:
            - containerPort: 30000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Cold start: ~126 GiB download + ~48 GiB sparse PLE file
            # pre-allocation. Budget ~90 min (540 × 10 s).
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 540
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /root/.cache
              subPath: cache
            - name: ple
              mountPath: /ple
            - name: shm
              mountPath: /dev/shm
            # Three in-container file paths overridden by the patch
            # ConfigMap (one subPath per file).
            - name: sglang-patches
              mountPath: /sgl-workspace/sglang/python/sglang/srt/managers/scheduler_components/batch_result_processor.py
              subPath: batch_result_processor.py
              readOnly: true
            - name: sglang-patches
              mountPath: /sgl-workspace/sglang/python/sglang/srt/mem_cache/mamba_radix_cache.py
              subPath: mamba_radix_cache.py
              readOnly: true
            - name: sglang-patches
              mountPath: /sgl-workspace/sglang/python/sglang/srt/managers/tokenizer_manager.py
              subPath: tokenizer_manager.py
              readOnly: true
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/model
            type: DirectoryOrCreate
        - name: ple
          hostPath:
            path: /var/mnt/model/qwen38-ple-next
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: sglang-patches
          configMap:
            name: sglang-qwen38-patches
---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-flash-next
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "qwen38-flash-next"
spec:
  selector:
    app: qwen38-flash-next
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
