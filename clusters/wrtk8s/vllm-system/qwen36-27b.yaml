apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-27b
  namespace: vllm-system
spec:
  # Scaled to 0 while sparky hosts qwen 3.8-27b (and spark keeps the 3.6
  # 35B A3B MoE). Bump back to 1 to bring 3.6-27b back on sparky — weights
  # stay cached under /var/mnt/models on sparky so a restart is fast.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen36-27b
  template:
    metadata:
      labels:
        app: qwen36-27b
    spec:
      terminationGracePeriodSeconds: 15
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - sparky
      containers:
        - name: vllm
          # v26.06-py3 segfaults in cuStreamCreateWithPriority on GB10 with
          # driver 595. Pinning back to the last known-good tag until upstream
          # ships a fix.
          image: nvcr.io/nvidia/vllm:26.04-py3
          command:
            - vllm
            - serve
            - Qwen/Qwen3.6-27B-FP8
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - qwen3.6-27b
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "65536"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_xml
            - --reasoning-parser
            - qwen3
            - --enable-prefix-caching
            - --kv-cache-dtype
            - fp8
            - --max-num-seqs
            - "4"
            - --default-chat-template-kwargs
            - '{"enable_thinking": true}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/huggingface
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /root/.cache
              subPath: cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            # Sparky's dedicated `models` UserVolume — 2-3.5 TiB partition.
            path: /var/mnt/models
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen36-27b
  namespace: vllm-system
  annotations:
    tailscale.com/expose: "true"
    # Tailscale hostnames must be valid DNS labels — no dots allowed.
    tailscale.com/hostname: "qwen36-27b"
spec:
  selector:
    app: qwen36-27b
  ports:
    - port: 8000
      targetPort: http
  type: LoadBalancer
