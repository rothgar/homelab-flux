# amd64 runner scale set. Workflows opt in with `runs-on: wrtk8s-amd64`.
# DinD sidecar enables `docker build` and services: containers; the
# runner pod gets a dockerd of its own, so workflows don't see the host
# socket.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wrtk8s-amd64
  namespace: github-runners
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: github-runners
  install:
    remediation:
      retries: 3
  values:
    # Name the runner label workflows will target.
    runnerScaleSetName: wrtk8s-amd64
    # User-account scope. If ARC registration fails at the user level,
    # swap this for a per-repo URL (one HelmRelease per repo).
    githubConfigUrl: https://github.com/rothgar
    githubConfigSecret: github-pat
    minRunners: 0
    maxRunners: 5
    containerMode:
      type: dind
    template:
      spec:
        priorityClassName: github-runners-low
        nodeSelector:
          kubernetes.io/arch: amd64
        # Runners are ephemeral and cheap; keep requests small so the
        # low-priority class actually packs them into leftover capacity.
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
