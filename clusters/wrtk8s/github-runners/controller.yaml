# Actions Runner Controller (ARC) — the manager process that watches
# AutoscalingRunnerSet CRs (created by the gha-runner-scale-set chart
# below) and spawns ephemeral runner pods on demand.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: github-runners
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: github-runners
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: arc
    # Controller stays at default priority so it can react promptly even
    # when the cluster is loaded; only the runner pods are low-priority.
    flags:
      watchSingleNamespace: github-runners
