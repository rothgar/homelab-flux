# Non-preempting low-priority class for GitHub Actions runner pods. They
# wait their turn when the cluster is busy instead of evicting workloads.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: github-runners-low
value: 100
preemptionPolicy: Never
globalDefault: false
description: "Low-priority, non-preempting class for ephemeral CI runners."
