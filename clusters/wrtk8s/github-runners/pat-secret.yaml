# PAT for the rothgar user account, consumed by both runner scale sets.
# ARC's gha-runner-scale-set chart expects the key `github_token`.
#
# 1Password item: `github-pat-rothgar-runners`, field `token`.
# Fine-grained PAT scopes needed: Administration RW on self-hosted runners,
# Actions read, Metadata read, across all repos you want runners for.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pat
  namespace: github-runners
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-pat
    template:
      engineVersion: v2
      data:
        github_token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: github-pat-rothgar-runners/token
