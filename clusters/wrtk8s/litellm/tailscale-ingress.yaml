apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-tailscale
  namespace: litellm
spec:
  ingressClassName: tailscale
  rules:
    - host: litellm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
  tls:
    - hosts:
        - litellm
