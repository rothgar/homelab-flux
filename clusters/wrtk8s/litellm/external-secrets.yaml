# Requires two 1Password items (per [[eso-onepassword]] memory format):
#   litellm_litellm-keys       → fields: master-key, salt-key
#   litellm_litellm-db-credentials → fields: username, password
# LITELLM_SALT_KEY must never rotate after models with stored provider
# credentials have been added — losing it bricks decryption of those
# credentials. Mint once, archive the item, treat as root material.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-keys
  namespace: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: litellm-keys
  data:
    - secretKey: masterkey
      remoteRef:
        key: litellm_litellm-keys/master-key
    - secretKey: salt
      remoteRef:
        key: litellm_litellm-keys/salt-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
  namespace: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: litellm-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: litellm_litellm-db-credentials/username
    - secretKey: password
      remoteRef:
        key: litellm_litellm-db-credentials/password
