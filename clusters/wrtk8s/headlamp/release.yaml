apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 5m
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
  values:
    config:
      pluginsDir: /headlamp/plugins
      # Safe because access is gated by Omni's workload service proxy —
      # Omni authenticates the user before requests reach this pod.
      unsafeUseServiceAccountToken: true
    service:
      annotations:
        omni-kube-service-exposer.sidero.dev/port: "50080"
        omni-kube-service-exposer.sidero.dev/label: Headlamp
        omni-kube-service-exposer.sidero.dev/prefix: headlamp
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    initContainers:
      - name: install-flux-plugin
        image: alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 1000
        command:
          - /bin/sh
          - -c
          - |
            wget -O /plugins/flux.tar.gz https://github.com/headlamp-k8s/plugins/releases/download/flux-0.7.0/headlamp-k8s-flux-0.7.0.tar.gz
            mkdir -p /plugins/flux
            tar -xzf /plugins/flux.tar.gz -C /plugins/flux --strip-components=1
            rm /plugins/flux.tar.gz
        volumeMounts:
          - name: plugins
            mountPath: /plugins
    volumes:
      - name: plugins
        emptyDir: {}
    volumeMounts:
      - name: plugins
        mountPath: /headlamp/plugins
