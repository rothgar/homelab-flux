# Front tts with the KEDA HTTP interceptor so the GPU pod scales to zero
# when idle and wakes on demand. See whisper-webui/keda-scaler.yaml for
# the same pattern.
# Selector-less ClusterIP + manual EndpointSlice pointing at the KEDA
# HTTP interceptor's Service ClusterIP in keda ns. The prior ExternalName
# pattern started failing after a tailscale-operator upgrade (~2026-09-14)
# that rejects ExternalName ingress backends as invalid. If the interceptor
# Service is recreated, refresh the ClusterIP below.
apiVersion: v1
kind: Service
metadata:
  name: tts-scaled
  namespace: tts
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: tts-scaled
  namespace: tts
  labels:
    kubernetes.io/service-name: tts-scaled
addressType: IPv4
ports:
  - name: http
    port: 8080
    protocol: TCP
endpoints:
  - addresses:
      - 10.99.255.61  # keda-add-ons-http-interceptor-proxy.keda
    conditions:
      ready: true
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: tts
  namespace: tts
spec:
  hosts:
    - tts.gerbil-dragon.ts.net
    - tts-scaled
    - tts-scaled:8080
  scaleTargetRef:
    name: tts
    kind: Deployment
    apiVersion: apps/v1
    service: tts
    port: 8000
  replicas:
    min: 0
    max: 1
  # 20 min of idle before KEDA scales tts back to 0 replicas. The cold-start
  # penalty on the next hit (model download + torch init) is a few tens of
  # seconds, so a longer keep-warm window makes the interactive UX noticeably
  # smoother in exchange for a bit more idle GPU time.
  scaledownPeriod: 1200
