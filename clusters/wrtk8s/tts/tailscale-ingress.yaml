apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tts-tailscale
  namespace: tts
spec:
  ingressClassName: tailscale
  rules:
    - host: tts
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Route through KEDA HTTP interceptor so the GPU pod can
              # scale to zero. See keda-scaler.yaml.
              service:
                name: tts-scaled
                port:
                  number: 8080
  tls:
    - hosts:
        - tts
