apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambustudio
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bambustudio
  template:
    metadata:
      labels:
        app: bambustudio
    spec:
      runtimeClassName: nvidia
      # Pin hostname so Bambu Studio's encrypted auth blob
      # (BambuNetworkEngine.conf) stays decryptable across pod rollouts.
      # Without this, the ReplicaSet-hashed hostname (e.g. bambustudio-
      # 6f78f667c7-qtwkz) changes on every image bump and invalidates
      # the session, forcing a re-login.
      hostname: bambustudio
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu: "true"
      initContainers:
        # NFS mounts /config mode 777. Bambu Studio's bundled libs refuse to
        # use a world-writable HOME and exit silently — tighten perms first.
        - name: fix-config-perms
          image: busybox:1.38
          command:
            - sh
            - -c
            - chmod 700 /config && chown 1000:1000 /config
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Stable /etc/machine-id survives pod recreations by living on
        # the config PVC. Belt-and-suspenders with `hostname: bambustudio`
        # above — some apps hash identity off machine-id instead of /etc/
        # hostname. Generated once on first boot, reused forever after.
        - name: stable-machine-id
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -s /config/.machine-id ]; then
                head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' > /config/.machine-id
              fi
              # Projected into /host-etc so main container can bind-mount it.
              # Not applied to the main container's /etc here because we
              # can't share writes to /etc across containers in a Pod; see
              # the subPath mount in the bambustudio container instead.
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /config
        # linuxserver image bug: svc-selkies waits forever on /defaults/pid
        # (svc-de actually writes /de-pid). Pre-touching /dev/shm/audio.lock
        # short-circuits the whole wait branch in svc-selkies/run.
        - name: skip-selkies-audio-wait
          image: busybox:1.38
          command:
            - sh
            - -c
            - touch /dev/shm/audio.lock
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      containers:
        - name: bambustudio
          image: lscr.io/linuxserver/bambustudio:v02.08.04.57-ls173
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            - name: PIXELFLUX_WAYLAND
              value: "false"
            # Hardware video encoding for the Selkies WebRTC stream (NVENC).
            # Without this Selkies uses x264enc on CPU, which dominates latency.
            # Note: Zink (GL → Vulkan) was tried for the 3D viewport but crashes
            # Bambu's wxWidgets init — viewport stays on software Mesa.
            - name: SELKIES_ENCODER
              value: nvh264enc
            # Cap framerate + bitrate to keep the WebSocket video path from
            # backpressuring over tailnet. Defaults (60 fps, no bitrate cap)
            # were producing ~15-30 Mbps at 1940x1182 which overwhelmed the
            # browser side and drove reconnect loops.
            - name: SELKIES_FRAMERATE
              value: "30"
            - name: SELKIES_VIDEO_BITRATE
              value: "8000"
          ports:
            - containerPort: 3000
              name: http
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config
              mountPath: /etc/machine-id
              subPath: .machine-id
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bambustudio-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bambustudio
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: bambustudio
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bambustudio-tailscale
  namespace: default
spec:
  ingressClassName: tailscale
  rules:
    - host: bambu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bambustudio
                port:
                  number: 80
  tls:
    - hosts:
        - bambu
