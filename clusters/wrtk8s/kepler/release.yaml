apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kepler
  namespace: kepler
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kepler
      version: "0.11.4"
      sourceRef:
        kind: HelmRepository
        name: kepler
        namespace: kepler
  values:
    image:
      # Chart 0.11.4 pins appVersion=v0.11.4 but upstream never published that
      # image tag — only `latest` and `v0.11.4-N-g<sha>` git-sha tags exist on
      # quay. Track `latest` with Always pull until they cut release tags.
      tag: latest
      pullPolicy: Always

    daemonset:
      # Upstream `latest` is amd64-only (no manifest list, no arm64 build).
      # Restrict to amd64 nodes until arm64 images ship.
      nodeSelector:
        kubernetes.io/arch: amd64
      # Chart default livenessProbe timeoutSeconds=1s. Kepler's /metrics
      # scrape enumerates every process/container/pod on the node; on the
      # control plane (mini, ~60+ pods) each compute cycle takes ~1.1s
      # and the probe times out mid-cycle → kubelet kills → CrashLoop
      # (observed ~867 restarts over 3 days). Bump the probe budget to
      # 10s so the exporter has room to breathe.
      livenessProbe:
        timeoutSeconds: 10
      readinessProbe:
        timeoutSeconds: 10

    config:
      # Chart default is 5s, which pinned Kepler's own attributed power at ~2x
      # any other namespace on otherwise-idle nodes.
      monitor:
        interval: 30s
