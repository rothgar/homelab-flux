apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kepler
  namespace: kepler
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kepler
      version: "0.11.4"
      sourceRef:
        kind: HelmRepository
        name: kepler
        namespace: kepler
  values:
    namespace:
      # Namespace is managed by Flux via namespace.yaml so Kepler's chart must
      # not try to create/own it.
      create: false
      name: kepler

    # ServiceMonitor discovered by the existing kube-prometheus-stack Prometheus
    # (matches serviceMonitorSelector: release=kube-prometheus-stack).
    serviceMonitor:
      enabled: true
      interval: 30s
      path: /metrics
      labels:
        release: kube-prometheus-stack

    daemonset:
      hostPID: true
      # Schedule on every node including the control-plane (mini).
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        privileged: true
        runAsNonRoot: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 400Mi

    config:
      log:
        level: info
        format: text
      # Kepler falls through this ordered list; arm64 (spark) will skip rapl
      # and land on hwmon, x86 nodes will use rapl if MSR access works.
      cpu:
        meters: [rapl, hwmon]
      exporter:
        prometheus:
          enabled: true
      # Enable pod-level metrics via kubelet informer.
      kube:
        enabled: true
        podInformer:
          mode: kubelet
          pollInterval: 15s
