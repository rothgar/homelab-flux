apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kepler
  namespace: kepler
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kepler
      version: "0.11.4"
      sourceRef:
        kind: HelmRepository
        name: kepler
        namespace: kepler
  values:
    namespace:
      # Namespace is managed by Flux via namespace.yaml so Kepler's chart must
      # not try to create/own it.
      create: false
      name: kepler

    image:
      # Chart 0.11.4 pins appVersion to v0.11.4 but upstream never published
      # that image tag — only `latest` and `v0.11.4-N-g<sha>` git-sha tags
      # exist on quay. Track `latest` with Always pull until they cut real
      # release image tags.
      tag: latest
      pullPolicy: Always

    # ServiceMonitor discovered by the existing kube-prometheus-stack Prometheus
    # (matches serviceMonitorSelector: release=kube-prometheus-stack).
    serviceMonitor:
      enabled: true
      interval: 60s
      path: /metrics
      labels:
        release: kube-prometheus-stack

    daemonset:
      hostPID: true
      # Kepler's `latest` image is amd64-only (no manifest list, no arm64
      # build). Skip arm nodes (spark, pi4-*, pi5-*) until upstream ships arm64.
      nodeSelector:
        kubernetes.io/arch: amd64
      # Schedule on every amd64 node including the control-plane (mini).
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        privileged: true
        runAsNonRoot: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 400Mi

    config:
      log:
        level: info
        format: text
      cpu:
        meters: [rapl, hwmon]
      # Reduce Kepler's own CPU / attributed-power overhead: default polling
      # cadence is 5s and the monitor loop takes 200-500ms each iteration.
      monitor:
        interval: 30s
      exporter:
        prometheus:
          enabled: true
      # kube.enabled MUST stay false in the config file — the chart's daemonset
      # already passes `--kube.enable --kube.node-name=$(NODE_NAME)` on the
      # command line. Setting it true here fails config validation because the
      # file has no nodeName (which only the CLI provides via downward API).
      kube:
        enabled: false
