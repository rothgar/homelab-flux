apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcadmin
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcadmin
  template:
    metadata:
      labels:
        app: mcadmin
    spec:
      # itzg/rcon:0.14.1-1 has no arm64 build, and the DB path is version-
      # scoped so we can't switch to :multiarch without also editing the
      # mount path. Pin to amd64 nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        # Pinned to 0.14.1-1 because the DB mount path below is version-
        # scoped (`/opt/rcon-web-admin-0.14.1/db`). Bump the tag and the path
        # together via Renovate.
        - name: rwa
          image: itzg/rcon:0.14.1-1
          env:
            - name: RWA_USERNAME
              value: admin
            # Reuse the RCON password for the panel login too. Panel access is
            # already Ingress-gated with TLS; dual-purposing keeps 1Password
            # simpler.
            - name: RWA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcon-secret
                  key: password
            # rcon-web-admin's HTTP server (4326) and WebSocket server (4327)
            # are on separate ports. Point the browser JS at the /socket path
            # on the same hostname — the Ingress below routes /socket to
            # backend port 4327 while / goes to 4326.
            - name: RWA_WEBSOCKET_URL_SSL
              value: wss://mcadmin.jgarr.net/socket
          ports:
            - containerPort: 4326
              name: http
            - containerPort: 4327
              name: ws
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/rcon-web-admin-0.14.1/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcadmin-data
---
apiVersion: v1
kind: Service
metadata:
  name: mcadmin
  namespace: minecraft
spec:
  type: ClusterIP
  selector:
    app: mcadmin
  ports:
    - port: 4326
      targetPort: http
      name: http
    - port: 4327
      targetPort: ws
      name: ws
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcadmin
  namespace: minecraft
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: mcadmin.jgarr.net
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mcadmin.jgarr.net
      secretName: mcadmin-tls
  rules:
    - host: mcadmin.jgarr.net
      http:
        paths:
          - path: /socket
            pathType: Prefix
            backend:
              service:
                name: mcadmin
                port:
                  number: 4327
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcadmin
                port:
                  number: 4326
