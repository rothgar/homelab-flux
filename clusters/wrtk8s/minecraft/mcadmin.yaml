apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcadmin
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcadmin
  template:
    metadata:
      labels:
        app: mcadmin
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: rwa
          image: itzg/rcon:latest
          env:
            # Tell the browser JS to hit the public hostname over TLS on the
            # same 443 port — Traefik terminates TLS and proxies to the
            # backend, upgrading WebSocket transparently.
            - name: RWA_WEB_WS_PORT
              value: "443"
          ports:
            - containerPort: 4326
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /rwa/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcadmin-data
---
apiVersion: v1
kind: Service
metadata:
  name: mcadmin
  namespace: minecraft
spec:
  type: ClusterIP
  selector:
    app: mcadmin
  ports:
    - port: 4326
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcadmin
  namespace: minecraft
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: mcadmin.jgarr.net
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mcadmin.jgarr.net
      secretName: mcadmin-tls
  rules:
    - host: mcadmin.jgarr.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcadmin
                port:
                  number: 4326
