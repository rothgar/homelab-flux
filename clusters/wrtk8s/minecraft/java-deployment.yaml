apiVersion: apps/v1
kind: Deployment
metadata:
  name: java
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: java
  template:
    metadata:
      labels:
        app: java
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      # itzg/minecraft-server switches to uid=1000 internally, so the mount
      # needs to be owned by that gid before the container starts. Same
      # pattern that fixed the Synology-NFS permission on youtarr-db.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: java
          image: itzg/minecraft-server:latest
          ports:
            - containerPort: 25565
              name: game
              protocol: TCP
            - containerPort: 25575
              name: rcon
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: VANILLA
            - name: VERSION
              value: LATEST
            - name: MEMORY
              value: 2G
            - name: MOTD
              value: "wrtk8s"
            - name: MODE
              value: creative
            - name: DIFFICULTY
              value: normal
            - name: MAX_PLAYERS
              value: "10"
            - name: ONLINE_MODE
              value: "TRUE"
            - name: OPS
              value: tuff_bricks
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcon-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: java-data
