apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcadmin-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  # itzg/rcon runs as root; Synology NFS's root_squash rejects root writes.
  # Use local-path since the admin panel config isn't critical to keep across
  # node moves — worst case is reconfiguring the RCON connection in the UI.
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
