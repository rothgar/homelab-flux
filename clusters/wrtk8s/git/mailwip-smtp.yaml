# Mailwip SMTP credentials for onedev (runs in the `git` namespace).
#
# Onedev stores SMTP config in its Postgres DB, not on disk — the helm
# chart and image both lack a file-based knob. After this Secret syncs,
# configure the mail service manually at:
#     https://git.jgarr.net/~administration/mail-service
# using: kubectl -n git get secret mailwip-smtp -o yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailwip-smtp
  namespace: git
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mailwip-smtp
    template:
      engineVersion: v2
      data:
        SMTP_HOST: "smtp.hanami.run"
        SMTP_PORT: "587"
        SMTP_USERNAME: "noreply@jgarr.net"
        SMTP_PASSWORD: "{{ .password }}"
        SMTP_FROM: "noreply@jgarr.net"
  data:
    - secretKey: password
      remoteRef:
        key: mailwip-smtp/password
