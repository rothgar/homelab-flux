apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onedev
  namespace: git
spec:
  interval: 5m
  chart:
    spec:
      chart: onedev
      version: "16.5.12"
      sourceRef:
        kind: HelmRepository
        name: onedev-charts
        namespace: git
  valuesFrom:
    - kind: ConfigMap
      name: onedev-values
      valuesKey: values.yaml
