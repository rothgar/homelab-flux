apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: registry
  namespace: registry
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {}
  namespaceSelector:
    matchNames:
      - registry
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
