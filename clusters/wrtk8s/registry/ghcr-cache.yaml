apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcr-cache-zot-config
  namespace: registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "tls": {
          "cert": "/certs/tls.crt",
          "key": "/certs/tls.key"
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://ghcr.io"],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "5m",
              "content": [{"prefix": "**"}]
            }
          ]
        },
        "metrics": {
          "enable": true,
          "prometheus": {"path": "/metrics"}
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcr-cache
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghcr-cache
  template:
    metadata:
      labels:
        app: ghcr-cache
    spec:
      initContainers:
        - name: zot-migrate
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -f /var/lib/registry/.zot-migrated ]; then
                echo "wiping distribution layout for Zot migration"
                rm -rf /var/lib/registry/docker /var/lib/registry/scheduler-*
                touch /var/lib/registry/.zot-migrated
              fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      containers:
        - name: zot
          # renovate: image=ghcr.io/project-zot/zot
          image: ghcr.io/project-zot/zot:v2.1.21
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ghcr-cache-data
        - name: config
          configMap:
            name: ghcr-cache-zot-config
        - name: certs
          secret:
            secretName: registry-tls
---
apiVersion: v1
kind: Service
metadata:
  name: ghcr-cache
  namespace: registry
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ghcr.cr.jgarr.net
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: registry-registry-insecure@kubernetescrd
spec:
  type: LoadBalancer
  selector:
    app: ghcr-cache
  ports:
    - port: 443
      targetPort: 5000
      name: https
    - port: 5001
      targetPort: 5000
      name: metrics
