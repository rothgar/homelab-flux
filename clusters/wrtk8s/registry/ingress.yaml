# Traefik Ingresses in front of each registry-namespace LoadBalancer
# Service. external-dns's --source=service silently drops LB Services
# with hostname annotations on this cluster (v0.21.0 + K8s 1.36 +
# `ipMode: VIP` combination); Ingresses under --source=ingress are the
# only reliable way to get Cloudflare A records published for these
# hostnames. Nodes still use the direct MetalLB IPs via
# `patches/mirrors.yaml` StaticHostConfig for image-pull fast path; this
# is just for external `dig` + non-mirrored clients.
#
# Backend scheme is HTTPS because the registry pods serve their own
# letsencrypt-issued cert on :5000. Traefik dials pod IPs directly and
# the cert has no IP SANs, so cert verify is skipped on this
# CNI-internal hop via the ServersTransport below.
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: registry-insecure
  namespace: registry
spec:
  insecureSkipVerify: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: registry
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: cr.jgarr.net
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cr.jgarr.net
      secretName: cr-jgarr-net-tls
  rules:
    - host: cr.jgarr.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-cache
  namespace: registry
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: docker.cr.jgarr.net
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - docker.cr.jgarr.net
      secretName: docker-cr-jgarr-net-tls
  rules:
    - host: docker.cr.jgarr.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docker-cache
                port:
                  number: 443
