# Create the following item in 1Password (wrtk8s vault):
#   Title:   youtarr_youtarr-db-credentials
#   Fields:  username (login) = youtarr
#            password (login) = <random 32ch>
#            root-password    = <random 32ch>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtarr-db-credentials
  namespace: youtarr
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: youtarr-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: youtarr_youtarr-db-credentials/username
    - secretKey: password
      remoteRef:
        key: youtarr_youtarr-db-credentials/password
    - secretKey: root-password
      remoteRef:
        key: youtarr_youtarr-db-credentials/root-password
