apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtarr-db
  namespace: youtarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: youtarr-db
  template:
    metadata:
      labels:
        app: youtarr-db
    spec:
      # MariaDB supports running as an arbitrary user. Setting runAsUser=1000
      # avoids the image's default uid 999 which Synology's NFS rejects.
      # fsGroup=1000 tells kubelet to chown the PVC mount to gid 1000 so the
      # non-root mysqld can write to it.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: youtarr-db-credentials
                  key: root-password
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: youtarr-db-credentials
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: youtarr-db-credentials
                  key: password
            - name: MARIADB_DATABASE
              value: youtarr
            - name: TZ
              value: America/Los_Angeles
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: youtarr-db
---
apiVersion: v1
kind: Service
metadata:
  name: youtarr-db
  namespace: youtarr
spec:
  type: ClusterIP
  selector:
    app: youtarr-db
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
