apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtarr-db
  namespace: youtarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: youtarr-db
  template:
    metadata:
      labels:
        app: youtarr-db
    spec:
      # linuxserver.io image supports PUID/PGID so we can run mysqld as uid
      # 1000 (Synology's NFS accepts this uid; the mariadb.org image's fixed
      # uid 999 is denied). Same pattern as bambustudio/mealie.
      initContainers:
        - name: fix-perms
          image: busybox:1.38
          command:
            - sh
            - -c
            - chown -R 1000:1000 /config
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /config
      containers:
        - name: mariadb
          image: lscr.io/linuxserver/mariadb:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: youtarr-db-credentials
                  key: root-password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: youtarr-db-credentials
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: youtarr-db-credentials
                  key: password
            - name: MYSQL_DATABASE
              value: youtarr
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: youtarr-db
---
apiVersion: v1
kind: Service
metadata:
  name: youtarr-db
  namespace: youtarr
spec:
  type: ClusterIP
  selector:
    app: youtarr-db
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
