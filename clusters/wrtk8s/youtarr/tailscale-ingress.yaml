apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: youtarr-tailscale
  namespace: youtarr
spec:
  ingressClassName: tailscale
  rules:
    - host: youtarr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: youtarr
                port:
                  number: 80
  tls:
    - hosts:
        - youtarr
