apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: gitea
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: git.jgarr.net
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - git.jgarr.net
      secretName: gitea-tls
  rules:
    - host: git.jgarr.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-http
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
# tailscale-operator's ingress-reconciler can't route to a headless Service
# (ClusterIP: None) — it uses .spec.clusterIP as the dial address and marks
# empty as "no valid backends". The helm-installed `gitea-http` is headless,
# so we add a small ClusterIP shim with the same selector and point the
# tailscale ingress at that.
apiVersion: v1
kind: Service
metadata:
  name: gitea-http-clusterip
  namespace: gitea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-tailscale
  namespace: gitea
spec:
  ingressClassName: tailscale
  rules:
    - host: git
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-http-clusterip
                port:
                  number: 3000
  tls:
    - hosts:
        - git
