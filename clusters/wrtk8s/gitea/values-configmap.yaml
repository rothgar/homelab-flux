apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-values
  namespace: gitea
data:
  values.yaml: |
    replicaCount: 1

    ingress:
      enabled: false

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: LoadBalancer
        port: 22
        # Pin to the traefik LB IP so git.jgarr.net can resolve to a single
        # address that serves both HTTPS and SSH. Metallb permits the sharing
        # via the allow-shared-ip annotation matched on the traefik service.
        loadBalancerIP: 10.1.1.152
        annotations:
          external-dns.alpha.kubernetes.io/hostname: git.jgarr.net
          metallb.universe.tf/allow-shared-ip: gitea-web-ssh

    persistence:
      enabled: true
      storageClass: nfs-synology
      size: 20Gi
      accessModes:
        - ReadWriteMany

    gitea:
      config:
        database:
          DB_TYPE: sqlite3
        server:
          DOMAIN: git.jgarr.net
          ROOT_URL: https://git.jgarr.net
          SSH_DOMAIN: git.jgarr.net
          SSH_PORT: 22
        session:
          PROVIDER: memory
        cache:
          ADAPTER: memory
        queue:
          TYPE: level

    postgresql:
      enabled: false

    postgresql-ha:
      enabled: false

    redis-cluster:
      enabled: false

    valkey-cluster:
      enabled: false
