apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 5m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: keda
      version: "2.21.1"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  values:
    operator:
      replicaCount: 2
    metricsServer:
      replicaCount: 2
    webhooks:
      replicaCount: 2
    podDisruptionBudget:
      operator:
        maxUnavailable: 1
      metricServer:
        maxUnavailable: 1
      webhooks:
        maxUnavailable: 1
    topologySpreadConstraints:
      operator:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: keda-operator
          matchLabelKeys:
            - pod-template-hash
      metricsServer:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: keda-operator-metrics-apiserver
          matchLabelKeys:
            - pod-template-hash
      webhooks:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: keda-admission-webhooks
          matchLabelKeys:
            - pod-template-hash
