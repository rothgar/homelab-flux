apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: keda
spec:
  interval: 5m
  # HTTP add-on installs HTTPScaledObject CRD and depends on KEDA core being
  # ready first.
  dependsOn:
    - name: keda
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
