apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: keda
spec:
  interval: 5m
  # HTTP add-on installs HTTPScaledObject CRD and depends on KEDA core being
  # ready first.
  dependsOn:
    - name: keda
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  values:
    interceptor:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: interceptor
              app.kubernetes.io/instance: keda-add-ons-http
          matchLabelKeys:
            - pod-template-hash
    scaler:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: scaler
              app.kubernetes.io/instance: keda-add-ons-http
          matchLabelKeys:
            - pod-template-hash
