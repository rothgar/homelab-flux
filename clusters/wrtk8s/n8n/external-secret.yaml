# Create the following item in 1Password (wrtk8s vault):
#   Title:   n8n_n8n-encryption-key
#   Fields:  encryption-key = <random 48-char string>
# The encryption key encrypts saved credentials in n8n's DB. If it changes,
# all stored credentials become unreadable — persist it in 1Password so a
# PVC restore or namespace recreation doesn't lose access.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-encryption-key
  namespace: n8n
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: n8n-encryption-key
  data:
    - secretKey: encryption-key
      remoteRef:
        key: n8n_n8n-encryption-key/encryption-key
