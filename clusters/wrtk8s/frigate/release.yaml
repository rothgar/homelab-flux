apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: frigate
spec:
  interval: 5m
  chart:
    spec:
      chart: frigate
      sourceRef:
        kind: HelmRepository
        name: frigate
        namespace: frigate
  values:
    image:
      tag: 0.17.0-tensorrt
    persistence:
      config:
        enabled: true
        storageClass: local-path
        size: 1Gi
      media:
        enabled: true
    extraInitContainers:
      - name: build-model
        image: python:3.11
        command:
          - sh
          - -c
          - |
            set -e
            MODEL=/config/model_cache/yolov9-t-320.onnx
            if [ -f "$MODEL" ]; then
              echo "Model already exists, skipping build"
              exit 0
            fi
            echo "Building YOLOv9-t ONNX model..."
            apt-get update && apt-get install --no-install-recommends -y cmake libgl1
            pip install --no-cache-dir uv
            cd /tmp
            git clone https://github.com/WongKinYiu/yolov9.git
            cd yolov9
            uv pip install --system -r requirements.txt
            uv pip install --system onnx==1.18.0 onnxruntime "onnx-simplifier==0.4.*" onnxscript
            wget -q https://github.com/WongKinYiu/yolov9/releases/download/v0.1/yolov9-t-converted.pt -O yolov9-t.pt
            sed -i "s/ckpt = torch.load(attempt_download(w), map_location='cpu')/ckpt = torch.load(attempt_download(w), map_location='cpu', weights_only=False)/g" models/experimental.py
            python3 export.py --weights ./yolov9-t.pt --imgsz 320 --simplify --include onnx
            mkdir -p /config/model_cache
            cp yolov9-t.onnx "$MODEL"
            echo "Model build complete"
        volumeMounts:
          - name: config
            mountPath: /config
    gpu:
      nvidia:
        enabled: true
        runtimeClassName: nvidia
    resources:
      limits:
        nvidia.com/gpu: 1
    service:
      type: LoadBalancer
      port: 80
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "frigate"
  valuesFrom:
    - kind: Secret
      name: frigate-config
      valuesKey: config.yaml
