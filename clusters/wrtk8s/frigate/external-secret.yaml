apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-config
  namespace: frigate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: frigate-config
  data:
    - secretKey: config.yaml
      remoteRef:
        key: frigate_frigate-config/config.yaml
