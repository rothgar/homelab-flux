apiVersion: v1
kind: Secret
metadata:
  name: frigate-config
  namespace: frigate
type: Opaque
stringData:
  config.yaml: |
    config: |
      logger:
        default: info
        logs:
          frigate.detector: debug
          frigate.app: debug
      mqtt:
        enabled: true
        host: "mosquitto.mqtt.svc.cluster.local"
        port: 1883
      auth:
        enabled: false
      detectors:
        onnx:
          type: onnx
      objects:
        track:
          - person
          - dog
          - cat
      detect:
        enabled: true
        fps: 5
      snapshots:
        enabled: true
        bounding_box: true
      record:
        enabled: true
      go2rtc:
        streams:
          front_door:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.60:554/h264Preview_01_main
          rear_door:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.62:554/h264Preview_01_main
          backyard:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.61:554/h264Preview_01_main
      cameras:
        front_door:
          ffmpeg:
            inputs:
              - path: rtsp://127.0.0.1:8554/front_door
                input_args: preset-rtsp-restream
                roles:
                  - detect
                  - record
        rear_door:
          ffmpeg:
            inputs:
              - path: rtsp://127.0.0.1:8554/rear_door
                input_args: preset-rtsp-restream
                roles:
                  - detect
                  - record
        backyard:
          ffmpeg:
            inputs:
              - path: rtsp://127.0.0.1:8554/backyard
                input_args: preset-rtsp-restream
                roles:
                  - detect
                  - record
