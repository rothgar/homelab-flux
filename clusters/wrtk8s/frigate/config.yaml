apiVersion: v1
kind: Secret
metadata:
  name: frigate-config
  namespace: frigate
type: Opaque
stringData:
  config.yaml: |
    config: |
      logger:
        default: info
        logs:
          frigate.detector: debug
          frigate.app: debug
      mqtt:
        enabled: true
        host: "mosquitto.mqtt.svc.cluster.local"
        port: 1883
      auth:
        enabled: false
      detectors:
        coral:
          type: edgetpu
          num_threads: 3
      model:
        path: /edgetpu.tflite
        input_tensor: nhwc
        input_dtype: uint8
        labelmap_path: /labelmap/coco-80.txt
      objects:
        track:
          - person
          - dog
          - cat
      detect:
        enabled: true
        fps: 5
      snapshots:
        enabled: true
        bounding_box: true
      record:
        enabled: true
        retain:
          days: 14
      go2rtc:
        streams:
          front_door:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.60:554/h264Preview_01_main
          front_door_sub:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.60:554/h264Preview_01_sub
          rear_door:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.62:554/h264Preview_01_main
          rear_door_sub:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.62:554/h264Preview_01_sub
          backyard:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.61:554/h264Preview_01_main
          backyard_sub:
            - rtsp://admin:qRU4zLZPtwEJjnHqY@10.1.1.61:554/h264Preview_01_sub
      cameras:
        front_door:
          ffmpeg:
            hwaccel_args: preset-vaapi
            inputs:
              - path: rtsp://127.0.0.1:8554/front_door
                input_args: preset-rtsp-restream
                roles:
                  - record
              - path: rtsp://127.0.0.1:8554/front_door_sub
                input_args: preset-rtsp-restream
                roles:
                  - detect
        rear_door:
          ffmpeg:
            hwaccel_args: preset-vaapi
            inputs:
              - path: rtsp://127.0.0.1:8554/rear_door
                input_args: preset-rtsp-restream
                roles:
                  - record
              - path: rtsp://127.0.0.1:8554/rear_door_sub
                input_args: preset-rtsp-restream
                roles:
                  - detect
        backyard:
          ffmpeg:
            hwaccel_args: preset-vaapi
            inputs:
              - path: rtsp://127.0.0.1:8554/backyard
                input_args: preset-rtsp-restream
                roles:
                  - record
              - path: rtsp://127.0.0.1:8554/backyard_sub
                input_args: preset-rtsp-restream
                roles:
                  - detect
