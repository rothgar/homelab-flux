# Tailnet-only path to Frigate. Funnel is NOT used here — public
# exposure goes through Cloudflare Tunnel (see clusters/wrtk8s/
# cloudflared/) which handles the HTTPS backend to port 8971 cleanly.
#
# Port 80 is Frigate's trusted-proxy mode (anonymous admin). Here that's
# acceptable because reaching this hostname at all requires being on the
# tailnet — device identity IS the auth gate. If you add Funnel later,
# switch the public path to Cloudflare Tunnel, not this ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate-tailscale
  namespace: frigate
spec:
  ingressClassName: tailscale
  rules:
    - host: frigate
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frigate
                port:
                  number: 80
  tls:
    - hosts:
        - frigate
