# Public exposure at frigate.jgarr.net via Traefik + letsencrypt.
#
# Frigate's `auth: enabled: false` means ANY ONE with DNS resolution and
# a route to Traefik can view live feeds and recordings. The *.jgarr.net
# wildcard is public DNS, so this record is reachable from the internet
# unless blocked at the edge/firewall. Flip auth on in the frigate config
# Secret (clusters/wrtk8s/frigate/config.yaml) before trusting this URL
# beyond the LAN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate
  namespace: frigate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: frigate.jgarr.net
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - frigate.jgarr.net
      secretName: frigate-tls
  rules:
    - host: frigate.jgarr.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frigate
                # Port 80 is Frigate's trusted-proxy mode (auth bypassed —
                # assumes an upstream handled it). Port 8971 is the
                # user-facing authenticated UI. For public exposure we
                # route to 8971 so Frigate's own login screen gates access.
                port:
                  number: 8971
