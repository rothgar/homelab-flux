apiVersion: v1
kind: ConfigMap
metadata:
  name: rpi-led-daemon-script
  namespace: kube-system
data:
  led-daemon.py: |
    #!/usr/bin/env python3
    """LED activity daemon for Raspberry Pi nodes (libgpiod version).

    Drives two GPIO lines directly via libgpiod — bypassing the kernel's
    /sys/class/leds remapping, which required dtparam/dtoverlay changes
    in config.txt that Talos's Pi images don't honor:

      - LINE_ACT (default BCM 21): PWM burst on network traffic
      - LINE_PWR (default BCM 26): static ON

    The Pi5 header's GPIO chip is `/dev/gpiochip4` (RP1 nexus); the Pi4
    is `/dev/gpiochip0` (BCM2711 pinctrl). We auto-detect by scanning
    chips highest-numbered first — Pi5's chip4 wins on Pi5, falls
    through to chip0 on Pi4. Line numbers (BCM) are the same across
    both so GPIO 21/26 need no per-family remapping.
    """
    import gpiod
    from gpiod.line import Direction, Value
    import os
    import signal
    import sys
    import time
    from pathlib import Path

    LINE_ACT = int(os.environ.get("GPIO_LINE_ACT", "21"))
    LINE_PWR = int(os.environ.get("GPIO_LINE_PWR", "26"))
    NET_IFACE = os.environ.get("NET_IFACE", "end0")
    PWM_DUTY = float(os.environ.get("PWM_DUTY", "0.5"))
    PWM_FREQ_HZ = float(os.environ.get("PWM_FREQ_HZ", "100"))
    POLL_INTERVAL_MS = int(os.environ.get("POLL_INTERVAL_MS", "50"))

    NET_STAT = Path(f"/sys/class/net/{NET_IFACE}/statistics")

    PWM_PERIOD = 1.0 / PWM_FREQ_HZ
    PWM_ON = PWM_PERIOD * PWM_DUTY
    PWM_OFF = PWM_PERIOD - PWM_ON

    # (packet-delta threshold, burst duration ms)
    BURST_TIERS = [
        (5, 40),
        (50, 80),
        (float("inf"), 120),
    ]


    def log(msg: str) -> None:
        print(f"[rpi-led] {msg}", flush=True)


    def find_chip() -> str:
        """Pick a gpiochip that has at least LINE_ACT+1 lines.

        Pi5 RP1 is gpiochip4; Pi4 BCM2711 is gpiochip0. Scanning
        highest-numbered first lands on chip4 for Pi5 and falls
        through to chip0 on Pi4.
        """
        candidates = sorted(
            Path("/dev").glob("gpiochip*"),
            key=lambda p: -int(p.name[len("gpiochip"):]),
        )
        for p in candidates:
            try:
                with gpiod.Chip(str(p)) as c:
                    if c.get_info().num_lines > max(LINE_ACT, LINE_PWR):
                        return str(p)
            except OSError:
                continue
        raise RuntimeError("no suitable gpiochip found")


    def read_packets() -> int:
        rx = int((NET_STAT / "rx_packets").read_text().strip())
        tx = int((NET_STAT / "tx_packets").read_text().strip())
        return rx + tx


    def burst_duration_for(delta: int) -> int:
        for threshold, duration in BURST_TIERS:
            if delta < threshold:
                return duration
        return BURST_TIERS[-1][1]


    def main() -> None:
        chip_path = find_chip()
        log(
            f"started chip={chip_path} act=GPIO{LINE_ACT} pwr=GPIO{LINE_PWR} "
            f"iface={NET_IFACE} duty={PWM_DUTY:.2f} freq={PWM_FREQ_HZ:.0f}Hz "
            f"poll={POLL_INTERVAL_MS}ms"
        )

        req = gpiod.request_lines(
            chip_path,
            consumer="rpi-led-daemon",
            config={
                LINE_PWR: gpiod.LineSettings(
                    direction=Direction.OUTPUT,
                    output_value=Value.ACTIVE,
                ),
                LINE_ACT: gpiod.LineSettings(
                    direction=Direction.OUTPUT,
                    output_value=Value.INACTIVE,
                ),
            },
        )

        def shutdown(signum, _frame):
            log(f"signal {signum}, releasing lines")
            try:
                req.set_values({LINE_ACT: Value.INACTIVE, LINE_PWR: Value.INACTIVE})
            except Exception:
                pass
            req.release()
            sys.exit(0)

        signal.signal(signal.SIGTERM, shutdown)
        signal.signal(signal.SIGINT, shutdown)

        if not NET_STAT.is_dir():
            log(f"iface {NET_IFACE} not present at {NET_STAT}; idle")
            signal.pause()
            return

        prev = read_packets()
        interval = POLL_INTERVAL_MS / 1000.0
        while True:
            cur = read_packets()
            delta = cur - prev
            prev = cur
            if delta > 0:
                cycles = max(1, int(burst_duration_for(delta) / 1000.0 * PWM_FREQ_HZ))
                for _ in range(cycles):
                    req.set_value(LINE_ACT, Value.ACTIVE)
                    time.sleep(PWM_ON)
                    req.set_value(LINE_ACT, Value.INACTIVE)
                    time.sleep(PWM_OFF)
            time.sleep(interval)


    if __name__ == "__main__":
        main()
