apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rpi-led-daemon
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rpi-led-daemon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rpi-led-daemon
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpi-led-daemon
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      nodeSelector:
        hardware.io/raspberry-pi: "true"
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: led
          image: python:3.14-slim
          # pip install gpiod at startup — small (~0.5 MiB wheel), ~2 s.
          # /dev needs to be bind-mounted from the host so /dev/gpiochip*
          # is visible for libgpiod.
          command:
            - sh
            - -c
            - |
              pip install --quiet --no-cache-dir --root-user-action=ignore gpiod
              exec python3 -u /scripts/led-daemon.py
          env:
            - name: GPIO_LINE_ACT
              value: "21"
            - name: GPIO_LINE_PWR
              value: "26"
            - name: NET_IFACE
              value: end0
            - name: PWM_DUTY
              value: "0.5"
            - name: PWM_FREQ_HZ
              value: "100"
            - name: POLL_INTERVAL_MS
              value: "50"
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /sys
            - name: dev
              mountPath: /dev
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
        - name: scripts
          configMap:
            name: rpi-led-daemon-script
            defaultMode: 0755
