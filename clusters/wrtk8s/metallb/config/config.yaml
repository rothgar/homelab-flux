apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb-system
spec:
  addresses:
    - "10.1.1.150-10.1.1.200"
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2advertisement1
  namespace: metallb-system
spec:
  ipAddressPools:
    - default
  # Announce only from nodes that stay on. nodenap powers these off and on,
  # and each change moves announcements and resets open connections.
  nodeSelectors:
    - matchExpressions:
        - key: kubernetes.io/hostname
          operator: NotIn
          values: [3d, qb2, spark, sparky]
