apiVersion: batch/v1
kind: CronJob
metadata:
  name: mini-crawler
  namespace: mini-crawler
spec:
  # Once per day in America/Los_Angeles. Gotify never expires messages,
  # so the dedup fetch always sees every prior post — no midnight
  # keep-alive tick needed.
  schedule: "0 9 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mini-crawler
              image: cr.jgarr.net/mini-crawler:latest
              imagePullPolicy: Always
              envFrom:
                # `gotify` Secret carries GOTIFY_URL / GOTIFY_APP_TOKEN /
                # GOTIFY_CLIENT_TOKEN. Provisioned out-of-band today
                # (kubectl create secret); migrate to ExternalSecret +
                # 1Password when convenient.
                - secretRef:
                    name: gotify
              # --urls keeps the log terse (URLs only, no table).
              # State backend auto-selects `gotify` because GOTIFY_URL
              # and GOTIFY_APP_TOKEN come from the Secret above.
              args:
                - --urls
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
