apiVersion: batch/v1
kind: CronJob
metadata:
  name: mini-crawler
  namespace: mini-crawler
spec:
  # 00:00, 09:00, 15:00 America/Los_Angeles. The midnight run is a
  # keep-alive so the ntfy topic history (used by --state-backend=auto
  # for dedup) stays populated across the >12h gap that ntfy.sh retains
  # messages — same reason hockeytime picked this cadence.
  schedule: "0 0,9,15 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mini-crawler
              image: cr.jgarr.net/mini-crawler:latest
              imagePullPolicy: Always
              env:
                # Full URL, not just the topic slug — the crawler passes this
                # to httpx as-is and rejects it as "missing 'http://' or
                # 'https://' protocol" otherwise.
                - name: NTFY_TOPIC
                  value: https://ntfy.sh/minime-81nzcmb
              # --urls keeps the log terse (URLs only, no table); --state-backend
              # defaults to `auto`, which uses the ntfy topic history for dedup
              # since NTFY_TOPIC is set — no PVC required.
              args:
                - --urls
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
