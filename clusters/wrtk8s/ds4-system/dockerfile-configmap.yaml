apiVersion: v1
kind: ConfigMap
metadata:
  name: ds4-dockerfile
  namespace: ds4-system
data:
  Dockerfile: |
    FROM nvcr.io/nvidia/cuda:12.9.0-devel-ubuntu24.04 AS builder
    RUN apt-get update && apt-get install -y --no-install-recommends \
          build-essential ca-certificates git curl \
        && rm -rf /var/lib/apt/lists/*
    WORKDIR /src
    COPY . /src/
    RUN make cuda-spark

    FROM nvcr.io/nvidia/cuda:12.9.0-runtime-ubuntu24.04
    RUN apt-get update && apt-get install -y --no-install-recommends \
          ca-certificates curl \
        && rm -rf /var/lib/apt/lists/*
    COPY --from=builder /src/ds4-server /usr/local/bin/ds4-server
    COPY --from=builder /src/download_model.sh /usr/local/bin/download_model.sh
    WORKDIR /models
    EXPOSE 8000
    ENTRYPOINT ["/usr/local/bin/ds4-server"]
