kind: Cluster
name: wrtk8s
kubernetes:
  version: v1.36.4
talos:
  version: v1.14.5
features:
  enableWorkloadProxy: true
patches:
  - file: patches/mirrors.yaml
  - file: patches/resolver.yaml
  - file: patches/fstrim.yaml
  - file: patches/fs-scrub.yaml
---
kind: ControlPlane
machines:
  - 6ad2ae00-11cb-11ef-83fc-64bc3f0e2e00
patches:
  # cluster.allowSchedulingOnControlPlanes was inlined here, but Omni
  # 1.12.4 auto-emits the same key in its own cluster config and Talos
  # 1.14 rejects the duplicate. Same hazard as the kube-upgrade double-
  # emit in Omni 1.10.4. If scheduling on the CP ever stops working,
  # re-add here only after verifying Omni isn't emitting it.
  - file: patches/kube-workloads.yaml
---
kind: Workers
machines:
  - 03000200-0400-0500-0006-000700080009
  - 30303031-3030-3030-6230-316439626200
  - 30303031-3030-3030-3838-313163373500
  - 62663165-6138-3361-6134-656562386600
  - d68614b6-bfde-11d3-8000-4cbb472dcf87 # spark (arm64, DGX Spark GB10)
  - 4c5615cc-1dd2-11b2-8000-4cbb47001716 # sparky (arm64, DGX Spark GB10)
---
kind: Machine
systemExtensions:
  - siderolabs/amd-ucode
  - siderolabs/amdgpu
  - siderolabs/iscsi-tools
  - siderolabs/nvidia-container-toolkit-production
  - siderolabs/nonfree-kmod-nvidia-production
name: 6ad2ae00-11cb-11ef-83fc-64bc3f0e2e00
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/mini.yaml
  - file: patches/k10temp.yaml
  - file: patches/nvidia.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/intel-ucode
  - siderolabs/intel-ice-firmware
  # Google Coral Edge TPU (M.2 A+E card, PCI ID 1ac1:089a). Provides the
  # `gasket` + `apex` kernel modules; /dev/apex_0 appears after reboot.
  # Pair with the google.com/edgetpu device plugin to schedule pods.
  - siderolabs/gasket-driver
  - siderolabs/iscsi-tools
  # Intel iGPU (PCI 8086:461c) — provides i915 kernel module + firmware so
  # /dev/dri is available for frigate VAAPI hardware decoding.
  - siderolabs/i915
name: 03000200-0400-0500-0006-000700080009
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/iota.yaml
  - file: patches/iota-gpu.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 30303031-3030-3030-6230-316439626200
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi4-1.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 30303031-3030-3030-3838-313163373500
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi4-2.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 62663165-6138-3361-6134-656562386600
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi5-1.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/nonfree-kmod-nvidia-production
  - siderolabs/nvidia-container-toolkit-production
  - siderolabs/iscsi-tools
name: d68614b6-bfde-11d3-8000-4cbb472dcf87 # spark (DGX Spark GB10)
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
  # arm64 boot-time indirect-branch tracker disable — GB10 hangs mid-boot
  # without it.
  - arm64.nobti
  # DGX Spark kexec is broken (secondary CPUs come down via PSCI, new kernel
  # never lands). Force firmware reboot instead.
  - kexec_load_disabled=1
patches:
  - file: patches/spark.yaml
  - file: patches/spark-volumeconfig.yaml
  - file: patches/spark-uservolumeconfig.yaml
  - file: patches/spark-nvidia-modules.yaml
  - file: patches/gb10-nvidia.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/nonfree-kmod-nvidia-production
  - siderolabs/nvidia-container-toolkit-production
  - siderolabs/iscsi-tools
name: 4c5615cc-1dd2-11b2-8000-4cbb47001716 # sparky (DGX Spark GB10)
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
  - arm64.nobti
  - kexec_load_disabled=1
patches:
  - file: patches/sparky.yaml
  - file: patches/spark-nvidia-modules.yaml
  - file: patches/gb10-nvidia.yaml
  - file: patches/kubelet.yaml
