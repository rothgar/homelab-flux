kind: Cluster
name: wrtk8s
kubernetes:
  version: v1.36.4
talos:
  version: v1.14.0
features:
  enableWorkloadProxy: false
patches:
  - file: patches/mirrors.yaml
  - file: patches/resolver.yaml
  - file: patches/fstrim.yaml
---
kind: ControlPlane
machines:
  - 6ad2ae00-11cb-11ef-83fc-64bc3f0e2e00
patches:
  - idOverride: 400-wrtk8s-control-planes-untaint
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true
  - file: patches/flannel.yaml
  - file: patches/kube-proxy.yaml
  - file: patches/coredns.yaml
---
kind: Workers
machines:
  - 03000200-0400-0500-0006-000700080009
  - 30303031-3030-3030-6230-316439626200
  - 30303031-3030-3030-3838-313163373500
  - 62663165-6138-3361-6134-656562386600
---
kind: Machine
systemExtensions:
  - siderolabs/amd-ucode
  - siderolabs/amdgpu
  - siderolabs/iscsi-tools
  - siderolabs/nvidia-container-toolkit-production
  - siderolabs/nonfree-kmod-nvidia-production
name: 6ad2ae00-11cb-11ef-83fc-64bc3f0e2e00
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/mini.yaml
  - file: patches/k10temp.yaml
  - file: patches/nvidia.yaml
  - file: patches/gpu-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/intel-ucode
  - siderolabs/intel-ice-firmware
  # Google Coral Edge TPU (M.2 A+E card, PCI ID 1ac1:089a). Provides the
  # `gasket` + `apex` kernel modules; /dev/apex_0 appears after reboot.
  # Pair with the google.com/edgetpu device plugin to schedule pods.
  - siderolabs/gasket-driver
  - siderolabs/iscsi-tools
  # Intel iGPU (PCI 8086:461c) — provides i915 kernel module + firmware so
  # /dev/dri is available for frigate VAAPI hardware decoding.
  - siderolabs/i915
name: 03000200-0400-0500-0006-000700080009
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/iota.yaml
  - file: patches/iota-gpu.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 30303031-3030-3030-6230-316439626200
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi4-1.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 30303031-3030-3030-3838-313163373500
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi4-2.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 62663165-6138-3361-6134-656562386600
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi5-1.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
