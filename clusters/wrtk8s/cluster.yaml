kind: Cluster
name: wrtk8s
kubernetes:
  version: v1.36.4
talos:
  version: v1.13.9
features:
  enableWorkloadProxy: false
patches:
  - file: patches/mirrors.yaml
---
kind: ControlPlane
machines:
  - 6ad2ae00-11cb-11ef-83fc-64bc3f0e2e00
patches:
  - idOverride: 400-wrtk8s-control-planes-untaint
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true
  - file: patches/flannel.yaml
  - file: patches/kube-proxy.yaml
  - file: patches/coredns.yaml
---
kind: Workers
machines:
  - 0564bde4-47b8-c3bd-79e6-63e7a2badf27  # z (Intel + Pascal GPU, re-added 2026-08-28)
  - 4c5615cc-1dd2-11b2-8000-4cbb47001716
  - d68614b6-bfde-11d3-8000-4cbb472dcf87  # sparky (GB10, moved from dgx)
  - 03000200-0400-0500-0006-000700080009
  - 30303031-3030-3030-6230-316439626200
  - 30303031-3030-3030-3838-313163373500
  - 62663165-6138-3361-6134-656562386600
---
kind: Machine
systemExtensions:
  - siderolabs/amd-ucode
  - siderolabs/amdgpu
  - siderolabs/iscsi-tools
  - siderolabs/nvidia-container-toolkit-production
  - siderolabs/nonfree-kmod-nvidia-production
name: 6ad2ae00-11cb-11ef-83fc-64bc3f0e2e00
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/mini.yaml
  - file: patches/k10temp.yaml
  - file: patches/nvidia.yaml
  - file: patches/gpu-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/nvidia-container-toolkit-production
  - siderolabs/nonfree-kmod-nvidia-production
name: 4c5615cc-1dd2-11b2-8000-4cbb47001716
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
  - arm64.nobti
  # DGX Spark kexec is broken (secondary CPUs come down via PSCI, new kernel
  # never lands). Same fix sparky already has — Talos then falls back to a
  # firmware reboot which works. Missing this here is why spark hung after the
  # Talos upgrade drain 2026-09-03.
  - kexec_load_disabled=1
patches:
  - file: patches/spark.yaml
  - file: patches/gb10-nvidia.yaml
  - file: patches/gpu-labels.yaml
  - file: patches/kubelet.yaml
  - file: patches/watchdog.yaml
---
# sparky (GB10, migrated from dgx 2026-08-13). Direct CX-7 cable to spark
# for NCCL/RDMA — matches spark's kernelArgs + extensions and adds
# kexec_load_disabled=1 (DGX Spark kexec is broken: secondary CPUs come
# down via PSCI, new kernel never lands — so Talos falls back to firmware
# reboot).
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nvidia-container-toolkit-production
  - siderolabs/nonfree-kmod-nvidia-production
name: d68614b6-bfde-11d3-8000-4cbb472dcf87
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
  - arm64.nobti
  - kexec_load_disabled=1
patches:
  - file: patches/sparky.yaml
  - file: patches/gb10-nvidia.yaml
  - file: patches/gpu-labels.yaml
  - file: patches/kubelet.yaml
  - file: patches/watchdog.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/nvidia-container-toolkit-lts
  - siderolabs/nonfree-kmod-nvidia-lts
  - siderolabs/intel-ice-firmware
  - siderolabs/intel-ucode
# z has a Pascal GPU (sm_61) — driver 595 in the production branch dropped
# support, so stay on -lts (still ships driver 580 which supports Pascal).
# Re-added 2026-08-28 after the same physical box reconnected to Omni;
# local-path data on the NVMe should still be intact if EPHEMERAL wasn't
# wiped, which will restore frigate/immich-postgres/reaparr PVCs.
name: 0564bde4-47b8-c3bd-79e6-63e7a2badf27
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/z.yaml
  - file: patches/coretemp.yaml
  - file: patches/nvidia.yaml
  - file: patches/gpu-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/intel-ucode
  - siderolabs/intel-ice-firmware
  # Google Coral Edge TPU (M.2 A+E card, PCI ID 1ac1:089a). Provides the
  # `gasket` + `apex` kernel modules; /dev/apex_0 appears after reboot.
  # Pair with the google.com/edgetpu device plugin to schedule pods.
  - siderolabs/gasket-driver
  - siderolabs/iscsi-tools
name: 03000200-0400-0500-0006-000700080009
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/iota.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 30303031-3030-3030-6230-316439626200
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi4-1.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 30303031-3030-3030-3838-313163373500
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi4-2.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
---
kind: Machine
systemExtensions:
  - siderolabs/iscsi-tools
name: 62663165-6138-3361-6134-656562386600
kernelArgs:
  - talos.dashboard.disabled=1
  - nfs.nfs4_disable_idmapping=1
patches:
  - file: patches/pi5-1.yaml
  - file: patches/pi-labels.yaml
  - file: patches/kubelet.yaml
