apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/master/deployments/multus-daemonset-thick.yml
patches:
  # Talos requires /var/run/netns instead of /run/netns
  - target:
      kind: DaemonSet
      name: kube-multus-ds
    patch: |
      - op: replace
        path: /spec/template/spec/volumes/3/hostPath/path
        value: /var/run/netns/
      - op: replace
        path: /spec/template/spec/initContainers/0/command
        value:
          - "/usr/src/multus-cni/bin/install_multus"
          - "-d"
          - "/host/opt/cni/bin"
          - "-t"
          - "thick"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 300m
            memory: 150Mi
          requests:
            cpu: 200m
            memory: 100Mi
